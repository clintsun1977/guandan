<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>掼蛋</title>

<!-- added to a phone's home screen, the page opens full screen, without the browser's bars (the way an iPhone gets it) -->

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- the lobby's 掼蛋 in brush calligraphy: only those two characters are fetched -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&text=%E6%8E%BC%E8%9B%8B&display=swap">

<div id="app">
  <header class="bar">
    <span class="brand">掼蛋</span>
    <span class="score"><span class="ours" id="team0" title=""><span class="tn" id="tn0">我方</span><b id="lv0">2</b><small class="lvx" id="lvx0"></small></span><span id="team1" title=""><span class="tn" id="tn1">对方</span><b id="lv1">2</b><small class="lvx" id="lvx1"></small></span></span>
    <div class="tribinfo" id="tribInfo"></div>
    <span class="acts"><span class="optwrap"><button class="link" id="optBtn" aria-expanded="false">选项</button><span class="optmenu" id="optMenu" hidden><span class="optinfo" id="roomOpt" hidden>房间号 <b id="roomOptNum"></b></span><span class="optspec" id="specVoice" hidden></span><button class="link tog" id="sfxBtn" aria-pressed="true">音效</button><button class="link" id="cardBackBtn" title="点一下换牌背：大雁、枫叶、花纹、无（无：一轮打完，牌直接消失，不收牌）">牌背：<span id="backName">大雁</span></button><button class="link tog" id="watchBtn" aria-pressed="false" title="自己打完这一局后，能看到其他人手里的牌">观战</button><button class="link tog" id="confirmBtn" aria-pressed="false" title="选好牌点出牌后，牌先放大，再点确认才出">出牌需确认</button><button class="link tog" id="fsOptBtn" aria-pressed="false" hidden title="让游戏占满整个屏幕，再点一下退出">全屏</button></span></span><button class="link tog" id="micBtn" aria-pressed="false" hidden title="开麦后同桌的人能听到你说话">闭麦</button><button class="link" id="rulesBtn">规则</button><button class="link" id="pauseBtn">暂停</button><button class="link" id="tsBtn">出牌记录</button><button class="link" id="fsBtn">全屏</button><button class="link" id="quitBtn">退出</button></span>
  </header>

  <main class="table" id="table">
    <section class="seat" id="seat2">
      <div class="whorow"><div class="who"><span class="back"></span><span class="name">对家</span><span class="vc"></span><span class="place"></span><span class="stat"></span><span class="clock"></span></div><span class="cnt"></span></div>
    </section>
    <section class="seat" id="seat3">
      <div class="whorow"><div class="who"><span class="back"></span><span class="name">上家</span><span class="vc"></span><span class="place"></span><span class="stat"></span><span class="clock"></span></div><span class="cnt"></span></div>
    </section>
    <div class="mid">
      <div class="emblem t-red" title="本局打的级"><span class="r" id="curLv">2</span></div>
    </div>
    <div id="pile" aria-hidden="true"><div class="probe"></div></div>
    <div class="lastplay" id="lastPlay"></div>
    <div class="prepbig" id="prepBig" hidden><b id="prepL">理牌</b><span class="clock bigclock" id="prepR"><b><span id="prepBigNum">90</span></b></span></div>
    <section class="seat" id="seat1">
      <div class="whorow"><span class="cnt"></span><div class="who"><span class="clock"></span><span class="stat"></span><span class="place"></span><span class="vc"></span><span class="name">下家</span><span class="back"></span></div></div>
    </section>
    <section class="seat" id="seat0">
      <span class="place" id="myPlace"></span>
      <div class="prep" id="prep" hidden><span class="pt" id="prepText">你先出</span><button class="btn primary round" id="readyBtn">理牌<br>结束</button></div>
      <button class="btn primary round" id="deckBtn" hidden>洗牌</button>
      <div class="msg" id="msg"></div>
    </section>
  </main>

  <div class="mebar" id="mebar">
    <div class="left">
      <div class="whorow"><div class="meinfo"><span id="myName">你</span><span class="vc" id="myVc"></span><span class="stat"></span><span class="clock" id="myClock"></span></div><span class="cnt" id="myCnt"></span></div>
      <button class="link" id="sfBtn" title="依次选出手里所有能组成的同花顺（包括用百搭）">同花顺</button>
    </div>
  </div>
  <div class="handwrap">
    <div class="btns" id="btns">
      <button class="btn primary round" id="playBtn">出牌</button>
      <button class="btn primary round" id="returnBtn" hidden>还贡</button>
      <button class="btn round" id="hintBtn">提示</button>
      <button class="btn round" id="passBtn">过</button>
      <button class="btn round" id="clearBtn">重选</button>
    </div>
    <div id="hand"></div>
    <div class="handtools"><button class="link" id="fixBtn" title="把选中的牌放进左边的成组区，作为你拟定的一组牌">成组</button><span class="toolgap"></span><button class="link" id="fanBtn">手持</button><button class="link" id="rowsBtn" title="改成两排">两排</button><button class="link" id="sortBtn" title="恢复成按大小排好的样子">复原</button></div>
  </div>
</div>

<div class="overlay" id="overlay" hidden><div class="panel" id="panel"></div></div>

<div class="lobby" id="lobby" hidden>
  <div class="lobby-box">
    <h1 class="lobby-title">掼蛋</h1>
    <div class="lobby-by">made by Clint</div>
    <div class="lobby-name"><label class="lobby-label" for="nick">玩家昵称</label><input class="lobby-nick" id="nick" maxlength="8" autocomplete="off" placeholder="输入你的昵称"></div>
    <div class="lobby-modes">
      <button class="mode-btn on" data-mode="solo">单人</button>
      <button class="mode-btn" data-mode="host">开房间</button>
      <button class="mode-btn" data-mode="join">进房间</button>
    </div>
    <div class="lobby-rules" id="rulesBox">
      <div class="rule-row"><span class="rule-k">进贡</span><button class="rule-btn" data-rule="trib" data-val="1">进贡</button><button class="rule-btn" data-rule="trib" data-val="0">不进贡</button></div>
      <div class="rule-row"><span class="rule-k">三次打A不过</span><button class="rule-btn" data-rule="aFail" data-val="draw">平局</button><button class="rule-btn" data-rule="aFail" data-val="reset">从2打</button><button class="rule-btn" data-rule="aFail" data-val="once">一次机会</button></div>
      <div class="rule-row"><span class="rule-k">电脑</span><button class="rule-btn" data-rule="bot" data-val="danmcai">danMCai</button><button class="rule-btn" data-rule="bot" data-val="clint">Clint</button><button class="rule-btn" data-rule="bot" data-val="guanzero">GuanZero</button></div>
      <div class="rule-note" id="rulesNote"></div>
    </div>
    <div class="lobby-join" id="joinRow" hidden>
      <input class="lobby-nick" id="roomCode" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="请输入房间号">
      <button class="btn primary" id="joinBtn">进入</button>
    </div>
    <div class="lobby-room" id="roomInfo" hidden><span>房间号</span><b id="roomCodeShow">----</b></div>
    <div class="lobby-status" id="lobbyStatus"></div>
    <div class="lobby-table" id="lobbyTable">
      <button class="seat-btn t-red" data-seat="N" style="grid-area:n"><b>北</b><span>空位</span></button>
      <button class="seat-btn t-blue" data-seat="W" style="grid-area:w"><b>西</b><span>空位</span></button>
      <div class="lobby-felt" style="grid-area:c"><button class="level-btn" id="levelBtn" type="button">选级</button></div>
      <button class="seat-btn t-blue" data-seat="E" style="grid-area:e"><b>东</b><span>空位</span></button>
      <button class="seat-btn t-red" data-seat="S" style="grid-area:s"><b>南</b><span>空位</span></button>
    </div>
    <button class="btn primary lobby-go" id="sitBtn" disabled>坐下开始</button>
    <div class="lobby-ver" id="verTag"></div>
  </div>
  <div class="level-pick" id="levelPick" hidden></div>
  <div class="lobby-testbox">
    <button class="link lobby-test" id="specBtn">观战</button>
    <div class="lobby-join" id="specRow" hidden>
      <input class="lobby-nick" id="specCode" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="房间号">
      <button class="btn primary" id="specGo">进入</button>
    </div>
    <button class="link lobby-test" id="testBtn">训练</button>
    <div class="lobby-join" id="testRow" hidden>
      <input class="lobby-nick" id="testPw" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="密码">
      <button class="btn primary" id="testGo">进入</button>
    </div>
  </div>
</div>

<!-- 训练: after the password, a choice of three kinds of practice; 配牌 has its own screen -->
<div class="trainmenu" id="trainMenu" hidden>
  <div class="tm-box">
    <h1 class="tm-title">训练</h1>
    <div class="tm-btns">
      <button class="tm-card" id="tmPlay"><b>牌局</b><span>打一整局，每一手都能写评语</span></button>
      <button class="tm-card" id="tmEnd"><b>残局</b><span>四家都是电脑，每家 15 张以内，明牌，自己摸索怎么打</span></button>
    </div>
    <button class="link" id="tmBack">返回大厅</button>
  </div>
</div>
