/* Layout: one-screen felt table. Partner on top, opponents left and right, your hand along the bottom edge. */
:root{
  --felt:#1c4a3b;
  --felt-deep:#133629;
  --line:rgba(236,232,218,.14);
  --line-strong:rgba(236,232,218,.32);
  --ink:#ece8da;
  --muted:#9fbcae;
  --card:#fbf8f0;
  --card-edge:#d6cfbf;
  --card-ink:#1d2421;
  --red:#c2313a;
  --gold:#ddb050;
  --wild-face:#fff3cf;
  --wild-face-b:#f1d27e;
  --wild-ink:#8a5a00;
  --latest:#36c9ff;
  --latest-glow:rgba(54,201,255,.55);
  --on-gold:#1d2421;
  --warn:#f08a7a;
  /* the two sides: north and south in red, east and west in blue (text / border tone, and a deeper fill) */
  --red-team:#f06464;--red-team-fill:#c8343d;
  --blue-team:#5ea4ff;--blue-team-fill:#2d6cd0;
  --back-a:#7b2b30;
  --back-b:#933a3f;
  /* the back of every face-down card: the original red stripes, or (switched on by default) the goose photo */
  --back:repeating-linear-gradient(45deg,var(--back-a) 0 3px,var(--back-b) 3px 6px);
  --shade:rgba(0,0,0,.2);
  --scrim:rgba(8,22,17,.72);
  --font-display:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --font-ui:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  color-scheme:dark;
}

html,body{height:100%}
/* taps on a tablet are always taps: no double-tap zoom that could swallow a quick second tap on a button */
html{touch-action:manipulation}
body{font-size:17px}
body{background:radial-gradient(ellipse at 50% 40%,var(--felt) 0%,var(--felt-deep) 100%) fixed,var(--felt-deep);color:var(--ink);font-family:var(--font-ui);overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
#app{height:100%;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}

/* header */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:16px;color:var(--muted)}
.brand{font-family:var(--font-display);font-weight:900;font-size:26px;color:var(--ink);letter-spacing:.08em}
.score{display:flex;gap:14px;font-variant-numeric:tabular-nums}
.t-red{--team:var(--red-team);--team-fill:var(--red-team-fill)}
.t-blue{--team:var(--blue-team);--team-fill:var(--blue-team-fill)}
.score b{font-family:var(--font-display);color:var(--team,var(--ink));font-size:21px;margin-left:4px}
/* the side whose level this round is played at gets a frame */
/* each side's chip: its words and number centred both ways inside the frame */
.score>span{display:inline-flex;align-items:center;justify-content:center;line-height:1;padding:5px 12px;border:1.5px solid transparent;border-radius:8px;color:var(--team,var(--muted))}
.score>span b{line-height:1}
/* the side being played reads "对方打7" on a lit gold chip, so the level in play can be checked at any moment */
.score>span.playing{border-color:var(--team);color:#fff;background:var(--team-fill);font-size:19px;font-weight:700;box-shadow:0 0 16px var(--team)}
.score>span.playing b{color:#fff;font-size:25px;margin-left:2px}
.score>span.playing .lvx{color:#ffe08a}
.bar .acts{display:flex;gap:6px}
/* 选项: sound, music, card back and 出牌需确认 drop down under one button */
.optwrap{position:relative;display:inline-flex}
.optwrap>.link{width:100%;justify-content:center}
.optmenu{position:absolute;z-index:60;top:calc(100% + 6px);right:0;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:8px;
  background:var(--felt-deep);border:1px solid var(--line-strong);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.optmenu[hidden]{display:none}
#optBtn[aria-expanded="true"]{color:var(--ink);border-color:var(--gold)}
/* while it is open the header rises above the play buttons, which on a short screen reach up beside it */
.bar:has(.optmenu:not([hidden])){z-index:30}
#pauseBtn.on{color:var(--on-gold);background:var(--gold);border-color:var(--gold);font-weight:700}
/* voice (online only): 开麦 lit gold while your microphone is on; beside each person's name a bouncing speaker while
   they talk, or a grey 闭麦 while their microphone is off */
#micBtn.on{color:var(--on-gold);background:var(--gold);border-color:var(--gold);font-weight:700;opacity:1}
#micBtn.on::before{background:var(--on-gold)}
.vc{display:none;align-items:center;flex:none}
.vc.talk,.vc.mute{display:inline-flex}
.vc svg{width:1.05em;height:1.05em;fill:var(--gold);display:none}
.vc.talk svg{display:block;animation:vcTalk .45s ease-in-out infinite alternate}
.vc.mute::after{content:"闭麦";font-size:11px;font-weight:400;line-height:1;padding:2px 5px;border-radius:999px;color:var(--muted);border:1px solid var(--line-strong)}
@keyframes vcTalk{from{transform:scale(.8);opacity:.6}to{transform:scale(1.15);opacity:1}}
/* who paid whom and what came back, kept in the corner while the round is played */
.tribinfo{display:flex;flex-direction:column;gap:3px;font-size:16px;color:var(--ink);line-height:1.5}
.tribinfo:empty{display:none}
.tribinfo .ct{font-size:16px;padding:0 5px}
.link{font:inherit;font-size:16px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;white-space:nowrap}
.link:hover{color:var(--ink);border-color:var(--line-strong)}
.tog{display:inline-flex;align-items:center;gap:6px}
.tog::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold)}
.tog[aria-pressed="false"]{opacity:.55}
.tog[aria-pressed="false"]::before{background:transparent;box-shadow:inset 0 0 0 1px var(--muted)}

/* the deck: shuffled and cut in the middle of the table before every deal */
.stack{position:absolute;left:0;top:0;width:var(--cw);height:calc(var(--cw)*1.4);margin:calc(var(--cw)*-.7) 0 0 calc(var(--cw)*-.5);
  transition:transform .32s cubic-bezier(.3,.7,.3,1);pointer-events:none;z-index:7000}
.stack .sb,.flick{position:absolute;inset:0;border-radius:calc(var(--cw)*.1);border:2px solid var(--card);
  background:var(--back);box-shadow:0 1px 2px rgba(0,0,0,.4)}
.flick{left:0;top:0;width:var(--cw);height:calc(var(--cw)*1.4);margin:calc(var(--cw)*-.7) 0 0 calc(var(--cw)*-.5);inset:auto;z-index:7100;transition:transform .16s linear,opacity .16s}
/* your shuffle / cut button: large, in the bottom-right corner where the hand would be, just above the hand tools */
#seat0 #deckBtn{position:fixed;z-index:20;right:max(24px,env(safe-area-inset-right,0px));bottom:64px;pointer-events:auto;--d:92px;font-size:24px;animation:btnCall 1.2s ease-in-out infinite}
/* the shuffle / cut button calls for a click with a soft pulse, so it never reads as a mere label */
@keyframes btnCall{50%{box-shadow:0 0 0 6px rgba(221,176,80,.25),0 0 22px var(--gold)}}
/* dealing */
.flyer{position:fixed;left:0;top:0;width:28px;height:40px;margin:-20px 0 0 -14px;border-radius:4px;border:2px solid var(--card);
  background:var(--back);box-shadow:0 2px 5px rgba(0,0,0,.4);
  z-index:15;pointer-events:none;transition:transform .24s cubic-bezier(.2,.7,.3,1),opacity .24s ease-in}
.gift{position:fixed;left:0;top:0;z-index:16;pointer-events:none;width:0;height:0;transition:transform .6s cubic-bezier(.3,.7,.3,1),opacity .25s}
.gift .card{--cw:70px;position:absolute;left:-35px;top:-49px;box-shadow:0 0 0 3px var(--gold),0 8px 24px rgba(0,0,0,.5)}
.gift .gback{position:absolute;left:-35px;top:-49px;width:70px;height:98px;border-radius:7px;border:2px solid var(--card);
  background:var(--back);box-shadow:0 0 0 3px var(--gold),0 8px 24px rgba(0,0,0,.5)}
.gift .gl{position:absolute;left:50%;top:-80px;transform:translateX(-50%);white-space:nowrap;font-size:16px;font-weight:700;color:var(--on-gold);background:var(--gold);border-radius:999px;padding:3px 12px}

/* table */
.table{flex:1;min-height:0;display:grid;gap:8px;
  grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"top top top" "left mid right" "me me me"}
.seat{display:flex;flex-direction:column;gap:8px;min-width:0}
#seat2{grid-area:top;align-items:center}
#seat3{grid-area:left;align-items:flex-start;justify-content:center}
#seat1{grid-area:right;align-items:flex-end;justify-content:center}
.table{--mid-drop:clamp(16px,5vh,44px)}
/* the side players sit a little low; the level disc stays in the middle, leaving room under it for the last-play line
   and the near player's cards */
#seat3,#seat1{transform:translateY(var(--mid-drop))}
#seat0{grid-area:me;align-items:center;justify-content:flex-end;gap:4px;text-align:center;pointer-events:none}
#seat0 .btn{pointer-events:auto}
.table{position:relative}
/* a seat's box covers a whole corner of the table but only its plate is meant to be touched: the rest lets taps through */
.seat{position:relative;z-index:2;pointer-events:none}
.seat .whorow,.seat .who{pointer-events:auto}
/* the table's cards are the ones everyone needs to read, so they get the larger size; your hand is a little smaller */
#pile{position:absolute;inset:0;z-index:1;pointer-events:none;--cw:clamp(54px,7.2vw,90px)}
#pile .probe{position:absolute;visibility:hidden;width:var(--cw)}
.pc{position:absolute;left:0;top:0;width:var(--cw);height:calc(var(--cw)*var(--cr,1.4));margin:calc(var(--cw)*var(--cr,1.4)*-.5) 0 0 calc(var(--cw)*-.5);
  transform-style:preserve-3d;transition:transform .5s cubic-bezier(.25,.75,.3,1)}
.pc .card,.pc .bk{position:absolute;left:0;top:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.pc .bk{width:100%;height:100%;border-radius:calc(var(--cw)*.1);border:2px solid var(--card);transform:rotateY(180deg);
  background:var(--back);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.pc.old .card{filter:brightness(.72)}
.pc.cur .card{box-shadow:0 0 0 2.5px var(--latest),0 0 16px 3px var(--latest-glow),0 6px 18px rgba(0,0,0,.45);animation:curBlink 1.1s ease-in-out infinite}
@keyframes curBlink{50%{box-shadow:0 0 0 2.5px rgba(54,201,255,.2),0 0 3px 1px rgba(54,201,255,.15),0 6px 18px rgba(0,0,0,.45)}}
/* under the level disc, always: who played what last (or who leads), lit and pulsing, so the play to beat is never in doubt */
.lastplay{position:absolute;z-index:3;left:0;top:0;translate:-50% 0;pointer-events:none;width:max-content;
  font-size:17px;line-height:1.6;font-weight:700;color:#ffe08a;text-align:center;text-wrap:balance;padding:1px 10px;border-radius:10px;
  background:rgba(19,54,41,.78);text-shadow:0 0 10px rgba(221,176,80,.75);animation:lpPulse 1.2s ease-in-out infinite}
.lastplay:empty{display:none}
.lastplay .ct{font-size:15px;text-shadow:none;padding:0 5px;margin:0 2px}
.lastplay small{font-size:14px;color:var(--ink);margin-left:6px}
@keyframes lpPulse{50%{opacity:.55}}
.ktag{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;animation:drop .25s ease-out}
/* what a player is doing, as a lit tag just outside their plate: 理牌中 / 理牌结束 while sorting, 准备出牌 on their
   turn, then 已出牌 or 过 until the trick is taken in. It sits left of the plate for you and your partner, above it
   for the players at the sides, so the plate never changes size and the name, clock and count stay clear */
.stat{position:absolute;z-index:4;top:50%;right:calc(100% + 8px);translate:0 -50%;pointer-events:none;white-space:nowrap;
  font-family:var(--font-ui);font-size:14px;font-weight:800;line-height:1;letter-spacing:.06em;padding:4px 9px 4px 10px;border-radius:999px;
  background:var(--sc);color:#13261e;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 0 10px var(--sc);animation:drop .25s ease-out}
#seat3 .stat,#seat1 .stat{top:auto;bottom:calc(100% + 6px);translate:none}
#seat3 .stat{right:auto;left:0}
#seat1 .stat{right:0}
.stat:empty{display:none}
.stat[data-s="sort"]{--sc:#ece8da}
.stat[data-s="sorted"]{--sc:#6fd690}
.stat[data-s="turn"]{--sc:var(--gold);animation:drop .25s ease-out,statCall 1.1s ease-in-out infinite}
.stat[data-s="played"]{--sc:var(--latest)}
.stat[data-s="pass"]{--sc:#aebfb7}
@keyframes statCall{50%{box-shadow:0 0 0 1px rgba(0,0,0,.25),0 0 2px var(--sc)}}
.ktag{font-size:14px;color:var(--ink);background:var(--shade);border-radius:999px;padding:1px 8px;letter-spacing:.08em}
.ktag.boom{color:var(--on-gold);background:var(--gold);font-weight:600}
.mid{grid-area:mid;z-index:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-width:0;text-align:center}

.who{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 6px;border-radius:10px;background:var(--shade);border:1px solid var(--line);font-size:17px;white-space:nowrap;transition:border-color .2s,box-shadow .2s}
.who .back{width:20px;height:28px;border-radius:3px;border:2px solid var(--card);background:var(--back);flex:none}
.who .name{color:var(--team,var(--ink));font-weight:700}
.seat .who{border-color:color-mix(in srgb,var(--team,#fff) 45%,transparent)}
#myName{color:var(--team,var(--ink));font-weight:700}
.mebar .meinfo{border-color:color-mix(in srgb,var(--team,#fff) 45%,transparent)}
/* the count sits beside the name plate, never inside it */
.whorow{display:flex;align-items:center;gap:12px}
/* card counts stay hidden until a player is down to 10 or fewer, then they shout */
.cnt{display:inline-flex;align-items:baseline;gap:2px;font-family:var(--font-display);font-weight:900;font-size:26px;line-height:1;
  font-variant-numeric:tabular-nums;color:var(--felt-deep);background:var(--warn);border-radius:8px;padding:3px 7px 2px;animation:pop .35s ease-out}
.cnt small{font-family:var(--font-ui);font-size:13px;font-weight:700}
.cnt:empty{display:none}
@keyframes pop{0%{transform:scale(1.6)}100%{transform:scale(1)}}
/* the finishing place: a large label on the table side of each plate, so the four sit symmetrically around the table */
.who,.meinfo{position:relative}
.place{position:absolute;z-index:3;white-space:nowrap;font-family:var(--font-display);font-weight:900;font-size:26px;line-height:1;letter-spacing:.08em;
  padding:6px 12px 6px 14px;border-radius:10px;background:var(--gold);color:var(--on-gold);box-shadow:0 4px 14px rgba(0,0,0,.35)}
#seat2 .place{top:100%;left:50%;transform:translateX(-50%);margin-top:10px}
/* yours stands at the foot of the table, centred, answering your partner's at its head */
#myPlace{position:static;margin-bottom:4px}
#seat3 .place{left:100%;top:50%;transform:translateY(-50%);margin-left:12px}
#seat1 .place{right:100%;top:50%;transform:translateY(-50%);margin-right:12px}
/* gold for first, quiet for second and third, red for last; each one drops in as it is called out */
.place:not(:empty){animation:placeIn .45s cubic-bezier(.2,.9,.3,1.3)}
/* last place is slammed down like a stamp */
.place[data-place="3"]:not(:empty){animation:stampIn .5s cubic-bezier(.3,1.4,.5,1)}
@keyframes stampIn{0%{opacity:0;scale:2.6;rotate:-18deg}60%{opacity:1;scale:.92;rotate:-6deg}100%{scale:1;rotate:0deg}}
@keyframes placeIn{from{opacity:0;scale:.4}to{opacity:1;scale:1}}
.place[data-place="1"],.place[data-place="2"]{background:var(--felt-deep);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.place[data-place="3"]{background:var(--warn);color:var(--felt-deep)}
.place:empty{display:none}
/* first out: the label drops onto the plate from above and keeps a glow */
.place[data-place="0"]:not(:empty){animation:landIn .9s cubic-bezier(.2,.9,.3,1.2);box-shadow:0 0 22px var(--gold),0 4px 14px rgba(0,0,0,.35)}
@keyframes landIn{0%{opacity:0;scale:3;translate:0 -80px}55%{opacity:1;scale:.92;translate:0 0}75%{scale:1.08}100%{scale:1}}
/* the sorting minute: "理牌" on one side of the level disc and the countdown on the other, never over the disc
   (placed by placePrepBig; on a narrow screen both sit above the disc) */
.prepbig{position:absolute;inset:0;z-index:2;pointer-events:none}
.prepbig>*{position:absolute}
.prepbig>b{display:flex;align-items:baseline;gap:6px;white-space:nowrap;
  font-family:var(--font-display);font-weight:900;color:var(--gold);padding:8px 22px;border-radius:16px;background:var(--felt-deep);box-shadow:0 0 0 2px var(--gold),0 8px 30px rgba(0,0,0,.4)}
.prepbig #prepL{font-size:clamp(34px,6vh,56px);letter-spacing:.2em;padding-right:14px}
/* the countdown is the same little alarm clock as the turn clocks, drawn large */
.prepbig .bigclock{font-size:clamp(30px,5.4vh,46px);margin:0;box-shadow:inset 0 0 0 .1em var(--card-edge),0 6px 24px rgba(0,0,0,.45)}
/* the seconds sit smaller in the middle of the face, clear of the bells and the feet */
#prepBigNum{font-size:.8em;line-height:1;position:relative;top:-.06em}
.prepbig small{font-size:24px}

/* the tribute: one line per pair, large, each card shown as a little white card face */
.msg .trib{font-size:clamp(19px,2.4vw,25px);font-weight:700;line-height:1.6;white-space:nowrap}
.msg:has(.trib){max-width:none}
.ct{display:inline-block;background:var(--card);color:#222;border-radius:6px;padding:0 8px;margin:0 3px;line-height:1.3}
.ct.red{color:var(--red)}
.seat.turn .who,.mebar.turn .meinfo{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
/* the turn clock is a little alarm clock: a round face with the seconds in it, two bells on top and two feet */
.clock{position:relative;flex:none;display:inline-flex;align-items:center;justify-content:center;width:2.3em;height:2.3em;margin:.35em .1em .2em;
  border-radius:50%;background:var(--card);border:.16em solid var(--gold);box-shadow:inset 0 0 0 .1em var(--card-edge),0 2px 5px rgba(0,0,0,.35);
  color:var(--card-ink);font-family:var(--font-display);font-weight:900;font-variant-numeric:tabular-nums;font-size:16px;line-height:1}
.clock:empty{display:none}
.clock::before,.clock::after{content:"";position:absolute;top:-.42em;width:.78em;height:.5em;border-radius:.5em .5em .12em .12em;background:var(--gold)}
.clock::before{left:-.12em;transform:rotate(-32deg)}
.clock::after{right:-.12em;transform:rotate(32deg)}
.clock b::before,.clock b::after{content:"";position:absolute;bottom:-.3em;width:.16em;height:.42em;border-radius:.1em;background:var(--gold)}
.clock b::before{left:.42em;transform:rotate(30deg)}
.clock b::after{right:.42em;transform:rotate(-30deg)}
#myClock{font-size:19px}
/* the last five seconds: the clock turns red and rings */
.clock.hurry{border-color:var(--warn);color:var(--red);animation:ring .5s ease-in-out infinite}
.clock.hurry::before,.clock.hurry::after,.clock.hurry b::before,.clock.hurry b::after{background:var(--warn)}
@keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(-14deg)}35%{transform:rotate(12deg)}55%{transform:rotate(-9deg)}75%{transform:rotate(6deg)}}
@keyframes blink{50%{opacity:.2}}
.prep{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px 10px}
.prep .pn{font-family:var(--font-display);font-weight:900;font-size:38px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums;min-width:1.3em}
.prep .pn.hurry{color:var(--warn);animation:blink .5s steps(1) infinite}
.prep .pt{font-size:17px;color:var(--ink)}
/* the "done sorting" button calls for attention: gold, larger, pulsing */
.prep .btn{--d:74px;font-size:19px}
#readyBtn,#nextBtn:not(:disabled){animation:readyFlash 1s ease-in-out infinite}
/* on a computer or tablet these two stand in the action column (placed by placeActionBtns) */
#seat0 #deckBtn.atcol,#seat0 #readyBtn.atcol,#nextBtn.atcol{position:fixed;right:auto;bottom:auto;transform:translate(-50%,-50%);z-index:20;--d:100px;font-size:22px}
@keyframes readyFlash{50%{filter:brightness(1.3);box-shadow:0 0 0 6px rgba(221,176,80,.35),0 0 26px var(--gold)}}
@keyframes pulse{50%{opacity:.25}}

.played{--cw:clamp(32px,4.2vw,48px);display:flex;flex-direction:column;gap:3px;min-height:calc(var(--cw)*var(--cr,1.4) + 16px);justify-content:center}
#seat3 .played{align-items:flex-start}
#seat1 .played{align-items:flex-end}
#seat2 .played,#seat0 .played{align-items:center}
.played .cards{display:flex;flex-wrap:wrap;row-gap:4px;padding-left:calc(var(--cw)*.58);max-width:100%}
#seat1 .played .cards{justify-content:flex-end}
#seat2 .played .cards,#seat0 .played .cards{justify-content:center}
.played .card{position:relative;margin-left:calc(var(--cw)*-.58);animation:drop .22s ease-out}
.played .kind{font-size:11px;color:var(--muted);letter-spacing:.08em}
.played .kind.boom{color:var(--gold);font-weight:600}
.pass{font-size:14px;color:var(--muted);letter-spacing:.2em;padding:4px 0}
@keyframes drop{from{transform:translateY(-8px);opacity:0}}

/* the level being played: a lit disc in the colour of the side whose level it is (red north-south, blue east-west),
   the rank in white, the brightest thing on the table */
.emblem{width:112px;height:112px;border-radius:50%;border:2px solid color-mix(in srgb,var(--team) 60%,#fff);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;gap:2px;
  background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--team) 65%,#fff) 0%,var(--team-fill) 62%,color-mix(in srgb,var(--team-fill) 65%,#000) 100%);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--team) 30%,transparent),0 0 30px color-mix(in srgb,var(--team) 65%,transparent);transition:background .4s,box-shadow .4s}
.emblem .r{font-family:var(--font-display);font-weight:900;font-size:68px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.35)}
/* a short window (a laptop with the browser not maximised): a smaller disc and line leave the near player's cards room */
@media (max-height:700px) and (min-width:561px){
  .emblem{width:84px;height:84px}
  .emblem .r{font-size:50px}
  .lastplay{font-size:15px}
  .lastplay .ct{font-size:13px}
}
.msg{font-size:17px;color:var(--ink);min-height:2.6em;max-width:28em;line-height:1.35;text-wrap:balance}
.msg.err{color:var(--warn)}
.msg small{display:block;color:var(--muted);font-size:15px}

/* controls */
.mebar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
/* on a computer the play buttons stand in a column just to the right of the cards, so the mouse barely travels */
.handwrap{position:relative;flex:none}
@media (min-width:561px){
  /* above the table's seats: with few cards left the hand area is short and the column reaches up over the table */
  #btns{position:absolute;left:0;top:0;z-index:6;flex-direction:column;flex-wrap:nowrap;gap:8px}
  #btns{--d:68px}
  #btns .btn{font-size:19px}
}
.meinfo{display:flex;align-items:center;gap:8px;font-size:17px;padding:5px 10px;border-radius:10px;background:var(--shade);border:1px solid var(--line)}
/* name plates keep one height whatever they show: the turn clock is taller than a name, so it overhangs its plate
   instead of stretching it, and the table never shifts when the turn moves on */
.who{height:2.35em}
.meinfo{height:1.95em}
.who .clock,.meinfo .clock{margin-block:0}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:18px;padding:9px 22px;border-radius:999px;border:1px solid var(--line-strong);background:transparent;color:var(--ink);cursor:pointer;transition:background .15s}
.btn:hover:not(:disabled){background:var(--shade)}
.btn.primary{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:600}
.btn.primary:hover:not(:disabled){background:var(--gold);filter:brightness(1.07)}
.btn:disabled{opacity:.32;cursor:default}
/* the game's action buttons (shuffle / cut, play, hint, pass, clear, tribute / return, done sorting, next round) are
   round, the label centred; a four-character label goes on two lines */
.btn.round{width:var(--d,60px);height:var(--d,60px);padding:0;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;
  text-align:center;line-height:1.15;white-space:nowrap}
.btn:focus-visible,.link:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* hand */
/* z-index:0 keeps the cards' own stacking order inside the hand, below panels and flying cards */
#hand{--cw:clamp(48px,min(7.6vw,12.5vh),86px);position:relative;z-index:0;flex:none;touch-action:none;user-select:none;-webkit-user-select:none;min-height:calc(var(--cw)*var(--cr,1.4) + 20px)}
#hand .card{position:absolute;cursor:pointer;transition:transform .12s ease,left .2s ease,top .2s ease;
  transform:rotate(var(--rot,0deg));transform-origin:50% 50%}
#hand.fan{--cw:clamp(44px,min(6.4vw,10.5vh),74px)}
#hand .card.sel{transform:rotate(var(--rot,0deg)) translateY(-20%)}
/* 出牌需确认: the picked cards are shown side by side at 1.8 times their size in the middle of the table, and 确认 flashes,
   until it is pressed */
#cfmShow{position:fixed;z-index:40;transform:translate(-50%,-50%);display:flex;padding:calc(var(--cw)*.12) calc(var(--cw)*.14);border-radius:14px;
  background:rgba(8,32,24,.85);border:2px solid var(--gold);box-shadow:0 0 30px rgba(221,176,80,.55),0 12px 40px rgba(0,0,0,.5);pointer-events:none;animation:placeIn .18s ease-out}
#cfmShow[hidden]{display:none}
#cfmShow .card{position:relative;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.4)}
#cfmShow .card+.card{margin-left:var(--step)}
#playBtn.cfm{animation:cfmBlink .7s ease-in-out infinite}
@keyframes cfmBlink{50%{background:#fff3c4;box-shadow:0 0 0 7px rgba(221,176,80,.5),0 0 32px var(--gold)}}
#hand.fan .card{cursor:grab}
/* while dragging: an outline where the cards will land, behind the hand, showing through the gap the others open */
.land{position:absolute;z-index:0;pointer-events:none;border:3px dashed var(--gold);border-radius:8px;background:rgba(221,176,80,.18);
  box-shadow:0 0 16px rgba(221,176,80,.55);transform-origin:50% 50%;transition:left .15s ease,top .15s ease,width .15s ease}
#hand .card.drag{transition:none;transform:translateY(-6px) scale(1.06);box-shadow:0 12px 26px rgba(0,0,0,.5);cursor:grabbing}
.mebar .left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.handtools{display:flex;gap:6px;justify-content:flex-end;margin-top:2px}
@media (min-width:561px){.handwrap .handtools{position:absolute;left:0;right:0;bottom:2px;margin:0;z-index:1;pointer-events:none}.handtools .link{pointer-events:auto}}
/* 固定 / 放回 stands at the left end, under the fixed zone */
/* 固定 stands at the left end, the hand's own buttons at the right */
.handtools .toolgap{flex:1}
@media (min-width:561px){#fixBtn{position:absolute;margin:0}}
/* lit whenever it can be pressed, that is once cards are picked */
#fixBtn:not(:disabled){background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:700;box-shadow:0 0 12px rgba(221,176,80,.5)}
.link:disabled{opacity:.35;cursor:default}
/* the fixed zone: a dashed frame on the left of the hand around the groups set aside, each group's kind of play beside it */
#fixZone{position:absolute;z-index:0;pointer-events:none;border:2px dashed rgba(221,176,80,.45);border-radius:12px;background:rgba(221,176,80,.06);transition:background .15s,border-color .15s}
#fixZone.over{border-color:var(--gold);background:rgba(221,176,80,.2);box-shadow:0 0 16px rgba(221,176,80,.5)}
#fixZone .fzl{position:absolute;left:8px;top:1px;font-size:12px;line-height:1.2;color:var(--gold);letter-spacing:.1em;white-space:nowrap}
/* the empty frame names itself in the middle and says how cards get in */
#fixZone.empty .fzl{left:0;right:0;top:30%;text-align:center;font-size:16px;font-weight:700}
#fixZone .fzh{position:absolute;left:8px;right:8px;top:calc(30% + 26px);text-align:center;font-size:12px;line-height:1.4;color:var(--muted)}
@media (max-width:560px){
  /* a phone has only a narrow strip: the name reads downwards and the how-to is left to the button */
  #fixZone.empty .fzl{top:10px;left:50%;right:auto;translate:-50% 0;writing-mode:vertical-rl;font-size:13px;letter-spacing:.3em}
  #fixZone .fzh{display:none}
}
#fixTags{position:absolute;z-index:1;pointer-events:none}
.fzt{position:absolute;font-size:12px;font-weight:700;line-height:1;padding:3px 6px;border-radius:999px;background:var(--felt-deep);color:var(--gold);border:1px solid var(--gold);white-space:nowrap}
.fzt.boom{background:var(--gold);color:var(--on-gold)}
.fzt.loose{color:var(--muted);border-color:var(--line-strong)}
.fzt.hot{background:var(--gold);color:var(--on-gold);border-color:var(--gold);box-shadow:0 0 10px var(--gold)}
#hand .card.fresh{box-shadow:0 0 0 2px var(--gold),0 2px 4px rgba(0,0,0,.4)}
/* a picked card (by hand or by the hint button) stands up in the same bright frame as the newest play on the table */
#hand .card.sel{box-shadow:0 0 0 2.5px var(--latest),0 0 16px 3px var(--latest-glow),0 6px 14px rgba(0,0,0,.35)}
/* a card just handed to you (tribute or return) bobs and flashes for about four seconds, so you can see which it is */
#hand .card.arrive{animation:arrive .5s ease-in-out 8 alternate}
@keyframes arrive{from{translate:0 0;box-shadow:0 0 0 3px var(--gold),0 0 8px var(--gold)}
  to{translate:0 -16%;box-shadow:0 0 0 4px #fff,0 0 26px var(--latest);filter:brightness(1.12)}}

/* card face */
.card{width:var(--cw);height:calc(var(--cw)*var(--cr,1.4));background:var(--card);border:1px solid var(--card-edge);border-radius:calc(var(--cw)*.1);
  box-shadow:0 1px 3px rgba(0,0,0,.35);color:var(--card-ink);font-family:var(--font-display);font-weight:600;flex:none;overflow:hidden}
.card.red{color:var(--red)}
/* a phone: every card face, in the hand and on the table, is cut down to its corner (rank over suit) so the cards
   take less room; the jokers read 大王 / 小王 there, and the hand is always laid out flat (no 手持) */
html.phone body:not(.test){--cr:.86}
html.phone body:not(.test) .card .pip,html.phone body:not(.test) .card .tag.crown{display:none}
html.phone body:not(.test) .card.joker .idx{display:none}
.card .jw{display:none}
html.phone body:not(.test) .card.joker .jw{display:flex;flex-direction:column;align-items:center;position:absolute;left:calc(var(--cw)*.05);top:calc(var(--cw)*.08);
  width:calc(var(--cw)*.36);font-family:var(--font-display);font-weight:900;font-size:calc(var(--cw)*.3);line-height:1.08}
html.phone #fanBtn{display:none}
/* a phone keeps the table as clear as it can: the shuffle / cut and done-sorting buttons, the sorting sign and the
   clocks at about half size; no card back by the names, no level disc in the middle (the level is in the corner) and
   no line saying who played what; the cards on the table as large as they fit */
html.phone body:not(.test) #deckBtn,html.phone body:not(.test) #readyBtn{--d:46px!important;font-size:13px!important}
html.phone body:not(.test) .stack,html.phone body:not(.test) .flick{width:calc(var(--cw)*.5);height:calc(var(--cw)*.7);margin:calc(var(--cw)*-.35) 0 0 calc(var(--cw)*-.25)}
html.phone body:not(.test) .prepbig #prepL{font-size:clamp(17px,3vh,28px);padding:4px 11px 4px 13px;border-radius:10px}
html.phone body:not(.test) .prepbig .bigclock{font-size:clamp(15px,2.7vh,23px)}
html.phone body:not(.test) .clock{font-size:10px}
html.phone body:not(.test) #myClock{font-size:11px}
html.phone body:not(.test) .who .back{display:none}
html.phone body:not(.test) .fx-act{font-size:13px}
html.phone body:not(.test) .emblem{visibility:hidden}
html.phone body:not(.test) #lastPlay{display:none}
html.phone body:not(.test) #pile{--cw:clamp(54px,min(18vw,15vh),88px)}
/* the score: a red box and a blue box holding each side's level, the side being played filled with its colour */
html.phone body:not(.test) .score .tn{display:none}
html.phone body:not(.test) .score>span{border-color:var(--team);min-width:2.4em}
html.phone body:not(.test) .score>span b,html.phone body:not(.test) .score>span.playing b{margin-left:0}
html.phone body:not(.test) .score{flex-direction:row!important;gap:6px}
/* on its side the tribute line stands to the right of the score, clear of the left-hand player's plate */
html.phone.side body:not(.test) .tribinfo{position:absolute;grid-area:auto;left:120px;top:34px;font-size:13px;white-space:nowrap}
html.phone.side body:not(.test) .tribinfo .ct{font-size:13px}
/* the play buttons at half size; upright they stand in one row over 复原 (the hand keeps its last row clear of
   them), on its side two by two over 两排 / 复原 (placed by placeActionBtns) */
html.phone body:not(.test) #btns{--d:32px!important;gap:6px}
html.phone body:not(.test) #btns .btn{font-size:12px}
html.phone.rows body:not(.test) #btns{position:absolute;right:0;margin:0;z-index:6;flex-direction:column;flex-wrap:nowrap;--d:48px!important}
html.phone.rows body:not(.test) #btns .btn{font-size:15px}
html.phone.side body:not(.test) #btns{display:grid;grid-template-columns:repeat(2,auto)}
html.phone.rows body:not(.test) #hand{--cw:clamp(48px,15vw,64px)}
/* a phone's hand takes as many rows as its cards need, so the rows button has nothing to offer; its groups lie in
   the rows themselves (no frame, no tags), each card of a group with a gold edge along the top, and 成组 stands
   beside 同花顺 */
html.phone body:not(.test) #rowsBtn{display:none}
html.phone body:not(.test) #fixZone,html.phone body:not(.test) #fixTags{display:none!important}
html.phone body:not(.test) #hand .card.grp{border-top:3px solid var(--gold)}
html.phone body:not(.test) #fixBtn{position:static!important}
/* upright: the name row keeps clear of the column of play buttons, which may reach up beside it */
html.phone.rows body:not(.test) .mebar{padding-right:56px}
/* the finishing places at half size; your partner's beside the plate rather than under it, where their cards lie */
html.phone body:not(.test) .place{font-size:14px;padding:3px 7px 3px 9px;border-radius:7px}
html.phone body:not(.test) #seat2 .place{top:50%;left:100%;transform:translateY(-50%);margin:0 0 0 8px}
html.phone body:not(.test) #myPlace{margin-bottom:2px}
.card .idx{position:absolute;left:calc(var(--cw)*.05);top:calc(var(--cw)*.06);width:calc(var(--cw)*.36);display:flex;flex-direction:column;align-items:center;line-height:1;font-size:calc(var(--cw)*.34)}
.card .idx .rk.ten{letter-spacing:-.08em;font-size:.9em}
.card .idx .su{font-size:.82em;margin-top:.08em}
.card .pip{position:absolute;right:10%;bottom:7%;font-size:calc(var(--cw)*.52);line-height:1}
/* jokers carry the usual vertical JOKER index: the big joker in red, the small one in black */
.card.joker .idx{font-family:var(--font-ui);font-weight:800;font-size:calc(var(--cw)*.19);line-height:1.02;gap:0;letter-spacing:0}
.card.joker .pip{font-size:calc(var(--cw)*.46)}
/* wild cards (red hearts of the level rank): a gold face, a heavy gold frame, a crown under the index and a star in the corner */
.card .tag.crown{background:none;padding:0;color:var(--wild-ink);width:1.15em;line-height:0}
.card .tag.crown svg{width:100%;height:auto;fill:currentColor;display:block}
.card .tag{margin-top:.2em;font-size:.95em;line-height:1;background:var(--wild-ink);color:var(--wild-face);border-radius:.18em;padding:.1em .12em;font-family:var(--font-display);font-weight:900}
.card.wild{background:linear-gradient(160deg,var(--wild-face) 0%,var(--wild-face-b) 100%);border:2px solid var(--gold);
  box-shadow:0 0 0 2px var(--wild-ink),0 0 12px 2px var(--gold),0 1px 3px rgba(0,0,0,.35)}
.card.wild::after{content:"★";position:absolute;right:6%;top:4%;font-size:calc(var(--cw)*.24);line-height:1;color:var(--wild-ink)}
/* the other cards of the level being played: a lilac patch behind the rank and suit, a "级" badge in the corner and a
   light that sweeps across now and then, so the level stays in mind */
.card.lvl .idx{background:#e8d9ff;border-radius:calc(var(--cw)*.07);padding:calc(var(--cw)*.03) 0;box-shadow:0 0 0 1px #c9adf2}
.card.lvl::after{content:"级";position:absolute;right:5%;top:4%;font-family:var(--font-ui);font-weight:800;font-size:calc(var(--cw)*.2);
  line-height:1;color:#fff;background:#7d4cc9;border-radius:calc(var(--cw)*.05);padding:.12em .16em}
.card.lvl::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.8) 50%,transparent 65%);animation:lvlShine 3.4s ease-in-out infinite}
@keyframes lvlShine{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}

/* overlay */
.overlay{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:100;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.panel{background:var(--felt-deep);border:1px solid var(--line-strong);border-radius:14px;padding:22px 24px;width:min(440px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font-family:var(--font-display);font-weight:900;font-size:27px;text-wrap:balance}
.panel p,.panel li{font-size:17px;line-height:1.6;color:var(--ink);margin:0}
.panel ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.panel .muted{color:var(--muted)}
.panel .wait{font-size:18px;color:var(--gold);line-height:1.6}
/* bottom-right, clear of the table centre and of your own plate at bottom-left */
/* docked panels sit at the bottom centre, over the (empty) hand, leaving the action spot on the right free */
.overlay.dock{background:transparent;align-items:flex-end;justify-content:center;pointer-events:none}
.overlay.dock .panel{pointer-events:auto;width:min(440px,calc(50vw - 72px));gap:10px;padding:16px 20px;box-shadow:0 -8px 32px rgba(0,0,0,.5)}
.overlay.dock .panel h2{font-size:23px}
.places{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.places span{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 4px;border-radius:8px;background:var(--shade);border:1px solid var(--line);font-size:14px}
.places b{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.1em}
.places small{font-size:11px;color:var(--muted)}
.places .ours{border-color:var(--gold)}
.places .ours small{color:var(--gold)}
.panel .btns{justify-content:flex-end}
/* the lobby: a nickname, then a seat at a square table */
.lobby{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;overflow:auto;
  background:radial-gradient(ellipse at 50% 40%,var(--felt) 0%,var(--felt-deep) 100%);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
/* everything fits on one screen, a laptop or a phone, without scrolling */
.lobby-box{width:min(440px,100%);display:flex;flex-direction:column;align-items:stretch;gap:8px;text-align:center;margin:auto 0}
/* the name in large gold brush strokes, with a small signature under it */
.lobby-title{margin:0;line-height:1;font-family:"Ma Shan Zheng",var(--font-display);font-weight:400;font-size:68px;letter-spacing:.12em;padding-left:.12em;
  color:var(--gold);background:linear-gradient(180deg,#fbe7a6 0%,var(--gold) 55%,#b8862e 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}
.lobby-by{margin:-4px 0 4px;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:14px;letter-spacing:.12em;color:var(--muted)}
.lobby-name{display:flex;align-items:center;gap:10px}
.lobby-name .lobby-nick{flex:1;min-width:0}
.lobby-label{font-size:18px;color:var(--muted);text-align:left;white-space:nowrap}
.lobby-nick{font:inherit;font-size:22px;padding:7px 14px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--felt-deep);color:var(--ink);text-align:center}
.lobby-nick:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(221,176,80,.25)}
.lobby-modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode-btn{font:inherit;font-size:19px;padding:7px 6px;border-radius:12px;cursor:pointer;background:var(--shade);color:var(--ink);border:1.5px solid var(--line-strong)}
.mode-btn.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:700}
.lobby-join{display:flex;gap:8px}
.lobby-join .lobby-nick{flex:1;min-width:0;letter-spacing:.3em}
.lobby-join .btn{font-size:20px;padding:6px 22px}
.lobby-room{display:flex;align-items:baseline;justify-content:center;gap:12px;font-size:18px;color:var(--muted)}
.lobby-room b{font-family:var(--font-display);font-size:34px;line-height:1.1;letter-spacing:.18em;color:var(--gold)}
.lobby-status{min-height:1.3em;font-size:17px;color:var(--muted);line-height:1.3}
.seat-btn.taken{border-style:solid;border-color:var(--team);cursor:default}
.seat-btn.taken span{color:var(--ink)}
.lobby-table{display:grid;grid-template-columns:1fr 1.2fr 1fr;grid-template-rows:auto auto auto;gap:6px;
  grid-template-areas:". n ." "w c e" ". s .";margin:0}
.lobby-felt{border-radius:14px;background:var(--felt);border:2px solid var(--line-strong);box-shadow:inset 0 0 30px rgba(0,0,0,.35)}
/* a seat: the direction and who sits there side by side on one short button */
.seat-btn{font:inherit;display:flex;flex-direction:row;align-items:baseline;justify-content:center;gap:8px;padding:8px 6px;border-radius:12px;cursor:pointer;
  background:var(--shade);color:var(--ink);border:2px dashed var(--line-strong);min-height:48px;align-self:center;white-space:nowrap}
.seat-btn b{font-family:var(--font-display);font-size:22px;color:var(--team)}
.seat-btn span{font-size:17px;color:var(--muted)}
.seat-btn{border-color:color-mix(in srgb,var(--team) 55%,transparent)}
.seat-btn:hover:not(:disabled){border-color:var(--team)}
.seat-btn.mine{border:2px solid var(--team);background:var(--team-fill);box-shadow:0 0 18px var(--team)}
.seat-btn.mine b,.seat-btn.mine span{color:#fff}
.seat-btn.bot{border-style:solid;border-color:var(--line)}
.seat-btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.lobby-ver{font-size:13px;color:var(--muted);opacity:.7}
.lobby-go{font-size:23px;padding:10px 20px;border-radius:14px}
/* the table rules: chosen by whoever plays alone or opens the room, shown greyed to friends who join */
.lobby-rules{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--shade)}
.rule-row{display:grid;grid-template-columns:116px;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;align-items:center}
.rule-k{font-size:18px;color:var(--muted);text-align:left;white-space:nowrap}
.rule-btn{font:inherit;font-size:17px;padding:6px 4px;border-radius:10px;cursor:pointer;background:transparent;color:var(--ink);border:1.5px solid var(--line-strong)}
.rule-btn.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:700}
.rule-btn:disabled{cursor:default}
.rule-btn:disabled:not(.on){opacity:.4}
.rule-note{font-size:15px;color:var(--muted)}
.rule-note:empty{display:none}
/* tries left at A, next to a side's level */
.lvx{font-size:14px;color:var(--warn);margin-left:3px;font-weight:700}
.lvx:empty{display:none}
.lobby-go:disabled{opacity:.35}

@media (max-width:560px){
  .overlay.dock .panel{width:100%}
  #btns{justify-content:center;margin-bottom:6px}
  .table{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,1fr)}
  .emblem{width:84px;height:84px}
  .emblem .r{font-size:50px}
  .lastplay{font-size:14px}
  .lastplay .ct{font-size:13px;padding:0 3px;margin:0 1px}
  .who{font-size:15px;gap:6px}
  .btn{padding:8px 14px}
  .score{gap:8px}
}
/* a narrow screen (a phone held upright): the header sits above the table, so keep its buttons on one line and
   the top player's count badge no taller than their plate, with a little room between them */
@media (max-width:699px){
  .bar .acts{flex-wrap:wrap;justify-content:flex-end;gap:4px}
  .bar .link{font-size:14px;padding:3px 8px}
  .link .long{display:none}
  .table{margin-top:8px}
  .cnt{font-size:20px;padding:2px 6px 1px}
  .cnt small{font-size:12px}
}
/* finishing moments: first place gets a gold badge and confetti, second and third a small badge,
   last place a stamp, a grey-out and a crying face */
.fx{position:fixed;left:0;top:0;z-index:90;pointer-events:none;transform:translate(-50%,-50%);white-space:nowrap}
.fx-tag{font-family:var(--font-display);font-weight:900;border-radius:999px;padding:4px 16px}
.fx-tag.first{font-size:30px;background:var(--gold);color:var(--on-gold);box-shadow:0 0 22px var(--gold);animation:fxPop 2.4s ease-out forwards}
.fx-tag.mid{font-size:22px;background:var(--felt-deep);color:var(--gold);border:1px solid var(--gold);animation:fxPop 1.8s ease-out forwards}
@keyframes fxPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}15%{opacity:1;transform:translate(-50%,-90%) scale(1.15)}25%{transform:translate(-50%,-90%) scale(1)}80%{opacity:1;transform:translate(-50%,-100%) scale(1)}100%{opacity:0;transform:translate(-50%,-125%) scale(.95)}}
.fx-stamp{font-family:var(--font-display);font-weight:900;font-size:30px;letter-spacing:.2em;padding:2px 10px 2px 16px;color:var(--warn);border:3px solid var(--warn);border-radius:8px;
  background:rgba(19,54,41,.85);animation:fxStamp 2.6s ease-out forwards}
@keyframes fxStamp{0%{opacity:0;transform:translate(-50%,-50%) scale(3) rotate(-28deg)}14%{opacity:1;transform:translate(-50%,-50%) scale(.9) rotate(-12deg)}20%{transform:translate(-50%,-50%) scale(1) rotate(-12deg)}85%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-12deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(1) rotate(-12deg)}}
.fx-act{font-family:var(--font-display);font-weight:900;font-size:26px;letter-spacing:.14em;padding:4px 6px 4px 10px;
  color:var(--gold);background:none;border:none;text-shadow:0 0 14px var(--gold),0 2px 6px rgba(0,0,0,.6);animation:fadeIn .3s ease-out}
/* the plate of whoever is shuffling or cutting glows and breathes */
.who.acting,.meinfo.acting{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 20px var(--gold);animation:actGlow 1.1s ease-in-out infinite}
@keyframes actGlow{50%{box-shadow:0 0 0 2px var(--gold),0 0 6px var(--gold)}}
@keyframes fadeIn{from{opacity:0}}
/* the 接风 gust: a gold streak with a bright head, flying head first */
.gust{position:fixed;left:0;top:0;width:120px;height:16px;margin:-8px 0 0 -112px;border-radius:8px;z-index:91;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,226,140,.35) 45%,#fff3c4);box-shadow:0 0 22px rgba(255,214,110,.85);
  transition:transform .85s cubic-bezier(.45,0,.2,1),opacity .3s}
.fx-canvas{position:fixed;inset:0;z-index:89;pointer-events:none}
.fx-stamp.kang{font-size:46px;color:var(--gold);border-color:var(--gold);animation-duration:3.2s}
/* the whole match is won (A passed): twelve seconds of celebration, three times a round's - light rays turning behind
   a large gold banner that glows and pulses, fireworks all over the screen and confetti raining down */
.fx-rays{position:fixed;inset:0;z-index:88;pointer-events:none;overflow:hidden;
  background:radial-gradient(circle at 50% 42%,rgba(255,214,110,.3),rgba(8,22,17,.55) 70%);animation:raysFade 12s ease-in-out forwards}
.fx-rays::before{content:"";position:absolute;left:50%;top:42%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;
  background:repeating-conic-gradient(rgba(255,226,140,.24) 0deg 7deg,transparent 7deg 18deg);animation:raysTurn 30s linear infinite;
  -webkit-mask:radial-gradient(circle,#000 0,transparent 40%);mask:radial-gradient(circle,#000 0,transparent 40%)}
@keyframes raysTurn{to{transform:rotate(360deg)}}
@keyframes raysFade{0%{opacity:0}6%{opacity:1}92%{opacity:1}100%{opacity:0}}
.fx-champ{display:flex;flex-direction:column;align-items:center;gap:12px;animation:champIn 12s cubic-bezier(.2,.9,.3,1.2) forwards}
.fx-champ b{font-family:var(--font-display);font-weight:900;font-size:clamp(34px,8.5vw,104px);letter-spacing:.16em;padding:10px 34px 10px 50px;color:var(--on-gold);
  background:linear-gradient(180deg,#fbe7a6,var(--gold) 60%,#c99a3a);border-radius:18px;
  box-shadow:0 0 0 3px var(--felt-deep),0 0 0 6px var(--gold),0 0 60px var(--gold);animation:champGlow 1.1s ease-in-out infinite}
.fx-champ small{font-family:var(--font-display);font-weight:900;font-size:clamp(20px,2.8vw,32px);letter-spacing:.3em;padding-left:.3em;color:#ffe08a;
  text-shadow:0 0 14px var(--gold),0 2px 6px rgba(0,0,0,.6)}
.fx-champ i{font-style:normal;font-size:14px;letter-spacing:.1em;color:var(--ink);opacity:.7}
@keyframes champIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-10deg)}5%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(3deg)}
  9%{transform:translate(-50%,-50%) scale(1) rotate(0)}94%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.05)}}
/* the whole match is lost: the same twelve seconds, gloomy - the table greys out under a dark sky and falling rain,
   a grey banner drops in and sags, tears run by your and your partner's plates and the sad trombone plays */
.fx-dusk{position:fixed;inset:0;z-index:88;pointer-events:none;background:linear-gradient(180deg,rgba(8,14,22,.8),rgba(18,28,38,.45));animation:raysFade 12s ease-in-out forwards}
.fx-champ.lost{animation:lostIn 12s cubic-bezier(.3,1.3,.5,1) forwards}
.fx-champ.lost b{color:#e8edf2;background:linear-gradient(180deg,#8796a3,#4d5965);box-shadow:0 0 0 3px var(--felt-deep),0 0 0 6px #8b98a5,0 12px 40px rgba(0,0,0,.6);animation:none}
.fx-champ.lost small{color:#b9c6d2;text-shadow:0 2px 6px rgba(0,0,0,.7)}
@keyframes lostIn{0%{opacity:0;transform:translate(-50%,-170%)}7%{opacity:1;transform:translate(-50%,-50%) rotate(0)}12%{transform:translate(-50%,-50%) rotate(0)}
  18%{transform:translate(-50%,-50%) rotate(-4deg)}94%{opacity:1;transform:translate(-50%,-50%) rotate(-4deg)}100%{opacity:0;transform:translate(-50%,-38%) rotate(-6deg)}}
@keyframes champGlow{50%{box-shadow:0 0 0 3px var(--felt-deep),0 0 0 6px #fff3c4,0 0 120px #ffd56e;filter:brightness(1.12)}}
.gloom{filter:grayscale(1) brightness(.7);transition:filter .6s}
/* on a computer the header gives its row back to the table: the name and the two sides' levels sit in the
   top-left corner and the sound / rules / new-game buttons in the top-right, both over the felt */
@media (min-width:700px){
  #app{position:relative}
  .bar{position:absolute;z-index:5;top:8px;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
    align-items:flex-start;pointer-events:none}
  .bar>*{pointer-events:auto}
  .bar{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"brand . acts" "score . ." "trib . .";row-gap:6px}
  .tribinfo{grid-area:trib}
  .brand{grid-area:brand;line-height:1}
  .score{grid-area:score;flex-direction:column;align-items:flex-start;gap:4px}
  /* the options, rules, pause and leave buttons sit together in the top-right corner as a small
     block of two columns, well clear of the player across the table */
  .bar .acts{position:absolute;top:0;right:0;display:grid;grid-template-columns:repeat(2,auto);gap:6px}
  .bar .acts .link{text-align:center}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

  display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.lobby-testbox .lobby-join{width:auto}
.lobby-testbox .lobby-nick{width:150px;flex:none}

/* the card counter: a small table over the table, moved by its title bar */
.tcount{position:fixed;z-index:110;left:16px;top:120px;width:min(620px,calc(100vw - 32px));max-height:76vh;overflow:auto;--mcw:36px;padding:8px 10px;border-radius:10px;background:var(--felt-deep);
  border:1px solid var(--line-strong);box-shadow:0 10px 30px rgba(0,0,0,.5);color:var(--ink);font-size:13px}

.tcount .tcr{display:flex;align-items:flex-start;gap:8px;padding:4px 0;border-top:1px dashed var(--line)}

<!-- PeerJS: browser-to-browser connections for playing with friends (room codes) -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* ---------- cards ---------- */
const SUITS=['S','H','C','D'];
const SUIT_CH={S:'♠',H:'♥',C:'♣',D:'♦'};
const SUIT_ORDER={S:0,H:1,C:2,D:3,J:4};
const RN={11:'J',12:'Q',13:'K',14:'A'};
const rankName=r=>RN[r]||String(r);
// what each seat is called, seen from your chair; online games put your friends' nicknames on their seats
const BASE_NAMES=['你','下家','对家','上家'];
let NAMES=BASE_NAMES.slice();
const PLACE=['头游','二游','三游','末游'];
const TYPE_NAME={single:'单张',pair:'对子',triple:'三张',full:'三带二',straight:'顺子',pairs3:'连对',trip2:'钢板',bomb:'炸弹',sflush:'同花顺',jokers:'天王炸'};
const SEQS=[[5,1],[3,2],[2,3]];
const SEQ_TYPE={'5,1':'straight','3,2':'pairs3','2,3':'trip2'};

const isWild=(c,L)=>c.s==='H'&&c.r===L;
const val=(c,L)=>c.r>=16?c.r:(c.r===L?15:c.r);
const cardText=c=>c.r===16?'小王':c.r===17?'大王':SUIT_CH[c.s]+rankName(c.r);

function makeDeck(){
  const d=[];let id=0;
  for(let k=0;k<2;k++){
    for(const s of SUITS)for(let r=2;r<=14;r++)d.push({id:id++,s,r});
    d.push({id:id++,s:'J',r:16});d.push({id:id++,s:'J',r:17});
  }
  return d;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
const cmpCards=(a,b,L)=>val(b,L)-val(a,L)||(isWild(b,L)-isWild(a,L))||SUIT_ORDER[a.s]-SUIT_ORDER[b.s]||a.id-b.id;
function sortHand(h,L){
  h.sort((a,b)=>cmpCards(a,b,L));
  return h;
}

/* ---------- combination rules ---------- */
// starts s (A may sit at 1 or 14) where nat cards fit len consecutive ranks with `need` each; wilds fill the gaps
function seqStarts(nat,w,len,need){
  const out=[];
  if(nat.length+w!==len*need)return out;
  for(let s=1;s+len-1<=14;s++){
    const cnt={};let ok=true;
    for(const c of nat){
      let p=c.r;if(p===14&&s===1)p=1;
      if(p<s||p>s+len-1){ok=false;break}
      cnt[p]=(cnt[p]||0)+1;
      if(cnt[p]>need){ok=false;break}
    }
    if(ok)out.push(s);
  }
  return out;
}

// every legal reading of a set of cards
function analyze(cards,L){
  const n=cards.length,res=[];
  if(!n)return res;
  const wild=cards.filter(c=>isWild(c,L)),rest=cards.filter(c=>!isWild(c,L));
  const w=wild.length;
  const jok=rest.filter(c=>c.r>=16),nat=rest.filter(c=>c.r<16);
  const cnt={};for(const c of nat)cnt[c.r]=(cnt[c.r]||0)+1;
  const ranks=Object.keys(cnt).map(Number);
  const v=r=>r>=16?r:(r===L?15:r);
  const add=(type,value)=>res.push({type,value,n});

  if(jok.length){
    if(n===1)add('single',jok[0].r);
    else if(n===2&&jok.length===2&&jok[0].r===jok[1].r)add('pair',jok[0].r);
    else if(n===4&&jok.length===4)add('jokers',99);
    else if(n===5&&jok.length===2&&jok[0].r===jok[1].r&&ranks.length===1&&nat.length+w===3)add('full',v(ranks[0]));
    return res;
  }
  if(ranks.length<=1){
    const sv=ranks.length?v(ranks[0]):15;
    if(n===1)add('single',sv);
    else if(n===2)add('pair',sv);
    else if(n===3)add('triple',sv);
    else add('bomb',sv);
  }
  if(n===5){
    if(ranks.length===2){
      for(const [t,p] of [[ranks[0],ranks[1]],[ranks[1],ranks[0]]]){
        if(cnt[t]<=3&&cnt[p]<=2)add('full',v(t));
      }
    }
    if(ranks.length===1&&nat.length===3&&w===2&&ranks[0]!==L)add('full',v(ranks[0]));
    const ss=seqStarts(nat,w,5,1);
    if(ss.length){
      const top=Math.max(...ss);
      // a run all in one suit (a wild card filling any gap) is a straight flush, a bomb; it cannot be played as a plain straight
      if(new Set(nat.map(c=>c.s)).size<=1)add('sflush',top);else add('straight',top);
    }
  }
  if(n===6){
    const a=seqStarts(nat,w,3,2);if(a.length)add('pairs3',Math.max(...a));
    const b=seqStarts(nat,w,2,3);if(b.length)add('trip2',Math.max(...b));
  }
  return res;
}
const isBomb=p=>p.type==='bomb'||p.type==='sflush'||p.type==='jokers';
const power=p=>p.type==='jokers'?10000:p.type==='sflush'?550+p.value:p.n*100+p.value;
function beats(p,cur){
  if(!cur)return true;
  const pb=isBomb(p),cb=isBomb(cur);
  if(pb&&!cb)return true;
  if(!pb&&cb)return false;
  if(pb)return power(p)>power(cur);
  return p.type===cur.type&&p.n===cur.n&&p.value>cur.value;
}
const strength=p=>isBomb(p)?100000+power(p):p.value;

/* ---------- move generation ---------- */
function genPlays(hand,L){
  const wild=[],jk={16:[],17:[]},by={};
  for(const c of hand){
    if(isWild(c,L))wild.push(c);
    else if(c.r>=16)jk[c.r].push(c);
    else(by[c.r]||(by[c.r]=[])).push(c);
  }
  const w=wild.length,sets=[],W=k=>wild.slice(0,k);
  for(const r in by){
    const g=by[r];
    for(let k=1;k<=g.length+w;k++){const nat=Math.min(g.length,k);sets.push(g.slice(0,nat).concat(W(k-nat)))}
  }
  if(w){sets.push(W(1));if(w===2)sets.push(W(2))}
  for(const r of [16,17]){const g=jk[r];if(g.length)sets.push([g[0]]);if(g.length===2)sets.push(g.slice())}
  if(jk[16].length===2&&jk[17].length===2)sets.push(jk[16].concat(jk[17]));
  // three with a pair
  const T=[],P=[];
  for(const r in by){
    const g=by[r],R=+r;
    if(g.length>=3)T.push({r:R,nat:g.slice(0,3),wu:0});else if(g.length+w>=3)T.push({r:R,nat:g.slice(),wu:3-g.length});
    if(g.length>=2)P.push({r:R,nat:g.slice(0,2),wu:0});else if(w)P.push({r:R,nat:g.slice(),wu:1});
  }
  if(w===2&&!by[L])P.push({r:L,nat:[],wu:2});
  for(const r of [16,17])if(jk[r].length===2)P.push({r,nat:jk[r].slice(),wu:0});
  for(const t of T)for(const p of P){
    if(t.r===p.r||t.wu+p.wu>w)continue;
    sets.push(t.nat.concat(p.nat,W(t.wu+p.wu)));
  }
  // straights, pairs in a row, triples in a row
  for(const [len,need] of SEQS){
    for(let s=1;s+len-1<=14;s++){
      let nat=[],wu=0;
      for(let p=s;p<s+len;p++){const g=by[p===1?14:p]||[];const k=Math.min(g.length,need);nat=nat.concat(g.slice(0,k));wu+=need-k}
      if(wu<=w)sets.push(nat.concat(W(wu)));
    }
  }
  // straight flushes
  for(const su of SUITS)for(let s=1;s<=10;s++){
    const nat=[];let wu=0;
    for(let p=s;p<s+5;p++){const c=(by[p===1?14:p]||[]).find(x=>x.s===su);if(c)nat.push(c);else wu++}
    if(wu<=w)sets.push(nat.concat(W(wu)));
  }
  const out=[],seen=new Set();
  for(const cs of sets){
    const wu=cs.filter(c=>isWild(c,L)).length;
    for(const a of analyze(cs,L)){
      const key=a.type+'|'+a.value+'|'+a.n+'|'+wu;
      if(seen.has(key))continue;
      seen.add(key);
      out.push({...a,cards:cs,wu});
    }
  }
  return out;
}

/* ---------- hand evaluation: roughly how many turns of control the hand still needs ---------- */
// every number the computer players weigh; tuned by self-play in the 07-guandan-ai training folder
const AIP={
  // hand evaluation: a single, pair or three counts 1 turn, less for big cards; runs, bombs and wild cards
  ucTop:.25,ucA:.5,ucQK:.75,tripPairMax:14,seqUnit:.9,fourJokers:1.5,smallJoker:.3,bigJoker:.2,bombBase:.4,bombExtra:.1,wild:.9,
  // following: when to beat an opponent's cards
  urgentWin:7,urgentOpp:5,followFree:.35,followMaybe:1.2,followMaybeProb:.3,saveJokerCurBelow:13,saveJokerHand:8,saveJokerProb:.6,topFree:1,
  // when to bomb
  bombWinLeft:7,bombRest:2,bombOverBomb:12,bombBigVal:14,bombBigProb:.25,safeBombRest:3,
  // what counts as a play that wins the lead back; arranging the hand: what each play (not bombs) costs on top of its score
  ctrlSingle:14,ctrlPair:13,ctrlTrip:12,ctrlSeq:9,armHand:.3,armNodes:400,
  // early and middle game: how often a play that would win the lead back is kept, or a fit left to your partner
  saveCtrlProb:0,midLeaveProb:.2,
  // 牌力 tiers (0-100, the hand as dealt): 1 aims to put both opponents last, 2 to go out first, 3 for second or third,
  // 4 not to end up both last; the weaker tiers leave more to the partner
  tier1:85,tier2:55,tier3:20,leaveWeak:.5,
  // no bomb when the partner, still to play, can most likely beat it (the unseen cards dealt at random this many times)
  mateBeatProb:.8,mateSamples:40,
  // from the player's comments on the test version (07-guandan-ai/第1局评语分析.txt):
  // a small card is 10 or below
  smallMax:10,
  // an opponent's bomb, bombed back or not by how many bombs you hold (straight flushes and the four jokers count), how
  // many levels your smallest one that beats it is above theirs (one level: the smallest bomb there is that beats it),
  // and how many cards they have left. One bomb: bomb when they hold this many or fewer; not when your partner is yet to
  // play and yours is this many levels above or more. Two bombs: bomb when yours is within this many levels; not when it
  // is further above and they hold this many or more. Three or more: always, with the smallest that beats it
  bbOneLeft:7,bbOneFar:10,bbTwoNear:6,bbTwoFarMin:18,
  // late game, no bomb that leaves a small single to get rid of while an opponent still holds more than this many cards
  lateBombOppMax:10,
  // top your partner's small single or pair with an ace or the level card when the next opponent holds this many or fewer
  topMateNextMax:7,
  // each of those rules on (1) or off (0), to test them one at a time: keep big singles early, the smallest pair with a three,
  // bomb back, no hurry to bomb late, leave the joker to the partner, top the partner's small card, hand the partner a play
  // they may go out on, no three-with-a-pair or straight led to an opponent with five cards
  rKeepBig:1,rSmallPair:1,rBombBack:1,rLateBomb:1,rMateJoker:1,rTopMate:1,rFeed:1,rNoFive:1,
};
// how good each kind of play is to hold, by its value (runs: their lowest card, 1 = A played low), from self-play in
// 07-guandan-ai (stats.js): how often it wins the lead back, and how often an opponent's smaller one of its kind comes
// along so it can follow; between -1 (a small single: hardly ever wins, rarely gets a chance to follow) and +1, bombs 1-2
const UNIT_SCORE={
  single1:{2:-.94,3:-.8,4:-.66,5:-.55,6:-.44,7:-.36,8:-.28,9:-.18,10:-.11,11:-.03,12:.08,13:.18,14:.25,15:.39,16:.55,17:.77},
  pair2:{2:-.66,3:-.61,4:-.52,5:-.46,6:-.41,7:-.34,8:-.26,9:-.2,10:-.12,11:-.01,12:.08,13:.2,14:.32,15:.48,16:.61,17:.69},
  triple3:{2:0,3:-.05,4:.1,5:.1,6:.08,7:.13,8:.18,9:.2,10:.29,11:.32,12:.27,13:.37,14:.32,15:.18},
  full5:{2:-.65,3:-.48,4:-.36,5:-.24,6:-.16,7:-.09,8:-.01,9:.07,10:.14,11:.2,12:.25,13:.39,14:.45,15:.52},
  straight5:{1:-.46,2:-.3,3:-.18,4:-.08,5:.03,6:.12,7:.2,8:.26,9:.38,10:.59},
  pairs36:{1:-.16,2:-.07,3:-.05,4:.01,5:-.01,6:.05,7:.08,8:.08,9:.15,10:.18,11:.25,12:.28},

  if(!over.length)return null;

  if(x.to===0){G.fresh.push(card.id);arrivals.set(card.id,performance.now())}
  if(x.label==='进贡')G.trib.push({g:x.from,r:x.to,tc:card});
  else{const t=G.trib.find(t=>t.r===x.from&&t.g===x.to);if(t)t.rc=card}
  return true;
}
// hand over queued cards one at a time, face up across the table, then carry on with the returns
async function runGives(){
  G.phase='tribute';
  render();
  const tok=G.tok;
  while(G.gives.length){
    if(!await handOver(G.gives[0],tok))return;
    G.gives.shift();
    render();
  }
  // the tribute is in: sort your cards first (whoever leads is known now), the returns follow
  if(G.afterTrib){G.afterTrib=false;startPrep(G.leader);return}
  processReturns();
}
function processReturns(){
  if(!G.returns.length){startPlay(G.leader);return}
  G.retPick=G.retPick||{};
  if(G.returns.some(x=>x.from===0))sel=new Set();
  retWait();
}
// everyone who owes a return chooses at the same time (the computer at once, a player within 20 seconds);
// once all have chosen, the cards go back together
function retWait(){
  for(const x of G.returns)if(G.retPick[x.from]==null&&!isHumanSeat(x.from))G.retPick[x.from]=aiReturnCard(G.hands[x.from],G.L).id;
  const left=G.returns.filter(x=>G.retPick[x.from]==null).map(x=>x.from);
  if(!left.length){
    G.clock=null;
    G.gives=G.returns.map(x=>({from:x.from,to:x.to,id:G.retPick[x.from],label:'还贡'}));
    G.returns=[];
    later(runGives,150);
    return;
  }
  G.phase='return';
  if(G.clock&&G.clock.who==='return')G.clock.seats=left;
  else{G.clock={who:'return',seats:left,left:RET_MS,total:RET_MS};if(left.includes(0))Sound.play('turn')}
  render();
}
// owes a return now: in the return phase, or during the sorting minute once they have said they are done sorting
const owesReturn=p=>(G.phase==='return'||(G.phase==='prep'&&(G.ready||[]).includes(p)))&&(G.returns||[]).some(x=>x.from===p)&&(G.retPick||{})[p]==null;
// a return made during the sorting minute goes across at once, while the others are still sorting
function returnNow(p,id){
  const x=G.returns.find(r=>r.from===p);if(!x)return;
  G.returns=G.returns.filter(r=>r!==x);
  handOver({from:p,to:x.to,id,label:'还贡'},G.tok).then(ok=>{if(ok)render()});
  render();
}
function startPrep(leader){
  G.phase='prep';G.turn=leader;G.ready=[];G.retPick={};
  // the test version gives ten minutes, to sort the computer's hands too
  G.clock={who:'prep',left:TEST?600000:PREP_MS,total:TEST?600000:PREP_MS};
  render();
  // the computer players return their card early in the sorting minute, one after the other
  (G.returns||[]).filter(x=>!isHumanSeat(x.from)).forEach((x,i)=>later(()=>{
    if(G.phase==='prep'&&G.returns.includes(x))returnNow(x.from,aiReturnCard(G.hands[x.from],G.L).id);
  },1500+i*1200));
}
function beginPlay(){
  if(G.phase!=='prep')return;
  G.clock=null;
  if(G.returns&&G.returns.length){processReturns();return}
  startPlay(G.turn);
}
function startPlay(leader){
  G.phase='play';G.turn=leader;G.clock=null;
  if(TEST)testRoundStart();
  startTurn();
}

const active=i=>G.hands[i].length>0;
function nextActive(i){for(let k=1;k<=4;k++){const j=(i+k)%4;if(active(j))return j}return i}

function later(fn,ms){const t=G.tok;setTimeout(()=>{if(G.tok===t)fn()},ms)}

function startTurn(){
  hints=[];hintIdx=0;
  render();
  if(G.phase!=='play')return;
  const p=G.turn;
  NET.pending=false;
  if(p===0&&isHumanSeat(0)){
    const cur=G.trick?G.trick.play:null;
    hints=sortHints(genPlays(G.hands[0],G.L).filter(pl=>beats(pl,cur)));
    Sound.play('turn');
    G.clock={who:0,left:PLAY_MS,total:PLAY_MS};
    render();
    // 出牌 was pressed while the last trick was still on show
    if(G.queuedPlay){G.queuedPlay=false;if(sel.size)onPlay()}
    return;
  }
  // a friend's turn: their clock runs here too, and their move arrives as an event
  if(isHumanSeat(p)){G.clock={who:p,left:PLAY_MS,total:PLAY_MS};renderClocks();return}
  // once you are out the computers stop pretending to think so long; only the host's computers actually move
  // the test version gives the computer more time, so each play can be followed
  const think=TEST?(active(0)?1800+Math.random()*700:900+Math.random()*400):active(0)?AI_THINK_MIN+Math.random()*(AI_THINK_MAX-AI_THINK_MIN):400+Math.random()*300;
  G.clock={who:p,left:PLAY_MS,total:PLAY_MS,think:isHost()?think:undefined};
  renderClocks();

/* ---------- clocks: one ticker drives turn limits, computer thinking and the pre-play countdown ---------- */
const PLAY_MS=60000,TRIB_MS=30000,RET_MS=20000,PREP_MS=90000,HURRY_MS=5000;
// computer "thinking" time per move; shortened for testing (the full-feel setting was 2000-5000)
const AI_THINK_MIN=500,AI_THINK_MAX=1000;
let lastTick=performance.now();
setInterval(()=>{
  const now=performance.now(),dt=Math.min(now-lastTick,1000);
  lastTick=now;
  const c=G&&G.clock;
  if(!c||G.paused||(NET.mode==='solo'&&!$('#overlay').hidden)||TV.open||TV.edit)return; // paused, a solo game with a panel open, or looking back or writing a comment in the test version
  const before=c.left;
  c.left-=dt;
  if(c.think==null&&c.left>0&&c.left<=HURRY_MS&&Math.ceil(before/1000)!==Math.ceil(c.left/1000))Sound.play('tick');
  if(c.think!=null&&c.total-c.left>=c.think){G.clock=null;act(playEvt(c.who,aiDecide(c.who)));return}
  if(c.left<=0){if(isHost()){G.clock=null;timeUp(c)}else c.left=0;return}
  renderClocks();
},100);
// a clock ran out (host only): the computer makes the move for whoever's turn it was
function timeUp(c){
  const who=c.who;
  if(who==='prep'){act({k:'begin'});return}
  if(who==='deck'){act({k:G.phase==='shuffle'?'shuffle':'cut'});return}
  if(who==='tribute'){
    for(const s of c.seats)if(G.phase==='tribPick'&&G.tribPick[s]==null){
      const card=tributeCard(G.hands[s],G.L);
      if(s===0){sel=new Set();setMsg(`时间到，已自动进贡 ${cardText(card)}`)}
      act({k:'tribute',p:toAbs(s),id:card.id});
    }
    return;
  }
  if(who==='return'){
    for(const s of c.seats)if(owesReturn(s)){
      const card=aiReturnCard(G.hands[s],G.L);
      if(s===0){sel=new Set();setMsg(`时间到，已自动还贡 ${cardText(card)}`)}
      act({k:'return',p:toAbs(s),id:card.id});
    }
    return;
  }
  if(typeof who==='number'&&G.phase==='play'&&G.turn===who){
    const pl=aiDecide(who)||(G.trick||who!==0?null:hints[0]);
    if(who===0){sel=new Set();setMsg(pl?'时间到，已自动出牌':'时间到，自动过')}
    act(playEvt(who,pl));
  }
}
// the sorting countdown flanks the level disc: 理牌 on its left, the seconds on its right, both clear of the
// side players' plates; where the sides are too narrow (a phone) the two sit together above the disc
function placePrepBig(){

function renderClocks(){

    const on=!!c&&(c.who===p||(c.who==='deck'&&c.seat===p)||((c.who==='tribute'||c.who==='return')&&c.seats.includes(p)));
    const n=on?String(Math.max(0,Math.ceil(c.left/1000))):'';

// hints go by the shape of your hand (see hintOrder): a pair of 5s before breaking up three 4s
// and zone by zone: first plays from the active cards alone; then plays from the fixed cards alone (a whole group that
// beats the table first, exactly as the player set it aside, then whole groups together, then plays that break a group
// up, bombs last); then plays that take cards from both zones. A play that empties the hand still comes first of all.
// Each zone's plays are found among its own cards and ordered by its own cards: a 9 in the active zone is a lone
// single there even if a fixed straight holds another 9, so it is offered as such and not held back as half a pair.
function sortHints(plays){
  const hand=G.hands[0],L=G.L,cur=G.trick?G.trick.play:null,full=hintOrder(hand,L,cur,plays);
  const have=new Set(hand.map(c=>c.id));
  G.fixed=(G.fixed||[]).map(gr=>gr.filter(id=>have.has(id))).filter(gr=>gr.length);
  if(!G.fixed.length)return full;
  const key=pl=>pl.cards.map(c=>c.id).sort((a,b)=>a-b).join(),fixed=new Set(G.fixed.flat());
  const nf=pl=>pl.cards.filter(c=>fixed.has(c.id)).length;
  const whole=pl=>G.fixed.every(gr=>{const n=pl.cards.filter(c=>gr.includes(c.id)).length;return!n||n===gr.length});
  // a fixed bomb (or straight flush, or the four jokers) is never split up, alone or with active cards: it is
  // offered whole, among the fixed plays
  const solid=G.fixed.filter(gr=>analyze(gr.map(id=>hand.find(c=>c.id===id)),L).some(isBomb));
  const splits=pl=>solid.some(gr=>{const n=pl.cards.filter(c=>gr.includes(c.id)).length;return n>0&&n<gr.length});
  const zone=cards=>cards.length?hintOrder(cards,L,cur,genPlays(cards,L).filter(pl=>beats(pl,cur))):[];
  const own=[];
  for(const gr of G.fixed){
    const cards=gr.map(id=>hand.find(c=>c.id===id));
    const r=analyze(cards,L).filter(a=>beats(a,cur)&&(!isBomb(a)||cur&&isBomb(cur))).sort((a,b)=>strength(a)-strength(b))[0];
    if(r)own.push({...r,cards,wu:cards.filter(c=>isWild(c,L)).length});
  }
  const fx=zone(hand.filter(c=>fixed.has(c.id))).filter(pl=>!splits(pl));
  const seen=new Set();
  return full.filter(pl=>pl.cards.length===hand.length).concat(
    zone(hand.filter(c=>!fixed.has(c.id))),
    own.sort((a,b)=>isBomb(a)-isBomb(b)||(isBomb(a)?power(a)-power(b):TEST?a.value-b.value:0)),
    fx.filter(pl=>whole(pl)&&!isBomb(pl)),fx.filter(pl=>!whole(pl)&&!isBomb(pl)),fx.filter(isBomb).sort((a,b)=>power(a)-power(b)),
    full.filter(pl=>nf(pl)>0&&nf(pl)<pl.cards.length&&!splits(pl))
  ).filter(pl=>{const k=key(pl);return!seen.has(k)&&seen.add(k)});
}

function doPlay(p,play){
  if(G.phase!=='play'||G.turn!==p)return;
  G.clock=null;
  if(G.notice&&(play||G.trick))G.notice='';
  if(play)Sound.play(isBomb(play)?'bomb':'play',play.type==='jokers'||play.n>=6);
  else Sound.play('pass');
  if(play){
    let origins=null;
    if(p===0){
      origins={};
      for(const c of play.cards){
        const el=handEl.querySelector(`.card[data-id="${c.id}"]`);
        if(el){const r=el.getBoundingClientRect();origins[c.id]={x:r.left+r.width/2,y:r.top+r.height/2}}
      }
    }
    const goesOut=G.hands[p].every(c=>play.cards.includes(c));
    if(goesOut){G.out.push(p);G.reveal=G.out.length;showPlace(p===0?$('#myPlace'):$('#seat'+p+' .place'),G.out.length-1)}
    pileThrow(p,play,origins,true);
    G.trickPlays.push({p,play:{type:play.type,value:play.value,n:play.n,cards:play.cards}});
    G.seen.push(...play.cards); // every card played this round, for the computer's card memory
    G.log.push({p,cards:play.cards,lead:!G.trick,type:play.type,value:play.value,n:play.n}); // and who played what, in order, leading or following
    const ids=new Set(play.cards.map(c=>c.id));
    G.hands[p]=G.hands[p].filter(c=>!ids.has(c.id));
    G.trick={player:p,play};
    G.passes=0;
    G.last[p]={play};
    if(p===0){sel=new Set();G.fresh=[]}
    if(goesOut){
      celebrate(p,G.out.length-1);
      if(roundOver()){finishRound();return}
    }
  }else{
    G.passes++;
    G.last[p]='pass';
    G.log.push({p,cards:null});
  }
  advance();
}
function roundOver(){return(!active(0)&&!active(2))||(!active(1)&&!active(3))}
function advance(){
  const winner=G.trick.player;
  const others=[0,1,2,3].filter(i=>i!==winner&&active(i)).length;
  if(G.passes>=others){
    let leader=winner,jf=null;
    if(!active(winner)){
      const mate=(winner+2)%4;
      leader=active(mate)?mate:nextActive(winner);
      G.notice=`${NAMES[leader]}接风，获得出牌权。`;
      jf={from:winner,to:leader};
    }
    G.turn=-1;G.nextLeader=leader;
    render();
    later(()=>{
      pileSweep();
      G.heapN+=G.trickPlays.reduce((s,t)=>s+t.play.cards.length,0);G.trickPlays=[];
      G.trick=null;G.passes=0;G.last=[null,null,null,null];G.turn=leader;startTurn();
      if(jf)jieFeng(jf.from,jf.to);
    },trickHold());
    return;
  }
  G.turn=nextActive(G.turn);
  startTurn();
}
function finishRound(){
  // the losing side's remaining players fill in the last places, in turn order
  let i=G.out[G.out.length-1];
  const k0=G.out.length;
  for(let k=1;k<=4;k++){const j=(i+k)%4;if(!G.out.includes(j))G.out.push(j)}
  const first=G.out[0],team=first%2,mate=(first+2)%4;
  const pos=G.out.indexOf(mate);
  const up=pos===1?3:pos===2?2:1;
  const before=G.levels[team];
  let win=false;
  const aTeam=G.lvlTeam,atA=G.L===14;
  if(G.lvlTeam===team&&before===14&&pos<=2)win=true;
  else G.levels[team]=Math.min(14,before+up);
  const after=G.levels[team];
  // each side gets three tries at A: after the third miss the match is drawn, or that side starts again from 2
  let aTry=0,draw=false,reset=false;
  if(atA&&!win&&RULES.aFail!=='keep'){
    const f=G.aFails||(G.aFails=[0,0]);
    aTry=++f[aTeam];
    if(aTry>=3){if(RULES.aFail==='draw')draw=true;else{G.levels[aTeam]=2;f[aTeam]=0;reset=true}}
  }
  G.result={order:G.out.slice(),team,up,before,after,win,draw,reset,aTry,aTeam,playedLevel:G.L};
  if(TEST)testRoundEnd();
  G.prevOut=G.out.slice();
  G.lvlTeam=team;
  G.phase=win||draw?'over':'roundEnd';
  G.turn=-1;G.reveal=k0;
  render();
  // the end of a round plays out like a real table: the last trick stays face up for a moment,
  // then gets turned over onto the pile, then the places are called out one by one, then the result
  later(()=>{
    pileSweep();Sound.play('shuffle');
    G.heapN+=G.trickPlays.reduce((s,t)=>s+t.play.cards.length,0);G.trickPlays=[];G.last=[null,null,null,null];
  },END_SHOW_MS);
  // places already earned during play are on the plates; the rest (always including last place) are called out now
  const dbl=G.out[0]%2===G.out[1]%2;
  // and whoever is caught with cards left lays them face up on the table for everyone to see
  for(let k=k0;k<4;k++)later(()=>{G.reveal=k+1;render();celebrate(G.out[k],k,dbl);showRest(G.out[k])},END_SHOW_MS+700+(k-k0)*500);
  later(()=>{
    if(win)victory(team,showResult);
    else if(draw){Sound.play('ding');showResult()}
    else{Sound.play(team===0?'win':'lose');showResult()}
  },END_SHOW_MS+700+(4-k0)*500+1400);
}
const END_SHOW_MS=2600; // how long the final trick stays face up

/* ---------- human actions ---------- */
function selectedCards(){return G.hands[0].filter(c=>sel.has(c.id))}
// waiting for the host to confirm your last move; never for more than four seconds
const waitingHost=()=>NET.pending&&Date.now()-(NET.pendingAt||0)<4000;
function onPlay(){
  // you lead next but the finished trick is still on show: the play goes out the moment your turn starts
  if(G.phase==='play'&&G.turn===-1&&G.nextLeader===0){
    if(!selectedCards().length){setMsg('先选几张牌',true);return}
    if(askConfirm())return;
    G.queuedPlay=true;setMsg('这一轮的牌收起后马上出');return;
  }
  if(G.phase!=='play')return;
  if(G.turn!==0){setMsg('还没轮到你出牌',true);return}
  const cards=selectedCards();
  if(!cards.length){setMsg('先选几张牌',true);return}
  const cur=G.trick?G.trick.play:null;
  const reads=analyze(cards,G.L);
  if(!reads.length){setMsg('这几张牌不成牌型',true);return}
  const ok=reads.filter(r=>beats(r,cur)).sort((a,b)=>strength(b)-strength(a));
  if(!ok.length){setMsg(`管不上${cur?TYPE_NAME[cur.type]:''}`,true);return}
  if(waitingHost())return;
  if(askConfirm())return;
  act(playEvt(0,{...ok[0],cards}));

// 出牌需确认 (an option): the first press only shows the picked cards large and turns 出牌 into 确认; pressing it again
// with the same cards still picked plays them, and any change to the picked cards or the turn calls it off
let confirmPlay=false,cfm=null;
try{confirmPlay=localStorage.getItem('guandan-confirm')==='1'}catch(_){}

}
// the cards waiting for 确认, in the order the play reads, 1.8 times the size of the hand's cards and side by side in the
// middle of the table; a long play keeps every card's corner in view by overlapping, and shrinks only if it must
function syncCfmShow(){

  if(!box){box=document.createElement('div');box.id='cfmShow';document.body.appendChild(box)}
  const cards=selectedCards(),r=analyze(cards,G.L)[0],shown=r?displayOrder({...r,cards},G.L):cards,n=shown.length;
  const t=$('#table').getBoundingClientRect(),hc=$('#hand .card'),maxW=t.width*.9;
  const cw=Math.min((hc?hc.offsetWidth:60)*1.8,t.height*.5/1.4,maxW/(1+.45*(n-1)));
  const step=n>1?Math.min(cw*1.08,(maxW-cw)/(n-1)):cw;

addEventListener('resize',()=>{if(cfm)syncCfmShow()});
function onPass(){
  if(G.phase!=='play'||G.turn!==0||!G.trick||waitingHost())return;
  sel=new Set();
  act(playEvt(0,null));
}
function onHint(){
  if(G.phase!=='play'||G.turn!==0)return;
  if(!hints.length){setMsg('没有能管上的牌，可以点“过”');return}
  const h=hints[hintIdx%hints.length];hintIdx++;
  sel=new Set(h.cards.map(c=>c.id));
