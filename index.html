}
function onReturn(){
  if(waitingHost())return;
  if(G.phase==='tribPick'){
    if(!G.tribGivers.includes(0)||G.tribPick[0]!=null)return;
    const cards=selectedCards(),ok=tribOptions(0);
    if(cards.length!==1||!ok.includes(cards[0])){setMsg('要进贡手里最大的一张牌（百搭除外）',true);return}
    act({k:'tribute',p:toAbs(0),id:cards[0].id});
    return;
  }
  if(!owesReturn(0))return;
  const cards=selectedCards();
  if(cards.length!==1){setMsg('选一张 10 或以下的牌还贡',true);return}
  const c=cards[0];
  if(c.r>10||isWild(c,G.L)){setMsg('还贡的牌要在 10 或以下，且不能是百搭',true);return}
  act({k:'return',p:toAbs(0),id:c.id});
}

/* ---------- events: every move goes through the host, which applies it and passes it on ---------- */
function playEvt(p,pl){
  return pl?{k:'play',p:toAbs(p),ids:pl.cards.map(c=>c.id),type:pl.type,value:pl.value,n:pl.n}:{k:'pass',p:toAbs(p)};
}
// solo and host: apply now (and, as host, send it on); a friend's page sends its move to the host and
// waits for it to come back, so every table applies the same moves in the same order
function act(e){
  if(NET.mode==='guest'){
    if(NET.hostConn&&NET.hostConn.open){NET.pending=['play','pass','return','tribute'].includes(e.k);NET.pendingAt=Date.now();NET.hostConn.send({t:'act',e})}
    return;
  }
  if(applyEvt(e)&&NET.mode==='host')broadcast({t:'evt',e});
}
// apply one event if this table has reached the point where it fits; false means "not yet", so a friend's page
// keeps it queued until its own animations and pauses catch up with the host's
function applyEvt(e){
  const p=e.p!=null?toLocal(e.p):null;
  switch(e.k){
    case'round':
      if(!e.reset&&!['roundEnd','start'].includes(G.phase))return false;
      startRound(e);return true;
    case'shuffle':
      if(G.phase!=='shuffle'||G.busy)return false;
      doShuffle();return true;
    case'cut':
      if(G.phase!=='cut'||G.busy)return false;
      doCut();return true;
    case'return':{
      if(G.phase!=='return'&&G.phase!=='prep')return false;
      if(!owesReturn(p)||!G.hands[p].some(c=>c.id===e.id))return true;
      G.fresh=G.fresh.filter(id=>id!==e.id);
      if(p===0){sel=new Set();NET.pending=false}
      if(G.phase==='prep'){returnNow(p,e.id);return true}
      G.retPick[p]=e.id;
      retWait();
      return true;
    }
    case'tribute':{
      if(G.phase!=='tribPick')return false;
      if(!G.tribGivers.includes(p)||G.tribPick[p]!=null||!G.hands[p].some(c=>c.id===e.id))return true;
      G.tribPick[p]=e.id;
      if(p===0){sel=new Set();NET.pending=false}
      tribWait();
      return true;
    }
    case'ready':
      if(G.phase!=='prep')return false;
      if(!G.ready.includes(p))G.ready.push(p);
      if([...NET.humans].every(h=>G.ready.includes(h)))beginPlay();else render();
      return true;
    case'begin':
      if(G.phase!=='prep')return false;
      beginPlay();return true;
    case'next':{
      if(G.phase!=='roundEnd'&&G.phase!=='over')return false;
      const nr=G.nextReady||(G.nextReady=[]);
      if(!nr.includes(p))nr.push(p);
      if(!$('#overlay').hidden&&$('#panel').dataset.kind==='result')showResult();
      // after this event has gone out to everyone, so the new round follows it
      setTimeout(startNextIfReady,0);
      return true;
    }
    case'pause':
      // only the player who paused can resume, and a game already paused is not paused again by someone else
      if(G.paused&&G.pausedBy!==p)return true;
      setPaused(!!e.on,p);return true;
    case'humans':
      setHumans(e.list.map(toLocal),e.names);
      if(e.left)playerLeft(e.left,e.how);
      setTimeout(startNextIfReady,0);
      return true;
    case'play':case'pass':{
      if(G.phase!=='play'||G.turn!==p)return false;
      // your own move came back: you are no longer waiting on it (it may have ended the round, with no next turn to clear this)
      if(p===0)NET.pending=false;
      if(e.k==='pass'){doPlay(p,null);return true}
      const cards=e.ids.map(id=>G.hands[p].find(c=>c.id===id));
      if(cards.some(c=>!c))return true;
      doPlay(p,{type:e.type,value:e.value,n:e.n,cards,wu:cards.filter(c=>isWild(c,G.L)).length});
      return true;
    }
  }
  return true;
}
// a friend's page applies the host's events in order, each as soon as it fits
setInterval(()=>{
  if(NET.mode!=='guest')return;
  for(let i=0;i<20&&NET.inbox.length;i++){
    if(!applyEvt(NET.inbox[0]))break;
    NET.inbox.shift();
  }
},60);
// who is a person (local seats) and what their seats are called
function setHumans(list,names){
  NET.humans=new Set(list);
  NAMES=BASE_NAMES.slice();
  if(names)for(const a in names){const l=toLocal(+a);if(l!==0&&NET.humans.has(l))NAMES[l]=names[a]}
  for(let q=1;q<4;q++)$('#seat'+q+' .name').textContent=NAMES[q];
  VC.prune();
  if(G&&G.paused&&!NET.humans.has(G.pausedBy))setPaused(false);
  if(G)render();
}

/* ---------- rendering ---------- */
const $=s=>document.querySelector(s);
// the wild-card mark: a small crown
const CROWN='<svg viewBox="0 0 24 20" aria-hidden="true"><path d="M2 17h20v2.4H2zM1.4 15 .8 4.6l6.3 4.7L12 1l4.9 8.3 6.3-4.7-.6 10.4z"/><circle cx="12" cy="1.6" r="1.6"/><circle cx="1" cy="4.2" r="1.3"/><circle cx="23" cy="4.2" r="1.3"/></svg>';
function cardHTML(c,L,extra=''){
  if(c.r>=16){
    const big=c.r===17;
    return `<div class="card joker ${big?'red':''} ${extra}" data-id="${c.id}"><span class="idx">${[...'JOKER'].map(ch=>`<span>${ch}</span>`).join('')}</span><span class="pip">${big?'★':'☆'}</span><span class="jw"><span>${big?'大':'小'}</span><span>王</span></span></div>`;
  }
  const red=c.s==='H'||c.s==='D',wild=isWild(c,L),lvl=!wild&&c.r===L;
  return `<div class="card ${red?'red':''} ${wild?'wild':''} ${lvl?'lvl':''} ${extra}" data-id="${c.id}"><span class="idx"><span class="rk ${c.r===10?'ten':''}">${rankName(c.r)}</span><span class="su">${SUIT_CH[c.s]}</span>${wild?'<span class="tag crown" title="百搭">'+CROWN+'</span>':''}</span><span class="pip">${SUIT_CH[c.s]}</span></div>`;
}
// cards in the order a combination reads; a wild card sits exactly where it stands in for a missing card
function displayOrder(play,L){
  const cs=play.cards.slice(),wilds=cs.filter(c=>isWild(c,L)),nat=cs.filter(c=>!isWild(c,L));
  const bySuit=(a,b)=>SUIT_ORDER[a.s]-SUIT_ORDER[b.s];
  const SEQ={straight:[5,1],sflush:[5,1],pairs3:[3,2],trip2:[2,3]}[play.type];
  if(SEQ){
    // walk the run from its lowest rank; each step takes its own cards, and a wild fills any gap;
    // then read it high to low, left to right, the same way the hand is sorted
    const [len,need]=SEQ,out=[],left=nat.slice();
    for(let q=play.value;q<play.value+len;q++){
      const r=q===1?14:q;
      const here=left.filter(c=>c.r===r).sort(bySuit).slice(0,need);
      for(const c of here)left.splice(left.indexOf(c),1);
      out.push(...here);
      for(let k=here.length;k<need&&wilds.length;k++)out.push(wilds.shift());
    }
    return out.reverse().concat(left,wilds);
  }
  if(play.type==='full'){
    // the three of a kind first (a wild joins it if it is short), then the pair (with any wild it needs)
    const trip=nat.filter(c=>val(c,L)===play.value).sort(bySuit),pair=nat.filter(c=>val(c,L)!==play.value).sort(bySuit);
    while(trip.length<3&&wilds.length)trip.push(wilds.shift());
    return trip.concat(pair,wilds);
  }
  return nat.sort((a,b)=>val(b,L)-val(a,L)||bySuit(a,b)).concat(wilds);
}

/* ---------- the table pile: plays are thrown face up into the middle, a finished trick is turned face down onto the heap ---------- */
let pileZ=1000,heapZ=1;
const BIG=1.5; // how much the most recent play is enlarged
const TRICK_HOLD_MS=2200; // a finished trick stays face up this long, so everyone can remember it, then turns over
// a trick with many cards on the table stays up longer, up to about 5.5 seconds, so they can all be taken in
const trickHold=()=>TRICK_HOLD_MS+Math.min(3300,150*Math.max(0,(G.trickPlays||[]).reduce((s,t)=>s+t.play.cards.length,0)-6));
const pileEl=()=>$('#pile');
// the open play area between the four plates
function pileGeo(){
  const L=pileEl().getBoundingClientRect(),R=q=>$(q).getBoundingClientRect();
  // a player's plate, and in the test version the face-up hand beside it, which the table's cards keep clear of too
  const P=p=>{
    const a=R('#seat'+p+' .whorow'),k=TEST&&$('#peek'+p);
    if(!k||!k.offsetHeight)return a;
    const b=k.getBoundingClientRect();
    return{left:Math.min(a.left,b.left),right:Math.max(a.right,b.right),bottom:Math.max(a.bottom,b.bottom)};
  };
  const top=P(2).bottom-L.top;
  const bottom=R('#seat0').top-L.top;
  // the same margin on both sides (a ticking clock widens one plate, which must not push one player's cards in)
  // (on a phone the plates are small and grow by a count badge or a clock while the cards lie there: room is kept for it)
  const side=Math.max(P(3).right-L.left,L.right-P(1).left)+(isPhone()?34:0);
  const left=side,right=L.width-side;
  const cw=$('#pile .probe').offsetWidth||48;
  const e=R('.emblem'),mid=q=>{const r=R(q);return r.top+r.height/2-L.top};
  // the action column, where it reaches up over the table on the right
  const b=$('#btns'),br=(sideBtns()||phoneRows())&&!b.hidden&&b.offsetHeight?b.getBoundingClientRect():null;
  const col=br?{left:br.left-L.left,top:br.top-L.top}:null;
  return{L,top,bottom,left,right,cx:L.width/2,cy:(top+bottom)/2,hy:e.top+e.height/2-L.top,sideY:{1:mid('#seat1 .who'),3:mid('#seat3 .who')},cw,ch:cw*CR,col,
    ...(r=>r.height?{lp:r.bottom-L.top,lpBox:{l:r.left-L.left,r:r.right-L.left,t:r.top-L.top}}:{lp:0,lpBox:{l:0,r:0,t:0}})(R('#lastPlay')),
    near:nearBottom()-L.top};
}
// the players' room changed (the action column or the line under the disc moved): the cards on the table are fitted
// again, the whole trick stepping down in size if they no longer fit
function pileRefit(){
  const g=pileGeo(),last=pileGroups[pileGroups.length-1];
  // as when a play is thrown: the newest play's player must fit, and the right-hand player beside the column
  while([1,last&&last.p].some(q=>q!=null&&!layoutPlayer(q,g,false))&&TS>minTS())TS=Math.max(minTS(),TS*.9);
  for(let q=0;q<4;q++)layoutPlayer(q,g,true);
}
// how far down your own cards on the table may reach: to your name plate (or your place label once you are out); the
// message line above the plate is empty nearly all the time, so its room is used too
function nearBottom(){
  const pl=$('#myPlace'),r=(pl.textContent?pl:$('#mebar .meinfo')).getBoundingClientRect();
  return r.top;
}
// a small margin kept clear along each plate
const PASS_X=12,PASS_Y=10;
const OLD=.85; // earlier plays in the trick settle a little smaller to leave room
const GAP=10;   // space between two plays of the same player
// Like four people round a square table: each player's cards go straight in front of them.
// The table splits into four zones (a column each for the left and right players, the middle split
// into a far half for your partner and a near half for you), and each player's plays this trick form a
// neat line centred on their own seat: across the table for you and your partner, down the table for the
// players at the sides. A line that runs out of room wraps into a second line closer to the middle.
function zoneFor(p,g){
  if(phoneRows())return phoneZone(p,g);
  const side=(g.right-g.left)*.27,mx0=g.left+side,mx1=g.right-side;
  const z=p===3?{x0:g.left+PASS_X,x1:mx0,y0:g.top+PASS_Y,y1:g.bottom-PASS_Y}
    :p===1?{x0:mx1,x1:g.right-PASS_X,y0:g.top+PASS_Y,y1:g.bottom-PASS_Y}
    :p===2?{x0:mx0,x1:mx1,y0:g.top+PASS_Y,y1:g.cy}
    :{x0:mx0,x1:mx1,y0:g.near-g.lp-2*PASS_Y>=g.ch*.74?Math.max(g.cy,g.lp+PASS_Y):g.cy,y1:g.near-PASS_Y};
  // a side player's cards also stop above the line where it reaches into their part of the table (a narrow screen)
  if((p===1||p===3)&&g.lpBox.r>z.x0&&g.lpBox.l<z.x1&&g.lpBox.t-PASS_Y-z.y0>g.ch)z.y1=Math.min(z.y1,g.lpBox.t-PASS_Y);
  // the right-hand player's cards stop above the action column, so they never lie under the buttons
  if(g.col&&p===1&&g.col.left<z.x1)z.y1=Math.max(z.y0+20,Math.min(z.y1,g.col.top-PASS_Y));
  // a phone on its side shows the tribute line under the score until the first trick is in: your partner's cards
  // keep below it
  const ti=isPhone()&&p===2?$('#tribInfo'):null;
  if(ti&&ti.textContent){const r=ti.getBoundingClientRect(),x0=r.left-g.L.left,x1=r.right-g.L.left;
    if(x0<z.x1&&x1>z.x0)z.y0=Math.max(z.y0,r.bottom-g.L.top+PASS_Y)}
  // a place label already on the plate (someone just went out) keeps its own room, clear of their last cards
  const lab=p!==0&&G.out.includes(p)?$('#seat'+p+' .place'):null;
  if(lab&&lab.offsetWidth){
    const w=$('#seat'+p+' .who').getBoundingClientRect();
    if(p===2)z.y0=Math.max(z.y0,w.bottom-g.L.top+10+lab.offsetHeight+PASS_Y);
    if(p===3)z.x0=Math.max(z.x0,w.right-g.L.left+12+lab.offsetWidth+PASS_X);
    if(p===1)z.x1=Math.min(z.x1,w.left-g.L.left-12-lab.offsetWidth-PASS_X);
  }
  return z;
}
// a phone held upright: the table is cut into four rows, one per player and each as wide as the table - your
// partner's at the top, then the left-hand player's (cards starting from the left), the right-hand player's (cards
// ending at the right) and yours at the bottom - so the whole middle of the table is used and even a long play fits
// at a size everyone can read. The rows share out the room above and below the side plates (and the tags over them)
// in proportion, so that none has to squeeze past a plate; every row keeps clear of the column of play buttons
function phoneZone(p,g){
  const R=q=>$(q).getBoundingClientRect(),a=R('#seat3 .whorow'),c=R('#seat1 .whorow');
  const t=g.top+PASS_Y,b=g.near-PASS_Y;
  const pt=Math.max(t,Math.min(a.top,c.top)-g.L.top-26),pb=Math.min(b,Math.max(a.bottom,c.bottom)-g.L.top+4);
  const A=pt-t,B=b-pb,k=Math.max(1,Math.min(3,Math.round(4*A/Math.max(1,A+B)))),i=[2,3,1,0].indexOf(p);
  const z=i<k?{y0:t+i*A/k,y1:t+(i+1)*A/k-4}:{y0:pb+(i-k)*B/(4-k),y1:pb+(i-k+1)*B/(4-k)-4};
  z.x0=PASS_X;z.x1=g.L.width-PASS_X;
  if(g.col&&g.col.left<z.x1&&g.col.top<z.y1)z.x1=Math.max(z.x0+g.cw,g.col.left-PASS_X);
  return z;
}
// a phone's table changes size during the round (the hand takes fewer rows, the name row wraps): the cards on it are
// laid out again in the new room
// (and after every redraw, since the room also changes when the name row or the hand moves without the table resizing)
let phoneRefitAsked=false;
function phoneRefit(){
  if(!isPhone()||phoneRefitAsked)return;
  phoneRefitAsked=true;
  setTimeout(()=>{phoneRefitAsked=false;if(pileGroups.length)pileRefit()},0);
}
if(window.ResizeObserver)new ResizeObserver(phoneRefit).observe($('#table'));
const pileT=(x,y,rot,flip,sc=1)=>`perspective(800px) translate(${x}px,${y}px) rotate(${rot}deg) rotateY(${flip}deg) scale(${sc})`;
function relPoint(pt,g){return{x:pt.x-g.L.left,y:pt.y-g.L.top}}
// the plays of the current trick, oldest first, each remembering its cards' elements and its own little jitter
let pileGroups=[];
// table scale for this trick: starts at full size and steps down only when a trick no longer fits
let TS=1;
// a phone keeps each play at its size, so a busy trick may have to step down further before it fits
const MIN_TS_PC=.55,minTS=()=>isPhone()?.3:MIN_TS_PC;
function groupDims(gr,g,sc,tag){
  const cw=g.cw*TS,off=cw*.42,span=cw+off*(gr.n-1);
  return{off,cw,ch:cw*CR,w:span*sc+8,h:cw*CR*sc+(tag?26:6)};
}
// lay out one player's plays; with apply=false it only reports whether they fit in the player's zone
function layoutPlayer(p,g,apply){
  const groups=pileGroups.filter(gr=>gr.p===p);
  if(!groups.length)return true;
  // on a phone held upright every player's plays run across their row (see phoneZone)
  const z=zoneFor(p,g),across=p===0||p===2||phoneRows();
  const len=across?z.x1-z.x0:z.y1-z.y0,room=across?z.y1-z.y0:z.x1-z.x0;
  const items=groups.map(gr=>{
    // only a bomb gets a tag, and it sits on the cards' lower edge, so it takes no room of its own
    // a phone keeps every play at the size it came down at (the whole trick steps down only when it no longer fits)
    const tag=gr.latest&&isBomb(gr.play),sc=gr.latest||isPhone()?gr.sc:OLD,d=groupDims(gr,g,sc,false);
    return{gr,sc,d,tag,along:across?d.w:d.h,deep:across?d.h:d.w};
  });
  const lines=[];
  let line=[],used=0;
  for(const it of items){
    if(line.length&&used+GAP+it.along>len){lines.push(line);line=[];used=0}
    used+=(line.length?GAP:0)+it.along;line.push(it);
  }
  lines.push(line);
  const depth=lines.reduce((s,l)=>s+Math.max(...l.map(it=>it.deep)),0)+GAP*(lines.length-1);
  const fits=depth<=room&&lines.every(l=>l.reduce((s,it)=>s+it.along,0)+GAP*(l.length-1)<=len);
  if(!apply)return fits;
  // the first line sits right in front of the player; any further line steps in towards the middle
  const centre=!across?g.sideY[p]:p===3&&phoneRows()?-1e9:p===1&&phoneRows()?1e9:(z.x0+z.x1)/2;
  let edge=p===0?z.y1:p===2||across?z.y0:p===3?z.x0:z.x1;
  const dir=p===0||(p===1&&!across)?-1:1;
  pileEl().querySelectorAll('.ktag[data-p="'+p+'"]').forEach(e=>e.remove());
  for(const l of lines){
    const deep=Math.max(...l.map(it=>it.deep));
    const mid=edge+dir*deep/2;
    const lineLen=l.reduce((s,it)=>s+it.along,0)+GAP*(l.length-1);
    const lo=across?z.x0:z.y0,hi=across?z.x1:z.y1;
    let pos=Math.max(lo,Math.min(hi-lineLen,centre-lineLen/2));
    for(const it of l){
      const c=pos+it.along/2;pos+=it.along+GAP;
      const bx=across?c:mid,by=across?mid:c;
      const cy=by;
      it.gr.els.forEach((el,i)=>{
        const k=i-(it.gr.n-1)/2;
        el.style.transform=pileT(bx+k*it.d.off*it.sc,cy+it.gr.dy[i],it.gr.rot[i]*(it.gr.latest?.5:1),0,it.sc*TS);
      });
      if(it.tag){
        const t=document.createElement('div');
        t.className='ktag'+(isBomb(it.gr.play)?' boom':'');t.dataset.p=p;
        t.textContent=it.gr.play.type==='bomb'?`${it.gr.play.n}张炸弹`:TYPE_NAME[it.gr.play.type];
        t.style.left=bx+'px';t.style.top=cy+it.d.ch*it.sc/2-4+'px';t.style.zIndex=5000;
        pileEl().appendChild(t);
      }
    }
    edge+=dir*(deep+GAP);
  }
  return fits;
}
function pileThrow(p,play,origins,animate){
  const layer=pileEl(),g=pileGeo();
  // the previous play settles back, smaller
  const prev=pileGroups[pileGroups.length-1];
  if(prev&&prev.latest){
    prev.latest=false;
    prev.els.forEach(el=>{el.classList.remove('cur');el.classList.add('old');el.style.transitionDelay='0ms'});
    layer.querySelectorAll('.ktag').forEach(e=>e.remove());
  }
  const cards=displayOrder(play,G.L),n=cards.length,base=(Math.random()-.5)*8;
  const gr={p,play,n,els:[],latest:true,sc:BIG,rot:cards.map(()=>base+(Math.random()-.5)*4),dy:cards.map(()=>(Math.random()-.5)*4)};
  // a phone shows the cards straight away in their places, without the flight and the turn
  const anim=animate&&!reduceMotion()&&!isPhone();
  const seat=relPoint(seatPoint(p),g);
  cards.forEach((c,i)=>{
    const el=document.createElement('div');
    el.className='pc cur';
    el.innerHTML=cardHTML(c,G.L)+'<div class="bk"></div>';
    el.style.zIndex=++pileZ;
    if(anim){
      // your own cards leave your hand face up; everyone else's arrive face down and turn over in flight
      const o=origins&&origins[c.id]?relPoint(origins[c.id],g):seat;
      el.style.transition='none';
      el.style.transform=p===0?pileT(o.x,o.y,0,0,1.4):pileT(o.x,o.y,gr.rot[i]*3,180,.6);
      layer.appendChild(el);
      el.getBoundingClientRect();
      el.style.transition='';
      el.style.transitionDelay=i*30+'ms';
    }else{el.style.transition='none';layer.appendChild(el)}
    gr.els.push(el);
  });
  pileGroups.push(gr);
  // the newest play as large as the player's zone allows, and always clearly larger than the earlier plays; if even
  // its smallest size will not fit, the whole trick steps down in size and every player's line is laid out again
  for(;;){
    let ok=false;
    // (on a phone the new play may come down smaller still on its own, so the plays already there keep their size)
    for(const sc of isPhone()?[BIG,1.4,1.3,1.2,1.1,1,.9,.8,.7,.6]:[BIG,1.4,1.3,1.2,1.1,1]){gr.sc=sc;if(layoutPlayer(p,g,false)){ok=true;break}}
    if(ok||TS<=minTS())break;
    TS=Math.max(minTS(),TS*.9);
  }
  for(let q=0;q<4;q++)layoutPlayer(q,g,true);
  // cards put down without the flight appear right in their places, and only later moves slide
  if(!anim)gr.els.forEach(el=>{el.getBoundingClientRect();el.style.transition=''});
}
// the face-down heap stays a small, tight pile in the middle
const HEAP_R=26,HEAP_SC=.7;
function heapSpot(g){
  const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*Math.min(HEAP_R,g.L.width*.05);
  return pileT(g.cx+Math.cos(a)*r,g.hy+Math.sin(a)*r*.7,Math.random()*360,180,HEAP_SC);
}
function pileSweep(){
  const layer=pileEl(),g=pileGeo();
  pileGroups=[];TS=1;

// requestAnimationFrame tween; the callback is dropped if a new game or round has started meanwhile

function animShuffle(done,at){
  let g=pileGeo();if(at)g={...g,cx:at.x,hy:at.y};

  const mk=()=>{const f=document.createElement('div');f.className='flick';f.style.transition='none';layer.appendChild(f);return f};
  const put=(f,x,y,r)=>{f.style.transform=`translate(${x}px,${y}px) rotate(${r}deg)`};

/* ---------- sound: everything is synthesised with Web Audio, no files ---------- */
const Sound=(()=>{
  const prefs={sfx:true,music:true};
  try{Object.assign(prefs,JSON.parse(localStorage.getItem('guandan-audio')||'{}'))}catch(_){}
  const save=()=>{try{localStorage.setItem('guandan-audio',JSON.stringify(prefs))}catch(_){}};
  let ctx=null,sfxBus,musicBus,musicIn,noise,room,timer=0,now=0;

  function unlock(){
    if(!ctx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return;
      // on an iPad the silent switch / silent mode would otherwise mute the page: play like a media app
      try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(_){}
      ctx=new AC();
      const master=ctx.createGain();master.gain.value=.9;master.connect(ctx.destination);
      sfxBus=ctx.createGain();sfxBus.gain.value=1;sfxBus.connect(master);
      musicBus=ctx.createGain();musicBus.gain.value=0;musicBus.connect(master);

      noise=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
      const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      // a small room, so knocks sound like they happen on a real table rather than inside the speaker
      const len=Math.floor(ctx.sampleRate*.3),ir=ctx.createBuffer(2,len,ctx.sampleRate);
      for(let ch=0;ch<2;ch++){const r=ir.getChannelData(ch);let lp=0;for(let i=0;i<len;i++){lp+=(Math.random()*2-1-lp)*.35;r[i]=lp*Math.exp(-i/(ctx.sampleRate*.055))}}

  function burst(t,dur,{freq=2000,q=1,type='bandpass',gain=.3}={}){

  // knuckle on a wooden table top: a few ms of noise rings the board's resonances, plus a low body thump and the knuckle's click
  function knock(t,v,tune){

    shuffle(){for(let i=0;i<10;i++)burst(now+i*.045,.05,{freq:3200,type:'highpass',gain:.09})},

    // two quick knocks on the table

    tick(){tone(1500,now,.05,{type:'square',gain:.025})},

    },
    // a single card flicked off the deck
    flick(){burst(now,.028,{freq:2800+Math.random()*1800,q:1.3,type:'bandpass',gain:.13});burst(now+.004,.012,{freq:6000,type:'highpass',gain:.05})},
    // a block of cards slapped down on the felt
    cardSlap(){burst(now,.07,{freq:1100,q:.7,gain:.42});tone(150,now,.08,{gain:.2,attack:.002});burst(now,.02,{freq:4200,type:'highpass',gain:.08})},
    // a fast riffle: a run of crisp little card snaps
    riffle(){for(let i=0;i<14;i++)burst(now+i*.028+Math.random()*.008,.022,{freq:3800+Math.random()*1500,type:'highpass',gain:.09})},
    // air moving as the cards sweep: band-passed noise gliding up
    // sobbing: three short whimpers sliding down
    sob(){

    },
    whoosh(){const f=burst(now,.42,{freq:500,q:1.2,type:'bandpass',gain:.22});f.frequency.exponentialRampToValueAtTime(2600,now+.35)},
    error(){tone(150,now,.16,{type:'square',gain:.035})},
    win(){[587,659,740,880,988,1175].forEach((f,i)=>pluck(f,now+i*.09,1.1,.12,sfxBus))},
    lose(){[880,740,659,587,494].forEach((f,i)=>pluck(f,now+i*.14,1.1,.1,sfxBus))},
    // first out: a quick rising run that lands on a held major chord
    fanfare(){
      [523,659,784,1047].forEach((f,i)=>pluck(f,now+i*.08,.5,.13,sfxBus));
      for(const f of [523,659,784,1047])tone(f,now+.34,1.3,{type:'triangle',gain:.06,attack:.02});
      for(let i=0;i<6;i++)burst(now+.34+i*.07,.06,{freq:5200,type:'highpass',gain:.05});
    },
    // the match is won: a rising call that lands on a long bright chord over crashing cymbals
    victory(){
      const N=[[392,0,.18],[523,.18,.18],[659,.36,.18],[784,.54,.36],[659,.9,.18],[784,1.08,1.6]];
      for(const [f,d,len] of N){pluck(f,now+d,len+.3,.13,sfxBus);tone(f/2,now+d,len+.2,{type:'triangle',gain:.05})}

      for(const d of [0,.54,1.08])burst(now+d,.9,{freq:6000,type:'highpass',gain:.12});

  const SCALE=[0,2,4,7,9],BASE=293.66,STEP=.32;

function fxEl(cls,text,x,y){

// a throwaway full-screen canvas running one particle effect
let fxCut=0;
function particles(spawn,step,ms){
  if(reduceMotion())return;
  const cv=document.createElement('canvas');
  cv.className='fx-canvas';cv.width=innerWidth;cv.height=innerHeight;
  document.body.appendChild(cv);
  const cx=cv.getContext('2d'),ps=[],t0=performance.now();
  const frame=t=>{
    if(fxCut>t0){cv.remove();return}
    const age=t-t0;
    spawn(ps,age);
    cx.clearRect(0,0,cv.width,cv.height);
    for(let i=ps.length-1;i>=0;i--){if(!step(cx,ps[i],age))ps.splice(i,1)}
    if(age<ms||ps.length)requestAnimationFrame(frame);else cv.remove();
  };
  requestAnimationFrame(frame);
}
function confetti(x,y){
  const css=getComputedStyle(document.documentElement);
  const cols=['--gold','--latest','--red','--card','--warn'].map(v=>css.getPropertyValue(v).trim());
  let fired=false;
  particles(ps=>{
    if(fired)return;fired=true;
    for(let i=0;i<160;i++){
      const a=-Math.PI/2+(Math.random()-.5)*2.2,v=6+Math.random()*9;
      ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:Math.random()*6,vr:(Math.random()-.5)*.4,w:5+Math.random()*6,h:3+Math.random()*5,c:cols[i%cols.length],life:1})
    }
  },(cx,p)=>{
    p.vy+=.25;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life-=.006;
    cx.save();cx.globalAlpha=Math.max(0,p.life);cx.translate(p.x,p.y);cx.rotate(p.r);
    cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2)));cx.restore();
    return p.life>0&&p.y<innerHeight+20;
  },400);
}
// rockets rise from the bottom of the screen and burst over the given spots, one every gap ms or so for ms
function fireworks(spots,ms=3000,gap=240){
  const css=getComputedStyle(document.documentElement);
  const cols=['--gold','--latest','--red','--card','--warn'].map(v=>css.getPropertyValue(v).trim());
  let all=null,next=0,n=0;
  particles((ps,age)=>{
    all=ps;
    if(age>ms||age<next)return;
    next=age+gap+Math.random()*gap*.9;
    const s=spots[n++%spots.length];
    const x=Math.min(innerWidth-40,Math.max(40,s.x+(Math.random()-.5)*innerWidth*.4));
    const ty=Math.max(50,Math.min(s.y,innerHeight*.6)-80-Math.random()*innerHeight*.25);
    ps.push({rocket:true,x,y:innerHeight+10,ty,vy:-(innerHeight+10-ty)/34,c:cols[n%cols.length]});
  },(cx,p)=>{
    if(p.rocket){
      p.y+=p.vy;
      cx.fillStyle=p.c;cx.fillRect(p.x-1.5,p.y,3,12);
      if(p.y>p.ty)return true;
      Sound.play('pop');
      for(let i=0;i<80;i++){const a=Math.random()*Math.PI*2,v=1+Math.random()*5;all.push({x:p.x,y:p.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c:p.c,life:1})}

    cx.globalAlpha=Math.max(0,p.life);cx.fillStyle=p.c;

    return p.life>0;
  },ms);
}

    for(let i=0;i<3;i++)ps.push({x:Math.random()*innerWidth,y:-10,vx:(Math.random()-.5)*1.5,vy:1.5+Math.random()*2.5,r:Math.random()*6,vr:(Math.random()-.5)*.3,
      w:6+Math.random()*6,h:4+Math.random()*5,c:cols[(Math.random()*cols.length)|0],ph:Math.random()*6})
  },(cx,p,age)=>{
    p.vy=Math.min(p.vy+.02,4.5);p.x+=p.vx+Math.sin(age/300+p.ph)*.8;p.y+=p.vy;p.r+=p.vr;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;
    cx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2)));cx.restore();
    return p.y<innerHeight+20;
  },ms);
}
// the match is over (A passed): twelve seconds, three times as long as a round's. The winners celebrate - light rays
// turning behind a large gold banner, fireworks all over the screen, confetti raining down and the victory call three
// times; the losers mourn - the table greys out under rain, a grey banner sags, tears run and the sad trombone plays.
// A tap anywhere skips to the result; done (showing the result) runs once either way, unless the game has moved on
const VICTORY_MS=12000;
function victory(team,done){
  const won=team===0,m=$('#table').getBoundingClientRect(),tok=G.tok;
  const bg=document.createElement('div');bg.className=won?'fx-rays':'fx-dusk';document.body.appendChild(bg);
  const b=document.createElement('div');b.className='fx fx-champ'+(won?'':' lost');
  b.innerHTML=won?'<b>全场胜利</b><small>打 A 过关</small><i>点任意处看结果</i>':'<b>惜败</b><small>下一场再来</small><i>点任意处看结果</i>';
  b.style.left=m.left+m.width/2+'px';b.style.top=m.top+m.height*.42+'px';document.body.appendChild(b);
  let over=false;
  const at=(ms,fn)=>setTimeout(()=>{if(!over)fn()},ms);
  if(won){
    Sound.play('victory');at(4000,()=>Sound.play('fanfare'));at(7500,()=>Sound.play('victory'));
    const W=innerWidth,H=innerHeight;
    fireworks([...[team,team+2].map(seatPoint),{x:W*.2,y:H*.3},{x:W*.5,y:H*.2},{x:W*.8,y:H*.3}],VICTORY_MS-1500,150);
    confettiRain(VICTORY_MS-2000);
  }else{
    Sound.play('sad');at(4500,()=>Sound.play('lose'));at(8000,()=>Sound.play('sad'));
    $('#app').classList.add('gloom');
    rain(VICTORY_MS-1500);
    at(700,()=>cryAt(0));at(1500,()=>cryAt(2));at(6000,()=>{cryAt(0);cryAt(2)});
  }
  const end=()=>{
    if(over)return;over=true;
    fxCut=performance.now();bg.remove();b.remove();$('#app').classList.remove('gloom');
    removeEventListener('pointerdown',end,true);
    if(G.tok===tok)done();
  };
  // the tap that finished the round is not taken as a skip
  at(800,()=>addEventListener('pointerdown',end,true));
  setTimeout(end,VICTORY_MS);
}
// a crying face pops up by the seat and sobs: tears stream down its cheeks and drip off, splashing where they land
function tears(x,y,ground){
  if(reduceMotion())return;
  const R=30,T=3400;
  let all=null,started=false;
  setTimeout(()=>Sound.play('sob'),300);
  const drop=(cx,px,py,a)=>{
    cx.globalAlpha=a;cx.fillStyle='#8fd0ff';cx.beginPath();cx.moveTo(px,py-7);
    cx.bezierCurveTo(px+5,py-1,px+4.5,py+4,px,py+4.5);cx.bezierCurveTo(px-4.5,py+4,px-5,py-1,px,py-7);cx.fill();cx.globalAlpha=1;
  };
  particles((ps,age)=>{
    all=ps;
    if(!started){started=true;ps.push({k:'face'})}
    if(age>350&&age<T-600&&Math.random()<.45){
      const side=Math.random()<.5?-1:1;
      ps.push({k:'tear',x:x+side*R*.42,y:y+R*.75,vx:side*(.5+Math.random()*1.1),vy:.5+Math.random()})
    }
  },(cx,p,age)=>{
    if(p.k==='face'){
      if(age>T)return false;
      // pops in, then shakes with sobs, and fades at the end
      const sc=age<280?1.15*Math.sin(age/280*Math.PI*.6)/Math.sin(Math.PI*.6):1,a=Math.min(1,Math.max(0,(T-age)/400));
      const fy=y+(age>280?Math.sin(age/85)*1.6:0);
      cx.save();cx.globalAlpha=a;cx.translate(x,fy);cx.scale(sc,sc);
      const g=cx.createRadialGradient(-8,-10,4,0,0,R);g.addColorStop(0,'#ffe27a');g.addColorStop(1,'#f0ac2e');
      cx.fillStyle=g;cx.beginPath();cx.arc(0,0,R,0,Math.PI*2);cx.fill();
      cx.strokeStyle='#8a5a00';cx.lineWidth=2.6;cx.lineCap='round';
      // brows raised in the middle, eyes squeezed shut, mouth wide open and turned down
      for(const sd of [-1,1]){
        cx.beginPath();cx.moveTo(sd*R*.62,-R*.42);cx.lineTo(sd*R*.18,-R*.6);cx.stroke();
        cx.beginPath();cx.arc(sd*R*.4,-R*.08,R*.17,Math.PI*1.1,Math.PI*1.9);cx.stroke();
      }
      cx.fillStyle='#6b3a12';cx.beginPath();cx.ellipse(0,R*.47,R*.36,R*.24,0,Math.PI,0);cx.closePath();cx.fill();
      // two streams of tears running from the eyes to the chin
      if(age>200){
        const run=Math.min(1,(age-200)/400)*R*.85;
        cx.fillStyle='rgba(120,195,255,.8)';
        for(const sd of [-1,1]){cx.beginPath();cx.roundRect?cx.roundRect(sd*R*.4-3.5,0,7,run,3.5):cx.rect(sd*R*.4-3.5,0,7,run);cx.fill()}
      }
      cx.restore();
      return true;
    }
    if(p.k==='tear'){
      p.vy+=.28;p.x+=p.vx;p.y+=p.vy;
      drop(cx,p.x,p.y,.95);
      if(p.y<ground)return true;
      all.push({k:'splash',x:p.x,y:ground,r:2,life:1});
      return false;
    }
    p.r+=1;p.life-=.08;
    cx.strokeStyle=`rgba(150,210,255,${Math.max(0,p.life)*.8})`;cx.lineWidth=1.5;
    cx.beginPath();cx.ellipse(p.x,p.y,p.r,p.r*.35,0,0,Math.PI*2);cx.stroke();
    return p.life>0;
  },T);
}
function jieFeng(from,to){
  Sound.play('whoosh');
  const a=seatPoint(from),b=seatPoint(to),plate=to===0?$('.meinfo'):$('#seat'+to+' .who');
  const land=()=>{
    // the label rises as it fades, so it starts where there is room above it: below the plate of the player
    // across the table (at the top of the screen), above everyone else's
    const r=plate&&plate.getBoundingClientRect();
    const q=!r?actPoint(to):to===2?{x:r.left+r.width/2,y:r.bottom+44}:{x:r.left+r.width/2,y:r.top-30};
    fxEl('fx-tag first','接风',q.x,q.y);
    Sound.play('ding');
    if(plate){plate.classList.add('acting');setTimeout(()=>plate.classList.remove('acting'),2400)}
  };
  if(reduceMotion()){land();return}
  const ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
  const g=document.createElement('div');
  g.className='gust';
  g.style.transform=`translate(${a.x}px,${a.y}px) rotate(${ang}deg)`;
  document.body.appendChild(g);
  g.getBoundingClientRect();
  g.style.transform=`translate(${b.x}px,${b.y}px) rotate(${ang}deg)`;
  setTimeout(()=>{g.style.opacity='0';land()},850);
  setTimeout(()=>g.remove(),1200);
}
// the shuffling / cutting label stands on the side of the player's plate away from the deck: right of the
// player across the table, above the players at the sides (on a narrow screen there is no room beside them)
function actPoint(p){
  const a=$(p===0?'.meinfo':'#seat'+p+' .who').getBoundingClientRect();
  if(p===2)return{x:a.right+56,y:a.top+a.height/2};
  if(p===0)return placePoint(0);
  return{x:a.left+a.width/2,y:a.top-30};
}
// where a player's place label sits: on the table side of their plate (yours at the foot of the table)
function placePoint(p){
  const R=q=>$(q).getBoundingClientRect();
  if(p===0){const m=R('#msg');return{x:m.left+m.width/2,y:m.top-20}}
  if(p===2){const a=R('#seat2 .who');return{x:a.left+a.width/2,y:a.bottom+28}}
  if(p===3){const a=R('#seat3 .whorow');return{x:a.right+48,y:a.top+a.height/2}}
  const a=R('#seat1 .whorow');return{x:a.left-48,y:a.top+a.height/2};
}
// a crying face by a seat: above the plate, or beside it for the player across the table (no room above)
function cryAt(p){
  const seat=p===0?$('.meinfo'):$('#seat'+p+' .who');
  const sr=seat&&seat.getBoundingClientRect(),pt=sr?{x:sr.left+sr.width/2,y:sr.top+sr.height/2}:seatPoint(p);
  if(p===2&&sr)tears(sr.right+52,sr.top+sr.height/2,sr.bottom+70);
  else tears(pt.x,Math.max(56,pt.y-92),pt.y+28);
}
// the place label itself lands on the player's plate (see .place), so this adds only sound and effects
// dbl: the round ended in a double-down, so third place is rained on as well as last
function celebrate(p,place,dbl){
  const seat=p===0?$('.meinfo'):$('#seat'+p+' .who');
  if(place===0){
    Sound.play('fanfare');
    const q=placePoint(p);
    confetti(q.x,q.y);
  }else if(place<3&&!(dbl&&place===2)){
    Sound.play('ding');
  }else{
    // the sad trombone only when it hurts: your side was double-downed (the other side took first and second)
    if(place===3&&dbl&&p%2===0&&G.out[0]%2===1)Sound.play('sad');
    cryAt(p);
    if(seat&&!reduceMotion()){
      seat.classList.add('gloom');
      setTimeout(()=>seat.classList.remove('gloom'),2600);
    }
  }
}

const handEl=$('#hand');

function setSel(id,on,lazy){
  if(on)sel.add(id);else sel.delete(id);
  // a card being put back down waits out the double-tap window, so a double tap never dips it first
  const show=()=>{const el=handEl.querySelector(`.card[data-id="${id}"]`);if(el)el.classList.toggle('sel',sel.has(id))};
  if(lazy&&!on)setTimeout(show,360);else show();

handEl.addEventListener('pointerdown',e=>{
  if(G.phase!=='play'&&G.phase!=='return'&&G.phase!=='prep'&&G.phase!=='tribPick')return;
  // a tap on the hand's empty felt, beside or between the cards, puts every picked card back
  const el=e.target.closest('.card');if(!el){if(e.target===handEl)clearPicked();return}
  e.preventDefault();
  const id=+el.dataset.id,t=performance.now();
  if(lastDown&&lastDown.id===id&&t-lastDown.t<350){
    // double tap: undo the first tap's toggle, keep this card in the selection, then play it

handEl.addEventListener('pointermove',e=>{

  // bomb or a run can be swept up and dragged into the fixed zone in one go
  if(mv&&!mv.active&&!sel.has(mv.id)&&!testGrouped()){
    if(Math.hypot(e.clientX-mv.x0,e.clientY-mv.y0)<6)return;

    setSel(id,on);

  const t=document.elementFromPoint(e.clientX,e.clientY);
  const el=t&&t.closest('#hand .card');if(!el)return;
  // a fast sweep can skip cards between two pointer events, so fill in everything between the last card and this one
  const kids=[...handEl.children],i=kids.indexOf(el);
  if(i<0||i===sweep.last)return;
  const step=i>sweep.last?1:-1;
  for(let j=sweep.last+step;;j+=step){

    if(!sweep.seen.has(id)){sweep.seen.add(id);setSel(id,sweep.on)}

});

// picking up a selected card carries the whole selection with it, so a combination can be moved as one block
function moveCards(e){
  if(!mv.active){
    if(Math.hypot(e.clientX-mv.x0,e.clientY-mv.y0)<6)return;
    const all=[...handEl.children].map(c=>+c.dataset.id),fixed=new Set(G.fixed.flat()),ord=all.filter(i=>!fixed.has(i));
    mv.ids=sel.has(mv.id)&&sel.size>1?all.filter(i=>sel.has(i)):[mv.id];
    mv.grab=mv.ids.indexOf(mv.id);
    mv.others=ord.filter(i=>!mv.ids.includes(i));
    mv.order=ord;
    // the active zone as it will be with the dragged cards dropped into it
    mv.g=handGeo(mv.others.length+mv.ids.length,null);
    mv.rowOf=mv.g.counts.flatMap((k,r)=>Array(k).fill(r));
    const L=handEl.getBoundingClientRect(),el=cardEl(mv.id);
    mv.dx=mv.x0-L.left-parseFloat(el.style.left);
    mv.dy=mv.y0-L.top-parseFloat(el.style.top);
    mv.ids.forEach((id,j)=>{const c=cardEl(id);c.classList.add('drag');c.style.zIndex=1000+j});
    mv.active=true;lastDown=null;
    drawFixZone(mv.g);
  }
  const L=handEl.getBoundingClientRect(),g=mv.g,k=mv.ids.length;
  const x=e.clientX-L.left-mv.dx,y=e.clientY-L.top-mv.dy;
  mv.ids.forEach((id,j)=>{const c=cardEl(id);c.style.left=x+(j-mv.grab)*g.cw*.36+'px';c.style.top=y+'px'});
  // over the fixed zone: on a group's cards they will join that group (its tag lights up); anywhere else in the zone
  // (beside the groups, on the tags) they make a new group
  const px=e.clientX-L.left,py=e.clientY-L.top,fz=$('#fixZone');
  if(g.inFix?g.inFix(px,py):px<g.fixEdge){
    let row=-1;
    if(g.fixAt)row=g.fixAt(px,py);else g.fixTags.forEach((r,i)=>{if(py>=r.y-4&&py<r.y+g.ch&&px<r.x-5)row=i});
    if(mv.t==='fix'&&mv.row===row)return;
    mv.t='fix';mv.row=row;
    mv.others.forEach((id,i)=>placeCard(cardEl(id),g.slots[i],100+i));
    const lm=$('#landMark');if(lm)lm.remove();
    fz.classList.add('over');
    fz.querySelector('.fzl').textContent=row<0?'放下成为新的一组':'放下加入这一组';
    document.querySelectorAll('#fixTags .fzt').forEach((t,i)=>t.classList.toggle('hot',i===row));
    Sound.play('deal');
    return;
  }
  if(fz.classList.contains('over')){
    fz.classList.remove('over');
    fz.querySelector('.fzl').textContent='固定区';
    document.querySelectorAll('#fixTags .fzt').forEach(t=>t.classList.remove('hot'));
  }
  if(mv.t==='fix')mv.t=null;
  const cx=x+g.cw/2,cy=y+g.ch/2;
  let s=0,best=Infinity;
  g.slots.forEach((sl,i)=>{const d=(sl.x+g.cw/2-cx)**2+((sl.y+g.ch/2-cy)*1.6)**2;if(d<best){best=d;s=i}});
  const t=Math.max(0,Math.min(g.slots.length-k,s-mv.grab));
  if(t===mv.t)return;
  mv.t=t;
  mv.order=[...mv.others.slice(0,t),...mv.ids,...mv.others.slice(t)];
  mv.order.forEach((id,i)=>{if(!mv.ids.includes(id))placeCard(cardEl(id),spreadSlot(i),100+i)});
  showLanding();

}
// the cards in the landing row step aside, the nearest ones most, so a clear gap opens where the dragged cards will go
function spreadSlot(i){
  const g=mv.g,t=mv.t,k=mv.ids.length,sl=g.slots[i],row=mv.rowOf[t];

  const w=(mv.rowOf[mv.t]===mv.rowOf[mv.t+mv.ids.length-1]?b.x-a.x:0)+g.cw;

function fixCards(ids,row){
  const target=row>=0?G.fixed[row]:null;
  G.fixed=G.fixed.map(gr=>gr===target?gr:gr.filter(id=>!ids.includes(id)));
  if(target){const i=G.fixed.indexOf(target);G.fixed[i]=tidyGroup(target.filter(id=>!ids.includes(id)).concat(ids))}

// every straight flush the hand can make, wild cards filling the gaps: those needing fewer wild cards first, then low to
// high; each press of 同花顺 picks the next one, so the player can look them over and set one aside while sorting
function straightFlushes(){
  const hand=G.hands[0],L=G.L,w=hand.filter(c=>isWild(c,L)),out=[];
  for(const su of SUITS)for(let s=1;s<=10;s++){
    const nat=[];let wu=0;
    for(let q=s;q<s+5;q++){const r=q===1?14:q,c=hand.find(x=>!isWild(x,L)&&x.s===su&&x.r===r);if(c)nat.push(c);else wu++}
    if(wu<=w.length&&wu<5){const cards=nat.concat(w.slice(0,wu));if(analyze(cards,L).some(a=>a.type==='sflush'))out.push({cards,wu,s,su})}
  }
  return out.sort((a,b)=>a.wu-b.wu||a.s-b.s||SUIT_ORDER[a.su]-SUIT_ORDER[b.su]);
}

// the groups you set that are still whole, and the rest of the hand arranged the computer's way, in the order shown

  const auto=free.length?armPlaysRaw(free,L).map(u=>displayOrder(u,L).map(c=>c.id)):[];

// hand is sorted), or, not arranged (while dealing), one group per rank
const T_ORDER=['jokers','sflush','bomb','trip2','pairs3','straight','full','triple','pair','single'];
function handUnits(cards,L,grouped){
  if(grouped)return armPlays(cards,L).slice()
    .sort((a,b)=>T_ORDER.indexOf(a.type)-T_ORDER.indexOf(b.type)||(isBomb(a)?power(b)-power(a):b.value-a.value))
    .map(u=>({cards:displayOrder(u,L),name:u.type==='bomb'?u.n+'张炸弹':TYPE_NAME[u.type]}));
  const out=[];
  for(const c of sortHand(cards.slice(),L)){
    const g=out[out.length-1];
    if(g&&val(g.cards[0],L)===val(c,L)&&isWild(g.cards[0],L)===isWild(c,L))g.cards.push(c);else out.push({cards:[c],name:''});
  }
  return out;
}
// a seat's cards as a record shows them: yours in the groups you had when play began, a computer's as you rearranged it
// (less what has been played since), or else the computer's own arrangement
function recUnits(rec,p,cards){
  const gs=p?rec.userGroups&&rec.userGroups[p]:rec.myGroups;
  if(!gs)return handUnits(cards,rec.L,true);
  const by=new Map(cards.map(c=>[c.id,c]));
  return gs.map(gr=>gr.filter(id=>by.has(id)).map(id=>by.get(id))).filter(g=>g.length).map(g=>({cards:g,name:''}));
}
// the groups in at most three rows (or as many as asked), as even in length as the groups allow (lengths in card widths:
// each further card shows 0.42 of a card, a gap of 0.22 between groups)
function rowsOf(units,k=3){
  const W=units.map(u=>1.22+.42*(u.cards.length-1)),n=units.length,pre=[0];
  for(const w of W)pre.push(pre[pre.length-1]+w);
  // best[r][i]: the widest row when the first i groups go in r rows, and where its last row starts
  const best=[[{m:0,at:0}].concat(Array(n).fill({m:Infinity,at:0}))];
  for(let r=1;r<=k;r++){
    const row=[{m:0,at:0}];
    for(let i=1;i<=n;i++){
      let b={m:Infinity,at:0};
      for(let j=0;j<i;j++){const m=Math.max(best[r-1][j].m,pre[i]-pre[j]);if(m<b.m-1e-9)b={m,at:j}}
      row.push(b.m<best[r-1][i].m-1e-9?b:{...best[r-1][i],same:true});
    }
    best.push(row);
  }
  const rows=[];
  for(let r=k,i=n;r>0&&i>0;r--){const b=best[r][i];if(b.same)continue;rows.unshift(units.slice(b.at,i));i=b.at}
  return rows;
}

function testPlays(){

// what was changed in the sorting, seat by seat: the groups of the computer's own arrangement taken apart, the groups
// made instead, and the 牌力 before and after
function testChanges(rec){
  const out=[];
  for(const p of [0,1,2,3]){
    const after=p?rec.userGroups&&rec.userGroups[p]:rec.myGroups,before=rec.rawGroups&&rec.rawGroups[p];
    if(!after||!before)continue;
    const by=new Map(rec.hands[p].map(c=>[c.id,c])),key=g=>g.slice().sort((a,b)=>a-b).join();
    const A=new Set(after.map(key)),B=new Set(before.map(key));
    const gone=before.filter(g=>!A.has(key(g))),made=after.filter(g=>!B.has(key(g)));
    if(!gone.length&&!made.length)continue;
    const desc=g=>{const cs=g.map(id=>by.get(id)).filter(Boolean),u=readGroup(cs,rec.L);return`[${u?playName(u):'散牌'} ${cs.map(c=>cardText(c)+(isWild(c,rec.L)?'*':'')).join(' ')}]`};
    out.push(`${NAMES[p]}${p?'（你改了电脑的理牌）':'（你理的牌和电脑的配法不同）'}：拆掉 ${gone.map(desc).join('、')||'没有'}；新组成 ${made.map(desc).join('、')||'没有'}；牌力 ${p?`${rec.power[p]} → ${rec.userPower[p]}`:`电脑配法 ${rec.power[0]} → 你理的 ${rec.myPower}`}`);
  }
  return out;
}

/* the record as text, to save, copy, and bring back in */
// for each round the hands as play began (the computer's as arranged, yours as you grouped them), then every play in
// order with the computer's arrangement just before it and your comment, the passes, how each trick ended, what was left
// and the result; at the end the same rounds as data, for 导入
function testText(rounds=TREC.rounds){
  const out=['掼蛋测试版出牌记录',`保存时间：${new Date().toLocaleString()}　页面版本：${VERSION}`,
    '你和对家一方，下家和上家一方。牌后带 * 的是逢人配（红桃级牌）。[ ] 里是配好的一组一组（电脑的是它的配牌，你的是你理好的牌）。',
    '每一次轮到谁（出牌或者过）都算一手，按顺序编号。',
    '1号是你，逆时针（出牌的顺序）依次是 2号（你的下家）、3号（你的对家）、4号（你的上家）。',''];
  for(const r of rounds){
    const ct=c=>cardText(c)+(isWild(c,r.L)?'*':'');
    const shown=(cards,p,grouped)=>(grouped?recUnits(r,p,cards):handUnits(cards,r.L,false)).map(u=>grouped?'['+u.cards.map(ct).join(' ')+']':u.cards.map(ct).join(' ')).join(grouped?' ':'  ');
    out.push('='.repeat(48),`${recName(r)}　${roundName(r)}　打 ${rankName(r.L)}（${r.lvlTeam===0?'我方':'对方'}的级）　${NAMES[r.leader]}先出　${r.at||''}`);
    for(const t of r.trib)out.push('  '+t);
    if(r.kang)out.push('  '+r.kang);
    out.push('','开局手牌（进贡、还贡之后）：');
    for(const p of [0,1,2,3]){
      const mine=p===0&&r.myGroups,ug=p&&r.userGroups[p];
      out.push(`  ${NAMES[p]}　${r.hands[p].length} 张　${mine?`${powerText(r.myPower)}（你理的牌；电脑配牌 ${r.power[0]}）`:
        ug?`电脑配牌${powerText(r.power[p])}；你改后${powerText(r.userPower[p])}（电脑按你改后的牌打）`:powerText(r.power[p])}`);
      if(ug)out.push('    电脑原来：'+handUnits(r.hands[p],r.L,true).map(u=>'['+u.cards.map(ct).join(' ')+']').join(' '),'    你改后：　'+shown(r.hands[p],p,true));
      else out.push('    '+shown(r.hands[p],p,p!==0||!!mine));
    }
    const ch=testChanges(r);
    if(ch.length)out.push('','理牌改动：',...ch.map(t=>'  '+t));
    if(r.notes[0])out.push(`  开局评语：${r.notes[0]}`);
    out.push('','出牌：');
    const hands=r.hands.map(h=>h.slice());
    let last=null;
    r.log.forEach((e,i)=>{
      const k=i+1,no=`  ${String(k).padStart(3)}. `;
      if(!e.cards){
        const t=passedOn(r,k);
        out.push(`${no}${NAMES[e.p]} 过${t?`（桌上是${NAMES[t.p]}的${playName(t)}：${displayOrder(t,r.L).map(ct).join(' ')}）`:''}`);
        if(e.p!==0)out.push(`         （当时的配牌：${shown(hands[e.p],e.p,true)}）`);
      }else{
        if(e.lead&&last!=null)out.push(`         —— ${trickEnd(last,e.p)}`);
        last=e.p;
        out.push(`${no}${NAMES[e.p]} ${e.lead?'领出':'跟　'} ${playName(e)}：${displayOrder(e,r.L).map(ct).join(' ')}`);
        if(e.p!==0)out.push(`         （出牌前的配牌：${shown(hands[e.p],e.p,true)}）`);
        const ids=new Set(e.cards.map(c=>c.id));
        hands[e.p]=hands[e.p].filter(c=>!ids.has(c.id));
      }
      if(r.notes[k])out.push(`         【评语】${r.notes[k]}`);
    });
    for(const p of [0,1,2,3])if(hands[p].length&&r.result)out.push(`  剩牌：${NAMES[p]}　${shown(hands[p],0,false)}`);
    // the card counter as the record stands: each player's played cards by rank, and what is still out
    const ks=TALLY_RANKS(r.L),per=tallyPlayed(r.log,r.L),lab=k=>k===17?'大王':k===16?'小王':k===15?`级牌${rankName(r.L)}`:rankName(k);
    out.push('','记牌器（已出的牌）：');
    for(const p of [0,1,2,3])out.push(`  ${NAMES[p]}　`+ks.filter(k=>per[p][k]).map(k=>`${lab(k)}×${per[p][k].length}`).join(' '));
    out.push('  剩余　'+ks.map(k=>`${lab(k)}×${tallyLeft(r.log,r.L,k).length}`).join(' '));
    out.push('',r.result?'结果：'+r.result:'（这一局没打完）','');
  }
  out.push('---- 下面一行是给程序读的数据（导入用），请不要改 ----',TDATA+JSON.stringify(rounds.map(recOut)));
  return out.join('\r\n');
}
// 生成记录交给 Claude: the latest round with its comments. In the claude.ai viewer it goes into this page's own store

    }catch(e){testSay('没能交给 Claude（'+((e&&e.code)||'出错')+'），请改用“复制”，把记录贴给 Claude。')}

  }

// in the claude.ai viewer the rounds handed over earlier (on this or another device) come back into the record
async function testDbLoad(){

  if(!db)return;
  try{
    const snap=await db.collection('rounds').get(),have=new Set(TREC.rounds.map(r=>r.uid)),add=[];

/* ---------- connections (PeerJS: browsers talk to each other directly, matched by the room number) ---------- */
const ROOM_PREFIX='guandan-room-';
// the page's version (stamped by build.py when the public page is built). A browser can keep an older copy of
// the page for a while, and players on different versions can fall out of step, so a room compares them.
const VERSION='1029-2129';
$('#verTag').textContent=VERSION==='dev'?'':'版本 '+VERSION;
const OLD_PAGE='页面版本和房主不同，请刷新页面（电脑按 Ctrl+F5）后重新加入';

const peerReady=()=>{if(window.Peer&&!window.claude)return true;lobbyStatus('联机需要在 clintsun1977.github.io/guandan 打开');return false};
/* ---------- voice: the people at an online table talk to each other as on a conference call ---------- */
// every two people have their own audio line (the lower seat, in the host's numbering, calls the higher), so no voice
// goes through the host. A line starts with a silent track; turning the microphone on puts the real one in its place,
// and turning it off only silences it, so the lines stay up. Whose microphone is on goes round through the host
// (NET.mics, host's seat numbers); who is talking is measured on each page from the sound itself.
const VC=(()=>{
  const SPK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
  document.querySelectorAll('.vc').forEach(e=>e.innerHTML=SPK);

  const lines=new Map(),meters=new Map(),heard=new Map(),talking=new Set(),waiting=[],buf=new Uint8Array(512);
  const me=()=>toAbs(0);
  const ctx=()=>{if(!ac){const AC=window.AudioContext||window.webkitAudioContext;if(AC)ac=new AC()}return ac};
  const track=()=>mic||blank||(blank=ctx()?ac.createMediaStreamDestination().stream.getAudioTracks()[0]:null);

  }
  function wire(call,a){
    if(lines.has(a))drop(a);
    const ln={call,audio:null,got:false};lines.set(a,ln);
    call.on('stream',st=>{
      if(lines.get(a)!==ln)return;
      ln.got=true;
      if(!ln.audio){ln.audio=document.createElement('audio');ln.audio.autoplay=true;ln.audio.setAttribute('playsinline','');ln.audio.hidden=true;document.body.appendChild(ln.audio)}
      ln.audio.srcObject=st;ln.audio.play().catch(()=>{});

    const broke=()=>{if(lines.get(a)!==ln)return;drop(a);if(me()<a)setTimeout(()=>{if(here(a)&&!lines.has(a))dial(a)},3000)};

  // a call can arrive before this page has learnt who sits where: it waits until then
  function incoming(call){if(active)answer(call);else waiting.push(call)}

  // someone left the table: their line goes; once nobody else is left, voice ends
  function prune(){
    if(!active)return;
    for(const a of [...lines.keys()])if(!here(a))drop(a);
    if(NET.humans.size<2)stop();else paint();
  }
  function swap(call,t){try{const sd=call.peerConnection&&call.peerConnection.getSenders().find(x=>!x.track||x.track.kind==='audio');if(sd)sd.replaceTrack(t)}catch(_){}}

    if(!active)return;

      try{
        // an iPad plays the page like a media app; to listen to the microphone it has to switch to a call
        try{if(navigator.audioSession)navigator.audioSession.type='play-and-record'}catch(_){}
        const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
        if(!active){st.getTracks().forEach(t=>t.stop());return}

  function listen(){

    }

  function paint(){

      const a=toAbs(q),mine=q===0?on:!!NET.mics[a];

    }
  }
  // browsers hold sound back until the page is touched: every tap wakes the listening and the lines up again
  function wake(){
    if(ac&&ac.state!=='running')try{ac.resume().catch(()=>{})}catch(_){}
    for(const ln of lines.values())if(ln.audio&&ln.audio.paused)ln.audio.play().catch(()=>{});
  }
  return {start,stop,prune,incoming,toggle,wake,paint};
})();
function leaveNet(){
  VC.stop();

// the host: claims a free room number and keeps the seat list
function openRoom(){
  if(!peerReady())return;
  const code=String(1000+(Math.random()*9000|0));
  const peer=new Peer(ROOM_PREFIX+code);
  NET.peer=peer;
  lobbyStatus('正在开房间…');
  peer.on('open',()=>{
    if(NET.peer!==peer)return;
    NET.peerOpen=true;NET.code=code;

  });

  });
  peer.on('call',c=>VC.incoming(c));

      if(NET.started){conn.send({t:'full'});setTimeout(()=>conn.close(),500);return}
      NET.conns.set(conn.peer,{conn,dir:'',name:'',seen:Date.now()});
      conn.send({t:'lobby',seats:NET.lobby,you:'',rules:RULES,ver:VERSION});

  });

function broadcast(msg){for(const v of NET.conns.values())if(v.conn.open)v.conn.send(msg)}
function broadcastLobby(){for(const v of NET.conns.values())if(v.conn.open)v.conn.send({t:'lobby',seats:NET.lobby,you:v.dir,rules:RULES,ver:VERSION})}
function hostOnData(conn,d){
  const info=NET.conns.get(conn.peer);if(!info||!d)return;
  info.seen=Date.now();
  if(d.t==='bye'){hostOnClose(conn,'quit');try{conn.close()}catch(_){}return}
  if(d.t==='mic'){if(NET.started&&info.dir){NET.mics[absOf(info.dir,NET.hostDir)]=!!d.on;broadcast({t:'mics',m:NET.mics});VC.paint()}return}
  if(d.t==='sit'&&!NET.started){
    if(!DIRS.includes(d.dir)||(NET.lobby[d.dir]&&info.dir!==d.dir))return;
    if(info.dir)NET.lobby[info.dir]=null;
    info.dir=d.dir;info.name=String(d.name||'').replace(/[<>&"']/g,'').slice(0,8)||'玩家';
    NET.lobby[d.dir]=info.name;
    broadcastLobby();renderLobby();
    if(d.ver&&d.ver!==VERSION)lobbyStatus(`${info.name}的页面版本不同（${d.ver}），请他刷新页面`);
  }
  if(d.t==='act'&&NET.started&&info.dir&&!hostGuestAct(absOf(info.dir,NET.hostDir),d.e||{})&&conn.open)conn.send({t:'nope',k:(d.e||{}).k});

// a friend's move: only for their own seat, and a play must be legal, exactly what their own buttons check
// false when the move is refused (the friend's page is then told, so it does not keep waiting)
function hostGuestAct(seat,e){
  if(!isHumanSeat(seat))return false;
  switch(e.k){
    case'next':if(e.p!==seat)return false;break;
    case'shuffle':if(G.shuffler!==seat)return false;break;
    case'cut':if(G.cutter!==seat)return false;break;
    case'pass':case'return':case'ready':if(e.p!==seat)return false;break;
    case'pause':if(e.p!==seat||(G.paused&&G.pausedBy!==seat))return false;break;
    case'tribute':if(e.p!==seat||G.phase!=='tribPick'||!tribOptions(seat).some(c=>c.id===e.id))return false;break;
    case'play':{
      if(e.p!==seat||G.phase!=='play'||G.turn!==seat)return false;
      const cards=(e.ids||[]).map(id=>G.hands[seat].find(c=>c.id===id));
      if(!cards.length||cards.some(c=>!c))return false;
      const cur=G.trick?G.trick.play:null;
      // the cards decide what the play is: if the friend's page named it differently (an older page, say),
      // take the strongest reading that beats the table, exactly as the player's own button would
      const ok=analyze(cards,G.L).filter(r=>beats(r,cur)).sort((a,b)=>strength(b)-strength(a));
      if(!ok.length)return false;
      if(!ok.some(r=>r.type===e.type&&r.value===e.value))e={...e,type:ok[0].type,value:ok[0].value,n:ok[0].n};
      break;
    }
    default:return false;
  }
  act(e);
  return true;
}
function hostOnClose(conn,how='drop'){
  const info=NET.conns.get(conn.peer);if(!info)return;
  NET.conns.delete(conn.peer);
  if(!NET.started){if(info.dir)NET.lobby[info.dir]=null;broadcastLobby();renderLobby();return}
  if(!info.dir)return;
  // a friend who drops out mid-game: the computer takes over their seat from here on
  const seat=absOf(info.dir,NET.hostDir);
  const list=[...NET.humans].filter(h=>h!==seat);
  act({k:'humans',list,names:NET.names,left:info.name,how});
  const c=G.clock;
  if(c&&(c.who===seat||c.seat===seat)){G.clock=null;timeUp(c)}
  if(owesReturn(seat))act({k:'return',p:seat,id:aiReturnCard(G.hands[seat],G.L).id});
  if(G.phase==='tribPick'&&G.tribGivers.includes(seat)&&G.tribPick[seat]==null)act({k:'tribute',p:seat,id:tributeCard(G.hands[seat],G.L).id});
  if(G.phase==='prep'&&[...NET.humans].every(h=>G.ready.includes(h)))act({k:'begin'});
}
// the host starts: everyone learns where everyone sits, then the first deal goes out
function startOnline(){
  NET.started=true;NET.hostDir=myDir;
  const names={};
  for(const d of DIRS)if(NET.lobby[d])names[absOf(d,myDir)]=NET.lobby[d];
  NET.names=names;
  // each person's connection name, so the people at the table can call each other for voice
  const peers={0:NET.peer.id};
  for(const v of NET.conns.values())if(v.dir&&NET.lobby[v.dir])peers[absOf(v.dir,myDir)]=v.conn.peer;
  broadcast({t:'start',hostDir:myDir,names,rules:RULES,peers});
  enterOnline('host',myDir,names);
  newGame();
  VC.start(peers);
}
function enterOnline(mode,hostDir,names){

// a friend: connects to the room number and follows the host
function joinRoom(code){
  if(!peerReady())return;
  leaveNet();
  lobbyStatus('正在连接…');
  const peer=new Peer();
  NET.peer=peer;
  peer.on('call',c=>VC.incoming(c));
  peer.on('open',()=>{
    if(NET.peer!==peer)return;
    const conn=peer.connect(ROOM_PREFIX+code,{reliable:true});
    NET.hostConn=conn;
    conn.on('open',()=>{NET.hostSeen=Date.now();lobbyStatus('选一个空座位');$('#roomCodeShow').textContent=code;$('#roomInfo').hidden=false;renderLobby()});
    conn.on('data',guestOnData);
    conn.on('close',hostGone);
  });
  peer.on('error',err=>{
    if(NET.peer!==peer)return;
    lobbyStatus(err.type==='peer-unavailable'?'没有这个房间，请核对房间号':'连接失败，请检查网络后重试');
  });
}
function sendSit(d){if(NET.hostConn&&NET.hostConn.open)NET.hostConn.send({t:'sit',dir:d,name:nickNow(),ver:VERSION})}
function guestOnData(d){
  if(!d)return;
  NET.hostSeen=Date.now();
  if(d.t==='ping'){NET.hostConn&&NET.hostConn.open&&NET.hostConn.send({t:'pong'});return}
  if(d.t==='bye'){hostGone();return}
  if(d.t==='mics'){NET.mics=d.m||{};VC.paint();return}
  // the host turned a move down: stop waiting for it and let the player try again
  if(d.t==='nope'){NET.pending=false;if(['play','pass','return','tribute'].includes(d.k))setMsg('这一步没有成功，请再试一次',true);render();return}
  if(d.t==='lobby'){
    NET.lobby=d.seats;myDir=d.you||'';
    if(d.rules)Object.assign(RULES,d.rules);
    lobbyStatus(d.ver&&d.ver!==VERSION?OLD_PAGE:myDir?'已坐下，等房主开始':'选一个空座位');
    renderLobby();
  }else if(d.t==='full'){
    NET.refused=true;lobbyStatus('这个房间已经开始打了');
  }else if(d.t==='start'){
    if(!myDir)return;
    myNick=nickNow();
    try{localStorage.setItem('guandan-nick',myNick)}catch(_){}
    if(d.rules)Object.assign(RULES,d.rules);
    enterOnline('guest',d.hostDir,d.names);
    resetGame();render();
    VC.start(d.peers);
  }else if(d.t==='evt'){
    NET.inbox.push(d.e);
  }

function hostGone(){
  if(NET.gone)return;

      <div class="btns"><button class="btn primary" id="soloOnBtn">和电脑继续打</button><button class="btn" id="backBtn">退出游戏</button></div>`);

  }else if(lobbyMode==='join'){
    if(NET.refused)return;
    NET.hostConn=null;myDir='';lobbyStatus('和房间断开了，请重新加入');renderLobby();
  }
}
// the host left: this table carries on alone from wherever the game stood, the computer taking every other seat
function goSolo(){
  VC.stop();
  try{NET.peer&&NET.peer.destroy()}catch(_){}
  NET.peer=null;NET.hostConn=null;NET.inbox=[];NET.pending=false;
  NET.mode='solo';NET.off=0;
  setHumans([0]);
  hideOverlay();
  const c=G.clock;G.clock=null;
  if(G.phase==='shuffle'&&!G.busy)startShuffle();
  else if(G.phase==='cut'&&!G.busy)startCut();
  else if(G.phase==='return')retWait();
  else if(G.phase==='tribPick')tribWait();
  else if(G.phase==='prep'){if(G.ready.includes(0))beginPlay();else{G.clock=c&&c.who==='prep'?c:{who:'prep',left:PREP_MS,total:PREP_MS};render()}}
  else if(G.phase==='play'&&G.turn>=0)startTurn();
  else if(G.phase==='roundEnd'||G.phase==='over')showResult();
  render();
}
// a closed tab or a lost phone signal is not always reported by the connection itself, so both ends say hello
// every two seconds, and 20 seconds of silence counts as leaving
const SILENT_MS=20000;
setInterval(()=>{
  const now=Date.now();
  for(const v of [...NET.conns.values()]){
    if(now-v.seen>SILENT_MS){try{v.conn.close()}catch(_){}hostOnClose(v.conn);continue}
    if(v.conn.open)v.conn.send({t:'ping'});
  }
  if(NET.hostConn&&NET.hostSeen&&now-NET.hostSeen>SILENT_MS){
    const c=NET.hostConn;NET.hostSeen=0;try{c.close()}catch(_){}hostGone();
  }
},2000);
window.claude?.hot?.snapshot?.(()=>({G}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
