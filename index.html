/* ---------- sound: everything is synthesised with Web Audio, no files ---------- */
const Sound=(()=>{
  const prefs={sfx:true,music:true};
  try{Object.assign(prefs,JSON.parse(localStorage.getItem('guandan-audio')||'{}'))}catch(_){}
  const save=()=>{try{localStorage.setItem('guandan-audio',JSON.stringify(prefs))}catch(_){}};
  let ctx=null,sfxBus,musicBus,musicIn,noise,room,timer=0,now=0;

  function unlock(){
    if(!ctx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return;
      ctx=new AC();
      const master=ctx.createGain();master.gain.value=.9;master.connect(ctx.destination);
      sfxBus=ctx.createGain();sfxBus.gain.value=1;sfxBus.connect(master);
      musicBus=ctx.createGain();musicBus.gain.value=0;musicBus.connect(master);
      // a soft echo gives the plucked melody some room
      musicIn=ctx.createGain();musicIn.connect(musicBus);
      const dl=ctx.createDelay(1),fb=ctx.createGain(),wet=ctx.createGain();
      dl.delayTime.value=.38;fb.gain.value=.3;wet.gain.value=.32;
      musicIn.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(musicBus);
      noise=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
      const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      // a small room, so knocks sound like they happen on a real table rather than inside the speaker
      const len=Math.floor(ctx.sampleRate*.3),ir=ctx.createBuffer(2,len,ctx.sampleRate);
      for(let ch=0;ch<2;ch++){const r=ir.getChannelData(ch);let lp=0;for(let i=0;i<len;i++){lp+=(Math.random()*2-1-lp)*.35;r[i]=lp*Math.exp(-i/(ctx.sampleRate*.055))}}
      room=ctx.createConvolver();room.buffer=ir;
      const roomWet=ctx.createGain();roomWet.gain.value=.22;room.connect(roomWet);roomWet.connect(sfxBus);
    }
    if(ctx.state==='suspended')ctx.resume();
    if(prefs.music)startMusic();
  }
  const ready=()=>ctx&&ctx.state==='running';

  function tone(f,t,dur,{type='sine',gain=.2,attack=.005,dest=sfxBus}={}){
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+attack);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.05);
    return o;
  }
  function burst(t,dur,{freq=2000,q=1,type='bandpass',gain=.3}={}){
    const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();
    s.buffer=noise;f.type=type;f.frequency.value=freq;f.Q.value=q;
    g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f);f.connect(g);g.connect(sfxBus);s.start(t,Math.random()*.5);s.stop(t+dur+.02);
    return f;
  }
  // knuckle on a wooden table top: a few ms of noise rings the board's resonances, plus a low body thump and the knuckle's click
  function knock(t,v,tune){
    const out=ctx.createGain();out.gain.value=1;out.connect(sfxBus);out.connect(room);
    const src=ctx.createBufferSource(),env=ctx.createGain();
    src.buffer=noise;
    env.gain.setValueAtTime(v,t);env.gain.exponentialRampToValueAtTime(.001,t+.004);
    src.connect(env);
    for(const [f,q,g] of [[185,22,9],[410,26,6],[860,30,3.2],[1580,26,1.6],[2900,16,.6]]){
      const bp=ctx.createBiquadFilter(),gg=ctx.createGain();
      bp.type='bandpass';bp.frequency.value=f*tune;bp.Q.value=q;gg.gain.value=g;
      env.connect(bp);bp.connect(gg);gg.connect(out);
    }
    const hp=ctx.createBiquadFilter(),cg=ctx.createGain();
    hp.type='highpass';hp.frequency.value=3200;cg.gain.value=.22;
    env.connect(hp);hp.connect(cg);cg.connect(out);
    const o=ctx.createOscillator(),og=ctx.createGain();
    o.frequency.setValueAtTime(140*tune,t);o.frequency.exponentialRampToValueAtTime(65,t+.05);
    og.gain.setValueAtTime(0,t);og.gain.linearRampToValueAtTime(v*.35,t+.002);og.gain.exponentialRampToValueAtTime(.001,t+.08);
    o.connect(og);og.connect(out);o.start(t);o.stop(t+.1);
    src.start(t,Math.random()*.5);src.stop(t+.012);
  }
  // zither-like pluck: triangle body plus a quieter octave that dies faster
  function pluck(f,t,dur,gain,dest){
    tone(f,t,dur,{type:'triangle',gain,dest});
    tone(f*2,t,dur*.45,{gain:gain*.4,dest});
  }
  const fx={
    deal(){burst(now,.03,{freq:4500,type:'highpass',gain:.07})},
    shuffle(){for(let i=0;i<10;i++)burst(now+i*.045,.05,{freq:3200,type:'highpass',gain:.09})},
    select(){tone(1150,now,.05,{type:'triangle',gain:.035})},
    play(){burst(now,.09,{freq:1700,q:.8,gain:.38});tone(170,now,.08,{gain:.16})},
    // two quick knocks on the table
    pass(){knock(now,.85,1);knock(now+.13,.7,1.03)},
    bomb(big){
      const f=burst(now,big?1.2:.75,{freq:1400,type:'lowpass',gain:.7});
      f.frequency.exponentialRampToValueAtTime(70,now+.6);
      const o=tone(120,now,big?1.1:.65,{gain:.5});o.frequency.exponentialRampToValueAtTime(36,now+.55);
      if(big)[0,.12,.24].forEach(d=>burst(now+d,.25,{freq:900,gain:.3}));
    },
    turn(){tone(988,now,.3,{gain:.05});tone(1319,now+.09,.4,{gain:.045})},
    tick(){tone(1500,now,.05,{type:'square',gain:.025})},
    // a long riffle: the brrrrr of two halves zipping together, a dense run of paper snaps that swells and fades
    riffleLong(){
      for(let i=0;i<44;i++){
        const t=now+i*.013+Math.random()*.004;
        burst(t,.014,{freq:2400+Math.random()*2200,q:1.4,type:'bandpass',gain:.16*(.45+.55*Math.sin(Math.PI*i/44))});
      }
    },
    // a single card flicked off the deck
    flick(){burst(now,.028,{freq:2800+Math.random()*1800,q:1.3,type:'bandpass',gain:.13});burst(now+.004,.012,{freq:6000,type:'highpass',gain:.05})},
    // a block of cards slapped down on the felt
    cardSlap(){burst(now,.07,{freq:1100,q:.7,gain:.42});tone(150,now,.08,{gain:.2,attack:.002});burst(now,.02,{freq:4200,type:'highpass',gain:.08})},
    // a fast riffle: a run of crisp little card snaps
    riffle(){for(let i=0;i<14;i++)burst(now+i*.028+Math.random()*.008,.022,{freq:3800+Math.random()*1500,type:'highpass',gain:.09})},
    // air moving as the cards sweep: band-passed noise gliding up
    whoosh(){const f=burst(now,.42,{freq:500,q:1.2,type:'bandpass',gain:.22});f.frequency.exponentialRampToValueAtTime(2600,now+.35)},
    error(){tone(150,now,.16,{type:'square',gain:.035})},
    win(){[587,659,740,880,988,1175].forEach((f,i)=>pluck(f,now+i*.09,1.1,.12,sfxBus))},
    lose(){[880,740,659,587,494].forEach((f,i)=>pluck(f,now+i*.14,1.1,.1,sfxBus))},
    // first out: a quick rising run that lands on a held major chord
    fanfare(){
      [523,659,784,1047].forEach((f,i)=>pluck(f,now+i*.08,.5,.13,sfxBus));
      for(const f of [523,659,784,1047])tone(f,now+.34,1.3,{type:'triangle',gain:.06,attack:.02});
      for(let i=0;i<6;i++)burst(now+.34+i*.07,.06,{freq:5200,type:'highpass',gain:.05});
    },
    // second / third out: a small two-note bell
    ding(){tone(1175,now,.6,{gain:.07});tone(1568,now+.1,.8,{gain:.05})},
    // last place: the sad trombone, wah wah wah wahhh
    sad(){
      const notes=[[392,.0,.32],[370,.36,.32],[349,.72,.32],[330,1.08,1.1]];
      for(const [f,d,len] of notes){
        const o=ctx.createOscillator(),lp=ctx.createBiquadFilter(),g=ctx.createGain(),t=now+d;
        o.type='sawtooth';o.frequency.setValueAtTime(f,t);
        lp.type='lowpass';lp.frequency.value=900;
        g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.09,t+.04);g.gain.setValueAtTime(.09,t+len-.08);g.gain.linearRampToValueAtTime(0,t+len);
        if(len>.5){const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=6;lg.gain.value=7;lfo.connect(lg);lg.connect(o.frequency);lfo.start(t+.2);lfo.stop(t+len)}
        o.connect(lp);lp.connect(g);g.connect(sfxBus);o.start(t);o.stop(t+len+.05);
      }
    }
  };
  function play(name,arg){
    if(!prefs.sfx||!ready())return;
    now=ctx.currentTime;fx[name](arg);
  }

  // background music: a slow D-major pentatonic tune over a four-bar bass line, generated on the fly
  const SCALE=[0,2,4,7,9],BASE=293.66,STEP=.32;
  const BASS=[73.42,61.74,49,55];
  const freqOf=deg=>BASE*Math.pow(2,(SCALE[((deg%5)+5)%5]+12*Math.floor(deg/5))/12);
  let next=0,step=0,pos=5;
  function scheduleMusic(){
    while(next<ctx.currentTime+.4){
      const bar=Math.floor(step/8)%4,beat=step%8,phrase=Math.floor(step/16)%4;
      if(beat===0){
        pluck(BASS[bar],next,STEP*7,.16,musicIn);
        tone(BASS[bar]*3,next,STEP*8,{gain:.022,attack:.6,dest:musicIn});
      }
      if(beat===4)pluck(BASS[bar]*1.5,next,STEP*3,.07,musicIn);
      const busy=phrase===3?.25:.55;
      if(Math.random()<(beat%2?busy*.6:busy+.15)){
        pos+=Math.floor(Math.random()*5)-2;
        if(pos<2)pos=3;if(pos>11)pos=9;
        pluck(freqOf(pos),next,STEP*(beat%2?2:4),beat===0?.085:.065,musicIn);
      }
      next+=STEP;step++;
    }
  }
  function startMusic(){
    if(!ctx||timer)return;
    next=ctx.currentTime+.1;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setTargetAtTime(.55,ctx.currentTime,.4);
    timer=setInterval(scheduleMusic,120);
    scheduleMusic();
  }
  function stopMusic(){
    if(!ctx||!timer)return;
    clearInterval(timer);timer=0;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setTargetAtTime(0,ctx.currentTime,.15);
  }
  function toggle(kind){
    prefs[kind]=!prefs[kind];save();
    unlock();
    if(kind==='music')prefs.music?startMusic():stopMusic();
    return prefs[kind];
  }
  return {unlock,play,toggle,prefs};
})();
function syncAudioBtns(){
  $('#sfxBtn').setAttribute('aria-pressed',Sound.prefs.sfx);
  $('#musicBtn').setAttribute('aria-pressed',Sound.prefs.music);
}

/* ---------- finishing celebrations ---------- */
function fxEl(cls,text,x,y){
  const e=document.createElement('div');
  e.className='fx '+cls;e.textContent=text;
  e.style.left=x+'px';e.style.top=y+'px';
  document.body.appendChild(e);
  e.addEventListener('animationend',()=>e.remove());
  setTimeout(()=>e.remove(),4000);
  return e;
}
// a throwaway full-screen canvas running one particle effect
function particles(spawn,step,ms){
  if(reduceMotion())return;
  const cv=document.createElement('canvas');
  cv.className='fx-canvas';cv.width=innerWidth;cv.height=innerHeight;
  document.body.appendChild(cv);
  const cx=cv.getContext('2d'),ps=[],t0=performance.now();
  const frame=t=>{
    const age=t-t0;
    spawn(ps,age);
    cx.clearRect(0,0,cv.width,cv.height);
    for(let i=ps.length-1;i>=0;i--){if(!step(cx,ps[i],age))ps.splice(i,1)}
    if(age<ms||ps.length)requestAnimationFrame(frame);else cv.remove();
  };
  requestAnimationFrame(frame);
}
function confetti(x,y){
  const css=getComputedStyle(document.documentElement);
  const cols=['--gold','--latest','--red','--card','--warn'].map(v=>css.getPropertyValue(v).trim());
  let fired=false;
  particles(ps=>{
    if(fired)return;fired=true;
    for(let i=0;i<160;i++){
      const a=-Math.PI/2+(Math.random()-.5)*2.2,v=6+Math.random()*9;
      ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:Math.random()*6,vr:(Math.random()-.5)*.4,w:5+Math.random()*6,h:3+Math.random()*5,c:cols[i%cols.length],life:1})
    }
  },(cx,p)=>{
    p.vy+=.25;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life-=.006;
    cx.save();cx.globalAlpha=Math.max(0,p.life);cx.translate(p.x,p.y);cx.rotate(p.r);
    cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2)));cx.restore();
    return p.life>0&&p.y<innerHeight+20;
  },400);
}
// a small grey cloud's worth of rain over the last-place seat
function rain(x,y){
  particles((ps,age)=>{
    if(age>1800)return;
    for(let i=0;i<3;i++)ps.push({x:x+(Math.random()-.5)*150,y:y-90+Math.random()*20,vy:5+Math.random()*3,len:8+Math.random()*8});
  },(cx,p)=>{
    p.y+=p.vy;
    cx.strokeStyle='rgba(176,196,206,.7)';cx.lineWidth=1.5;
    cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(p.x-1.5,p.y+p.len);cx.stroke();
    return p.y<y+40;
  },1800);
}
// where a player's place label sits: on the table side of their plate (yours at the foot of the table)
function placePoint(p){
  const R=q=>$(q).getBoundingClientRect();
  if(p===0){const m=R('#msg');return{x:m.left+m.width/2,y:m.top-20}}
  if(p===2){const a=R('#seat2 .who');return{x:a.left+a.width/2,y:a.bottom+28}}
  if(p===3){const a=R('#seat3 .whorow');return{x:a.right+48,y:a.top+a.height/2}}
  const a=R('#seat1 .whorow');return{x:a.left-48,y:a.top+a.height/2};
}
// quiet: the place label is already on screen, so no floating words, only sound and effects
function celebrate(p,place,quiet){
  const pt=seatPoint(p),seat=p===0?$('.meinfo'):$('#seat'+p+' .who');
  if(place===0){
    Sound.play('fanfare');
    const q=placePoint(p);
    fxEl('fx-tag first','头游',q.x,q.y);
    confetti(q.x,q.y);
  }else if(place<3){
    Sound.play('ding');
    const q=placePoint(p);
    if(!quiet)fxEl('fx-tag mid',PLACE[place],q.x,q.y);
  }else{
    Sound.play('sad');
    if(!quiet)fxEl('fx-stamp','末游',pt.x,pt.y);
    rain(pt.x,pt.y);
    if(seat&&!reduceMotion()){
      seat.classList.add('shake','gloom');
      setTimeout(()=>seat.classList.remove('shake','gloom'),2600);
    }
  }
}

/* ---------- overlays ---------- */
// dock: the round result sits low and see-through around the edges, so the last cards on the table stay in view
function showPanel(html,dock){$('#panel').innerHTML=html;$('#overlay').classList.toggle('dock',!!dock);$('#overlay').hidden=false}
function hideOverlay(){$('#overlay').hidden=true}
function showResult(){
  const r=G.result;
  const ours=r.team===0;
  const upText=['','单下，升 1 级','对手二人分列二、三游，升 2 级','双下对手，升 3 级'][r.up];
  let head,body;
  if(r.win){
    head=ours?'我方打过 A，赢下整场':'对方打过 A，本场告负';
    body=`<p class="muted">共打了 ${G.round} 局。</p>`;
  }else{
    head=ours?`我方升级：${rankName(r.before)} → ${rankName(r.after)}`:`对方升级：${rankName(r.before)} → ${rankName(r.after)}`;
    body=`<p>${upText}。下一局打 <b>${rankName(r.after)}</b>，${dblText(r)}</p>`;
    if(r.before===14&&r.after===14)body=`<p>${ours?'我方':'对方'}在 A 级，但队友是末游，没能打过 A。下一局继续打 A，${dblText(r)}</p>`;
  }
  showPanel(`<h2>${head}</h2>${body}
    <div class="btns">${r.win?'<button class="btn primary" id="againBtn">再来一场</button>':'<button class="btn primary" id="nextBtn">下一局</button>'}</div>`,true);
  const nb=$('#nextBtn');if(nb){nb.onclick=startRound;nb.focus()}
  const ab=$('#againBtn');if(ab){ab.onclick=newGame;ab.focus()}
}
function dblText(r){
  const o=r.order;
  return o[1]%2===o[0]%2?`${NAMES[o[2]]}和${NAMES[o[3]]}双下，两人都要进贡。`:`末游${NAMES[o[3]]}要向头游进贡。`;
}
function showRules(){
  showPanel(`<h2>掼蛋规则速览</h2>
  <ul>
    <li>四人两队，你和对家一队。两副牌共 108 张，每人 27 张，轮流按逆时针出牌。</li>
    <li>牌的大小：大王（红色 JOKER）&gt; 小王（黑色 JOKER）&gt; 级牌 &gt; A &gt; K … &gt; 2。本局打几，几就是级牌。</li>
    <li>红心级牌是百搭（标“配”），可以当除大小王外的任意牌用。</li>
    <li>牌型：单张、对子、三张、三带二、顺子（5 张）、连对（3 对）、钢板（2 个连续三张）。顺子里 A 可作 1，不能带王。</li>
    <li>炸弹从小到大：4 张 &lt; 5 张 &lt; 同花顺 &lt; 6 张 &lt; 7 张 … &lt; 四个王（天王炸）。炸弹可以压任何非炸弹牌型。</li>
    <li>头游一方升级：队友二游升 3 级，三游升 2 级，末游升 1 级。打到 A 并且队友不是末游，赢下整场。</li>
    <li>从第二局起进贡：末游把最大的牌给头游，头游还一张 10 或以下的牌；双下则两人都进贡。进贡方合计有两张大王可以抗贡。</li>
    <li>出完牌后若其他人都不要，由队友接风出牌。</li>
    <li>“手持”模式下手牌像握在手里一样分两排或三排展开成弧形（按钮上写的是点一下会变成的排数）。平铺模式也可以在一排、两排、三排之间切换，同样大小的牌不会被分到两排，按住一张牌拖动可以把它插到别处；先选中几张再拖，可以整组一起挪。平铺模式也一样。轮到你出牌时，按住滑过几张牌是连选这些牌；其他时候按住拖动才是挪牌。“理牌”按大小重新排好。</li>
    <li>每局开始先洗牌、切牌：上一局头游的上家洗牌，头游切牌（第一局随机）。轮到你时点“洗牌”或“切牌”。</li>
    <li>发完牌有 60 秒理牌时间。每次出牌限时 20 秒，最后 5 秒倒计时会闪烁，超时由电脑代你出牌。</li>
  </ul>
  <p class="muted">点选牌，双击任意一张牌直接出牌，“提示”会依次给出能出的牌。</p>
  <div class="btns"><button class="btn primary" id="closeBtn">知道了</button></div>`);
  $('#closeBtn').onclick=()=>{hideOverlay();if(G.phase==='roundEnd'||G.phase==='over')showResult()};
  $('#closeBtn').focus();
}
function askNew(){
  showPanel(`<h2>重新开始一场？</h2><p class="muted">当前的级数和这一局的牌都会清空。</p>
  <div class="btns"><button class="btn" id="noBtn">继续这局</button><button class="btn primary" id="yesBtn">重新开始</button></div>`);
  $('#noBtn').onclick=()=>{hideOverlay();if(G.phase==='roundEnd'||G.phase==='over')showResult()};
  $('#yesBtn').onclick=newGame;
  $('#yesBtn').focus();
}

/* ---------- input ---------- */
const handEl=$('#hand');
let lastDown=null,mv=null,sweep=null;
const cardEl=id=>handEl.querySelector(`.card[data-id="${id}"]`);
function setSel(id,on,lazy){
  if(on)sel.add(id);else sel.delete(id);
  // a card being put back down waits out the double-tap window, so a double tap never dips it first
  const show=()=>{const el=handEl.querySelector(`.card[data-id="${id}"]`);if(el)el.classList.toggle('sel',sel.has(id))};
  if(lazy&&!on)setTimeout(show,360);else show();
  renderControls();
}
handEl.addEventListener('pointerdown',e=>{
  if(G.phase!=='play'&&G.phase!=='return'&&G.phase!=='prep')return;
  const el=e.target.closest('.card');if(!el)return;
  e.preventDefault();
  const id=+el.dataset.id,t=performance.now();
  if(lastDown&&lastDown.id===id&&t-lastDown.t<350){
    // double tap: undo the first tap's toggle, keep this card in the selection, then play it
    sel=new Set(lastDown.prev);sel.add(id);
    lastDown=null;
    renderHand();
    if(G.phase==='return')onReturn();else if(G.phase==='play')onPlay();
    return;
  }
  lastDown={id,t,prev:[...sel]};
  // nothing happens until we know what the press is: a tap selects, a drag moves cards
  mv={id,x0:e.clientX,y0:e.clientY,t0:t,active:false};
  try{handEl.setPointerCapture(e.pointerId)}catch(_){}
});
handEl.addEventListener('pointermove',e=>{
  // on your own turn a press-and-sweep selects the cards it passes over; at any other time it moves cards
  if(mv&&!mv.active&&G.phase==='play'&&G.turn===0){
    if(Math.hypot(e.clientX-mv.x0,e.clientY-mv.y0)<6)return;
    const id=mv.id,on=!sel.has(id);
    mv=null;lastDown=null;
    sweep={on,seen:new Set([id]),last:[...handEl.children].findIndex(c=>+c.dataset.id===id)};
    setSel(id,on);
    Sound.play('select');
  }
  if(mv){moveCards(e);return}
  if(!sweep)return;
  const t=document.elementFromPoint(e.clientX,e.clientY);
  const el=t&&t.closest('#hand .card');if(!el)return;
  // a fast sweep can skip cards between two pointer events, so fill in everything between the last card and this one
  const kids=[...handEl.children],i=kids.indexOf(el);
  if(i<0||i===sweep.last)return;
  const step=i>sweep.last?1:-1;
  for(let j=sweep.last+step;;j+=step){
    const id=+kids[j].dataset.id;
    if(!sweep.seen.has(id)){sweep.seen.add(id);setSel(id,sweep.on)}
    if(j===i)break;
  }
  sweep.last=i;
});
handEl.addEventListener('pointerup',()=>{if(mv)dropCards();sweep=null});
handEl.addEventListener('pointercancel',()=>{if(mv){mv.cancel=true;dropCards()}sweep=null});

// picking up a selected card carries the whole selection with it, so a combination can be moved as one block
function moveCards(e){
  if(!mv.active){
    if(Math.hypot(e.clientX-mv.x0,e.clientY-mv.y0)<6)return;
    const ord=[...handEl.children].map(c=>+c.dataset.id);
    mv.ids=sel.has(mv.id)&&sel.size>1?ord.filter(i=>sel.has(i)):[mv.id];
    mv.grab=mv.ids.indexOf(mv.id);
    mv.others=ord.filter(i=>!mv.ids.includes(i));
    mv.order=ord;
    mv.g=handGeo(ord.length,handKeys(ord));
    const L=handEl.getBoundingClientRect(),el=cardEl(mv.id);
    mv.dx=mv.x0-L.left-parseFloat(el.style.left);
    mv.dy=mv.y0-L.top-parseFloat(el.style.top);
    mv.ids.forEach((id,j)=>{const c=cardEl(id);c.classList.add('drag');c.style.zIndex=1000+j});
    mv.active=true;lastDown=null;
  }
  const L=handEl.getBoundingClientRect(),g=mv.g,k=mv.ids.length;
  const x=e.clientX-L.left-mv.dx,y=e.clientY-L.top-mv.dy;
  mv.ids.forEach((id,j)=>{const c=cardEl(id);c.style.left=x+(j-mv.grab)*g.cw*.36+'px';c.style.top=y+'px'});
  const cx=x+g.cw/2,cy=y+g.ch/2;
  let s=0,best=Infinity;
  g.slots.forEach((sl,i)=>{const d=(sl.x+g.cw/2-cx)**2+((sl.y+g.ch/2-cy)*1.6)**2;if(d<best){best=d;s=i}});
  const t=Math.max(0,Math.min(g.slots.length-k,s-mv.grab));
  if(t===mv.t)return;
  mv.t=t;
  mv.order=[...mv.others.slice(0,t),...mv.ids,...mv.others.slice(t)];
  mv.order.forEach((id,i)=>{if(!mv.ids.includes(id))placeCard(cardEl(id),g.slots[i],i)});
  Sound.play('deal');
}
function dropCards(){
  const m=mv;mv=null;
  if(!m.active){
    if(!m.cancel){setSel(m.id,!sel.has(m.id),true);Sound.play('select')}
    return;
  }
  if(!m.cancel){
    G.myOrder=m.order;
    if(m.ids.length>1){
      const tidy=tidyGroup(m.ids),at=G.myOrder.indexOf(m.ids[0]);
      const rest=G.myOrder.filter(id=>!m.ids.includes(id));
      G.myOrder=[...rest.slice(0,at),...tidy,...rest.slice(at)];
      G.blocks=(G.blocks||[]).filter(b=>!b.some(id=>m.ids.includes(id)));
      G.blocks.push(tidy);
    }
  }
  for(const id of m.ids)sel.delete(id);
  if(m.dirty)renderHand();
  else{
    for(const id of G.myOrder){const c=cardEl(id);if(c){c.classList.remove('drag');c.classList.toggle('sel',sel.has(id));handEl.appendChild(c)}}
    layoutHand();
    renderControls();
  }
  Sound.play('play');
}
$('#playBtn').onclick=onPlay;
$('#passBtn').onclick=onPass;
$('#hintBtn').onclick=onHint;
$('#returnBtn').onclick=onReturn;
const ROW_NAME={1:'一排',2:'两排',3:'三排'};
// what a click on the rows button switches to: held hands toggle 3/2 rows, flat hands cycle 1 -> 2 -> 3
// (a single flat row that would be too cramped to read is skipped)
const nextRows=()=>fanMode()?(handRows===3?2:3):flatShown===3?(flatOneFits?1:2):flatShown+1;
function syncHandBtns(){
  $('#fanBtn').setAttribute('aria-pressed',fanMode());
  // the button names what a click switches to
  $('#rowsBtn').textContent=ROW_NAME[nextRows()];
  $('#rowsBtn').title=`改成${ROW_NAME[nextRows()]}`;
}
$('#fanBtn').onclick=()=>{
  handView=fanMode()?'flat':'fan';
  try{localStorage.setItem('guandan-view',handView)}catch(_){}
  syncHandBtns();
  layoutHand();
};
$('#rowsBtn').onclick=()=>{
  if(fanMode())handRows=nextRows();else flatRows=nextRows();
  try{localStorage.setItem('guandan-rows',handRows);localStorage.setItem('guandan-flatrows',flatRows)}catch(_){}
  syncHandBtns();
  layoutHand();
};
syncHandBtns();
$('#sortBtn').onclick=()=>{G.myOrder=[];G.blocks=[];renderHand();Sound.play('shuffle')};
$('#clearBtn').onclick=()=>{sel=new Set();renderHand()};
$('#rulesBtn').onclick=showRules;
$('#readyBtn').onclick=beginPlay;
$('#deckBtn').onclick=()=>{G.phase==='shuffle'?doShuffle():doCut()};
$('#sfxBtn').onclick=()=>{Sound.toggle('sfx');syncAudioBtns()};
$('#musicBtn').onclick=()=>{Sound.toggle('music');syncAudioBtns()};
syncAudioBtns();
// browsers only allow audio after the first tap or key press
document.addEventListener('pointerdown',()=>Sound.unlock(),{capture:true});
document.addEventListener('keydown',()=>Sound.unlock(),{capture:true});
$('#newBtn').onclick=askNew;
$('#table').addEventListener('click',e=>{if(e.target.closest('.who,.btn'))return;if(sel.size){sel=new Set();renderHand()}});
document.addEventListener('keydown',e=>{
  if(!$('#overlay').hidden||!$('#lobby').hidden||e.target.closest('input'))return;
  if(e.key==='Enter'){e.preventDefault();G.phase==='return'?onReturn():passIsDefault()?onPass():onPlay()}
  else if(e.key===' '){e.preventDefault();onPass()}
  else if(e.key==='h'||e.key==='H')onHint();
});
let resizeT=0;
window.addEventListener('resize',()=>{layoutHand();clearTimeout(resizeT);resizeT=setTimeout(pileRebuild,150)});
// the page can be laid out before it is shown (zero width); lay the hand out again once it gets its real width
let handW=0;
if(window.ResizeObserver)new ResizeObserver(()=>{const w=handEl.clientWidth;if(w&&w!==handW){handW=w;layoutHand()}}).observe(handEl);

/* ---------- boot (keeps the game across live page updates) ---------- */
function boot(data){
  if(data&&data.G&&data.G.hands&&data.G.phase!=='start'){
    G=data.G;G.tok++;sel=new Set();
    G.trickPlays=G.trickPlays||[];G.heapN=G.heapN||0;
    if(G.phase==='play'&&G.turn===-1){
      G.heapN+=G.trickPlays.reduce((s,t)=>s+t.play.cards.length,0);G.trickPlays=[];
      G.trick=null;G.passes=0;G.last=[null,null,null,null];G.turn=G.nextLeader??G.leader??0;
    }
    pileRebuild();
    if(G.phase==='shuffle'||G.phase==='cut'){G.busy=false;beginDeal();return}
    if(G.phase==='deal'){finishDeal();return}
    if(G.phase==='tribute'){runGives();return}
    if(G.phase==='play'){
      startTurn();
    }else{if(G.phase==='roundEnd'||G.phase==='over')G.reveal=4;render();if(G.phase==='roundEnd'||G.phase==='over')showResult()}
  }else showStart();
}
// browsers only let a page make sound after a click, so the first game starts from a button:
// that click switches the sound on and the very first shuffle is heard
// the lobby: type a nickname, pick a seat at the table (the computer takes the other three), sit down.
// Sitting down is the first click, which is also what lets the browser play sound from the very first shuffle.
let myNick='',mySeat='';
try{myNick=localStorage.getItem('guandan-nick')||''}catch(_){}
function showStart(){
  G={levels:[2,2],lvlTeam:0,L:2,round:0,hands:[[],[],[],[]],last:[null,null,null,null],out:[],phase:'start',turn:-1,tok:0,trickPlays:[],heapN:0};
  render();
  $('#nick').value=myNick;
  mySeat='';
  renderLobby();
  $('#lobby').hidden=false;
  if(!myNick)$('#nick').focus();
}
function renderLobby(){
  const nick=$('#nick').value.trim();
  for(const b of document.querySelectorAll('.seat-btn')){
    const me=b.dataset.seat===mySeat;
    b.classList.toggle('mine',me);
    b.classList.toggle('bot',!!mySeat&&!me);
    b.querySelector('span').textContent=me?(nick||'你'):mySeat?'电脑':'空位';
  }
  $('#sitBtn').disabled=!nick||!mySeat;
}
$('#nick').addEventListener('input',renderLobby);
$('#nick').addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('#sitBtn').disabled)$('#sitBtn').click()});
document.querySelectorAll('.seat-btn').forEach(b=>b.addEventListener('click',()=>{mySeat=b.dataset.seat;renderLobby();Sound.unlock();Sound.play('select')}));
$('#sitBtn').onclick=()=>{
  myNick=$('#nick').value.trim().slice(0,8);
  if(!myNick||!mySeat)return;
  try{localStorage.setItem('guandan-nick',myNick)}catch(_){}
  $('#myName').textContent=myNick;
  Sound.unlock();
  $('#lobby').hidden=true;
  newGame();
};
if(myNick)$('#myName').textContent=myNick;
window.claude?.hot?.snapshot?.(()=>({G}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
