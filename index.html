<!doctype html>
<html lang="zh-CN">
<head>
<style>html,body{margin:0}[hidden]{display:none!important}</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>掼蛋</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
/* Layout: one-screen felt table. Partner on top, opponents left and right, your hand along the bottom edge. */
:root{
  --felt:#1c4a3b;
  --felt-deep:#133629;
  --line:rgba(236,232,218,.14);
  --line-strong:rgba(236,232,218,.32);
  --ink:#ece8da;
  --muted:#9fbcae;
  --card:#fbf8f0;
  --card-edge:#d6cfbf;
  --card-ink:#1d2421;
  --red:#c2313a;
  --gold:#ddb050;
  --wild-face:#fff3cf;
  --wild-face-b:#f1d27e;
  --wild-ink:#8a5a00;
  --latest:#36c9ff;
  --latest-glow:rgba(54,201,255,.55);
  --on-gold:#1d2421;
  --warn:#f08a7a;
  --back-a:#7b2b30;
  --back-b:#933a3f;
  --shade:rgba(0,0,0,.2);
  --scrim:rgba(8,22,17,.72);
  --font-display:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --font-ui:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{font-size:17px}
body{background:radial-gradient(ellipse at 50% 40%,var(--felt) 0%,var(--felt-deep) 100%) fixed,var(--felt-deep);color:var(--ink);font-family:var(--font-ui);overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
#app{height:100%;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}

/* header */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:16px;color:var(--muted)}
.brand{font-family:var(--font-display);font-weight:900;font-size:26px;color:var(--ink);letter-spacing:.08em}
.score{display:flex;gap:14px;font-variant-numeric:tabular-nums}
.score b{font-family:var(--font-display);color:var(--ink);font-size:21px;margin-left:4px}
.score .ours b{color:var(--gold)}
/* the side whose level this round is played at gets a frame */
.score>span{padding:3px 10px;border:1.5px solid transparent;border-radius:8px}
.score>span.playing{border-color:var(--gold);color:var(--ink);background:var(--shade)}
.bar .acts{display:flex;gap:6px}
.link{font:inherit;font-size:16px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer}
.link:hover{color:var(--ink);border-color:var(--line-strong)}
.tog{display:inline-flex;align-items:center;gap:6px}
.tog::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold)}
.tog[aria-pressed="false"]{opacity:.55}
.tog[aria-pressed="false"]::before{background:transparent;box-shadow:inset 0 0 0 1px var(--muted)}

/* the deck: shuffled and cut in the middle of the table before every deal */
.stack{position:absolute;left:0;top:0;width:var(--cw);height:calc(var(--cw)*1.4);margin:calc(var(--cw)*-.7) 0 0 calc(var(--cw)*-.5);
  transition:transform .32s cubic-bezier(.3,.7,.3,1);pointer-events:none;z-index:7000}
.stack .sb,.flick{position:absolute;inset:0;border-radius:calc(var(--cw)*.1);border:2px solid var(--card);
  background:repeating-linear-gradient(45deg,var(--back-a) 0 3px,var(--back-b) 3px 6px);box-shadow:0 1px 2px rgba(0,0,0,.4)}
.flick{left:0;top:0;width:var(--cw);height:calc(var(--cw)*1.4);margin:calc(var(--cw)*-.7) 0 0 calc(var(--cw)*-.5);inset:auto;z-index:7100;transition:transform .16s linear,opacity .16s}
#seat0 #deckBtn{pointer-events:auto;padding:10px 30px;font-size:19px;animation:btnCall 1.2s ease-in-out infinite}
/* the shuffle / cut button calls for a click with a soft pulse, so it never reads as a mere label */
@keyframes btnCall{50%{box-shadow:0 0 0 6px rgba(221,176,80,.25),0 0 22px var(--gold)}}
/* dealing */
.flyer{position:fixed;left:0;top:0;width:28px;height:40px;margin:-20px 0 0 -14px;border-radius:4px;border:2px solid var(--card);
  background:repeating-linear-gradient(45deg,var(--back-a) 0 3px,var(--back-b) 3px 6px);box-shadow:0 2px 5px rgba(0,0,0,.4);
  z-index:15;pointer-events:none;transition:transform .24s cubic-bezier(.2,.7,.3,1),opacity .24s ease-in}
.gift{position:fixed;left:0;top:0;z-index:16;pointer-events:none;width:0;height:0;transition:transform .6s cubic-bezier(.3,.7,.3,1),opacity .25s}
.gift .card{--cw:70px;position:absolute;left:-35px;top:-49px;box-shadow:0 0 0 3px var(--gold),0 8px 24px rgba(0,0,0,.5)}
.gift .gl{position:absolute;left:50%;top:-80px;transform:translateX(-50%);white-space:nowrap;font-size:16px;font-weight:700;color:var(--on-gold);background:var(--gold);border-radius:999px;padding:3px 12px}

/* table */
.table{flex:1;min-height:0;display:grid;gap:8px;
  grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"top top top" "left mid right" "me me me"}
.seat{display:flex;flex-direction:column;gap:8px;min-width:0}
#seat2{grid-area:top;align-items:center}
#seat3{grid-area:left;align-items:flex-start;justify-content:center}
#seat1{grid-area:right;align-items:flex-end;justify-content:center}
.table{--mid-drop:clamp(16px,5vh,44px)}
#seat3,#seat1,.mid{transform:translateY(var(--mid-drop))}
#seat0{grid-area:me;align-items:center;justify-content:flex-end;gap:4px;text-align:center;pointer-events:none}
#seat0 .btn{pointer-events:auto}
.table{position:relative}
.seat{position:relative;z-index:2}
/* the table's cards are the ones everyone needs to read, so they get the larger size; your hand is a little smaller */
#pile{position:absolute;inset:0;z-index:1;pointer-events:none;--cw:clamp(54px,7.2vw,90px)}
#pile .probe{position:absolute;visibility:hidden;width:var(--cw)}
.pc{position:absolute;left:0;top:0;width:var(--cw);height:calc(var(--cw)*1.4);margin:calc(var(--cw)*-.7) 0 0 calc(var(--cw)*-.5);
  transform-style:preserve-3d;transition:transform .5s cubic-bezier(.25,.75,.3,1)}
.pc .card,.pc .bk{position:absolute;left:0;top:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.pc .bk{width:100%;height:100%;border-radius:calc(var(--cw)*.1);border:2px solid var(--card);transform:rotateY(180deg);
  background:repeating-linear-gradient(45deg,var(--back-a) 0 3px,var(--back-b) 3px 6px);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.pc.old .card{filter:brightness(.72)}
.pc.cur .card{box-shadow:0 0 0 2.5px var(--latest),0 0 16px 3px var(--latest-glow),0 6px 18px rgba(0,0,0,.45)}
.ktag{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;animation:drop .25s ease-out}
.pass-chip{font-size:16px;color:var(--ink);background:var(--felt-deep);border:1px solid var(--line-strong);border-radius:999px;padding:1px 9px 1px 12px;letter-spacing:.2em;animation:drop .25s ease-out}
.pass-chip:empty{display:none}
.ktag{font-size:14px;color:var(--ink);background:var(--shade);border-radius:999px;padding:1px 8px;letter-spacing:.08em}
.ktag.boom{color:var(--on-gold);background:var(--gold);font-weight:600}
.mid{grid-area:mid;z-index:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-width:0;text-align:center}

.who{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 6px;border-radius:10px;background:var(--shade);border:1px solid var(--line);font-size:17px;white-space:nowrap;transition:border-color .2s,box-shadow .2s}
.who .back{width:20px;height:28px;border-radius:3px;border:2px solid var(--card);background:repeating-linear-gradient(45deg,var(--back-a) 0 3px,var(--back-b) 3px 6px);flex:none}
.who .name{color:var(--ink)}
/* the count sits beside the name plate, never inside it */
.whorow{display:flex;align-items:center;gap:12px}
/* card counts stay hidden until a player is down to 10 or fewer, then they shout */
.cnt{display:inline-flex;align-items:baseline;gap:2px;font-family:var(--font-display);font-weight:900;font-size:26px;line-height:1;
  font-variant-numeric:tabular-nums;color:var(--felt-deep);background:var(--warn);border-radius:8px;padding:3px 7px 2px;animation:pop .35s ease-out}
.cnt small{font-family:var(--font-ui);font-size:13px;font-weight:700}
.cnt:empty{display:none}
@keyframes pop{0%{transform:scale(1.6)}100%{transform:scale(1)}}
/* the finishing place: a large label on the table side of each plate, so the four sit symmetrically around the table */
.who,.meinfo{position:relative}
.place{position:absolute;z-index:3;white-space:nowrap;font-family:var(--font-display);font-weight:900;font-size:26px;line-height:1;letter-spacing:.08em;
  padding:6px 12px 6px 14px;border-radius:10px;background:var(--gold);color:var(--on-gold);box-shadow:0 4px 14px rgba(0,0,0,.35)}
#seat2 .place{top:100%;left:50%;transform:translateX(-50%);margin-top:10px}
/* yours stands at the foot of the table, centred, answering your partner's at its head */
#myPlace{position:static;margin-bottom:4px}
#seat3 .place{left:100%;top:50%;transform:translateY(-50%);margin-left:12px}
#seat1 .place{right:100%;top:50%;transform:translateY(-50%);margin-right:12px}
/* gold for first, quiet for second and third, red for last; each one drops in as it is called out */
.place:not(:empty){animation:placeIn .45s cubic-bezier(.2,.9,.3,1.3)}
/* last place is slammed down like a stamp */
.place[data-place="3"]:not(:empty){animation:stampIn .5s cubic-bezier(.3,1.4,.5,1)}
@keyframes stampIn{0%{opacity:0;scale:2.6;rotate:-18deg}60%{opacity:1;scale:.92;rotate:-6deg}100%{scale:1;rotate:0deg}}
@keyframes placeIn{from{opacity:0;scale:.4}to{opacity:1;scale:1}}
.place[data-place="1"],.place[data-place="2"]{background:var(--felt-deep);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.place[data-place="3"]{background:var(--warn);color:var(--felt-deep)}
.place:empty{display:none}
.seat.turn .who,.mebar.turn .meinfo{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
/* the turn clock is a little alarm clock: a round face with the seconds in it, two bells on top and two feet */
.clock{position:relative;flex:none;display:inline-flex;align-items:center;justify-content:center;width:2.3em;height:2.3em;margin:.35em .1em .2em;
  border-radius:50%;background:var(--card);border:.16em solid var(--gold);box-shadow:inset 0 0 0 .1em var(--card-edge),0 2px 5px rgba(0,0,0,.35);
  color:var(--card-ink);font-family:var(--font-display);font-weight:900;font-variant-numeric:tabular-nums;font-size:16px;line-height:1}
.clock:empty{display:none}
.clock::before,.clock::after{content:"";position:absolute;top:-.42em;width:.78em;height:.5em;border-radius:.5em .5em .12em .12em;background:var(--gold)}
.clock::before{left:-.12em;transform:rotate(-32deg)}
.clock::after{right:-.12em;transform:rotate(32deg)}
.clock b::before,.clock b::after{content:"";position:absolute;bottom:-.3em;width:.16em;height:.42em;border-radius:.1em;background:var(--gold)}
.clock b::before{left:.42em;transform:rotate(30deg)}
.clock b::after{right:.42em;transform:rotate(-30deg)}
#myClock{font-size:19px}
/* the last five seconds: the clock turns red and rings */
.clock.hurry{border-color:var(--warn);color:var(--red);animation:ring .5s ease-in-out infinite}
.clock.hurry::before,.clock.hurry::after,.clock.hurry b::before,.clock.hurry b::after{background:var(--warn)}
@keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(-14deg)}35%{transform:rotate(12deg)}55%{transform:rotate(-9deg)}75%{transform:rotate(6deg)}}
@keyframes blink{50%{opacity:.2}}
.prep{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px 10px}
.prep .pn{font-family:var(--font-display);font-weight:900;font-size:38px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums;min-width:1.3em}
.prep .pn.hurry{color:var(--warn);animation:blink .5s steps(1) infinite}
.prep .pt{font-size:17px;color:var(--ink)}
.prep .btn{padding:7px 18px;font-size:17px}
@keyframes pulse{50%{opacity:.25}}

.played{--cw:clamp(32px,4.2vw,48px);display:flex;flex-direction:column;gap:3px;min-height:calc(var(--cw)*1.4 + 16px);justify-content:center}
#seat3 .played{align-items:flex-start}
#seat1 .played{align-items:flex-end}
#seat2 .played,#seat0 .played{align-items:center}
.played .cards{display:flex;flex-wrap:wrap;row-gap:4px;padding-left:calc(var(--cw)*.58);max-width:100%}
#seat1 .played .cards{justify-content:flex-end}
#seat2 .played .cards,#seat0 .played .cards{justify-content:center}
.played .card{position:relative;margin-left:calc(var(--cw)*-.58);animation:drop .22s ease-out}
.played .kind{font-size:11px;color:var(--muted);letter-spacing:.08em}
.played .kind.boom{color:var(--gold);font-weight:600}
.pass{font-size:14px;color:var(--muted);letter-spacing:.2em;padding:4px 0}
@keyframes drop{from{transform:translateY(-8px);opacity:0}}

.emblem{width:86px;height:86px;border-radius:50%;border:1px solid var(--line-strong);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;gap:2px;background:var(--shade)}
.emblem .r{font-family:var(--font-display);font-weight:900;font-size:46px;color:var(--gold)}
.msg{font-size:17px;color:var(--ink);min-height:2.6em;max-width:28em;line-height:1.35;text-wrap:balance}
.msg.err{color:var(--warn)}
.msg small{display:block;color:var(--muted);font-size:15px}

/* controls */
.mebar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
/* on a computer the play buttons stand in a column just to the right of the cards, so the mouse barely travels */
.handwrap{position:relative;flex:none}
@media (min-width:561px){
  #btns{position:absolute;left:0;top:0;z-index:1;flex-direction:column;flex-wrap:nowrap;gap:8px}
  #btns .btn{min-width:86px}
}
.meinfo{display:flex;align-items:center;gap:8px;font-size:17px;padding:5px 10px;border-radius:10px;background:var(--shade);border:1px solid var(--line)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:18px;padding:9px 22px;border-radius:999px;border:1px solid var(--line-strong);background:transparent;color:var(--ink);cursor:pointer;transition:background .15s}
.btn:hover:not(:disabled){background:var(--shade)}
.btn.primary{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:600}
.btn.primary:hover:not(:disabled){background:var(--gold);filter:brightness(1.07)}
.btn:disabled{opacity:.32;cursor:default}
.btn:focus-visible,.link:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* hand */
/* z-index:0 keeps the cards' own stacking order inside the hand, below panels and flying cards */
#hand{--cw:clamp(48px,min(7.6vw,12.5vh),86px);position:relative;z-index:0;flex:none;touch-action:none;user-select:none;-webkit-user-select:none;min-height:calc(var(--cw)*1.4 + 20px)}
#hand .card{position:absolute;cursor:pointer;transition:transform .12s ease,left .2s ease,top .2s ease;
  transform:rotate(var(--rot,0deg));transform-origin:50% 50%}
#hand.fan{--cw:clamp(44px,min(6.4vw,10.5vh),74px)}
#hand .card.sel{transform:rotate(var(--rot,0deg)) translateY(-20%)}
#hand.fan .card{cursor:grab}
#hand .card.drag{transition:none;transform:translateY(-6px) scale(1.06);box-shadow:0 12px 26px rgba(0,0,0,.5);cursor:grabbing}
.mebar .left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.handtools{display:flex;gap:6px}
#hand .card.fresh{box-shadow:0 0 0 2px var(--gold),0 2px 4px rgba(0,0,0,.4)}

/* card face */
.card{width:var(--cw);height:calc(var(--cw)*1.4);background:var(--card);border:1px solid var(--card-edge);border-radius:calc(var(--cw)*.1);
  box-shadow:0 1px 3px rgba(0,0,0,.35);color:var(--card-ink);font-family:var(--font-display);font-weight:600;flex:none;overflow:hidden}
.card.red{color:var(--red)}
.card .idx{position:absolute;left:calc(var(--cw)*.05);top:calc(var(--cw)*.06);width:calc(var(--cw)*.36);display:flex;flex-direction:column;align-items:center;line-height:1;font-size:calc(var(--cw)*.34)}
.card .idx .rk.ten{letter-spacing:-.08em;font-size:.9em}
.card .idx .su{font-size:.82em;margin-top:.08em}
.card .pip{position:absolute;right:10%;bottom:7%;font-size:calc(var(--cw)*.52);line-height:1}
/* jokers carry the usual vertical JOKER index: the big joker in red, the small one in black */
.card.joker .idx{font-family:var(--font-ui);font-weight:800;font-size:calc(var(--cw)*.19);line-height:1.02;gap:0;letter-spacing:0}
.card.joker .pip{font-size:calc(var(--cw)*.46)}
/* wild cards (red hearts of the level rank): a gold face, a heavy gold frame, a big 配 under the index and a star in the corner */
.card .tag{margin-top:.2em;font-size:.95em;line-height:1;background:var(--wild-ink);color:var(--wild-face);border-radius:.18em;padding:.1em .12em;font-family:var(--font-display);font-weight:900}
.card.wild{background:linear-gradient(160deg,var(--wild-face) 0%,var(--wild-face-b) 100%);border:2px solid var(--gold);
  box-shadow:0 0 0 2px var(--wild-ink),0 0 12px 2px var(--gold),0 1px 3px rgba(0,0,0,.35)}
.card.wild::after{content:"★";position:absolute;right:6%;top:4%;font-size:calc(var(--cw)*.24);line-height:1;color:var(--wild-ink)}

/* overlay */
.overlay{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:100;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.panel{background:var(--felt-deep);border:1px solid var(--line-strong);border-radius:14px;padding:22px 24px;width:min(440px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font-family:var(--font-display);font-weight:900;font-size:27px;text-wrap:balance}
.panel p,.panel li{font-size:17px;line-height:1.6;color:var(--ink);margin:0}
.panel ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.panel .muted{color:var(--muted)}
/* bottom-right, clear of the table centre and of your own plate at bottom-left */
.overlay.dock{background:transparent;align-items:flex-end;justify-content:flex-end;pointer-events:none}
.overlay.dock .panel{pointer-events:auto;width:min(440px,calc(50vw - 72px));gap:10px;padding:16px 20px;box-shadow:0 -8px 32px rgba(0,0,0,.5)}
.overlay.dock .panel h2{font-size:23px}
.places{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.places span{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 4px;border-radius:8px;background:var(--shade);border:1px solid var(--line);font-size:14px}
.places b{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.1em}
.places small{font-size:11px;color:var(--muted)}
.places .ours{border-color:var(--gold)}
.places .ours small{color:var(--gold)}
.panel .btns{justify-content:flex-end}
/* the lobby: a nickname, then a seat at a square table */
.lobby{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;overflow:auto;
  background:radial-gradient(ellipse at 50% 40%,var(--felt) 0%,var(--felt-deep) 100%);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.lobby-box{width:min(440px,100%);display:flex;flex-direction:column;align-items:stretch;gap:14px;text-align:center}
.lobby-title{margin:0 0 6px;font-family:var(--font-display);font-weight:900;font-size:52px;letter-spacing:.24em;padding-left:.24em;color:var(--ink)}
.lobby-label{font-size:18px;color:var(--muted);text-align:left}
.lobby-nick{font:inherit;font-size:24px;padding:12px 16px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--felt-deep);color:var(--ink);text-align:center}
.lobby-nick:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(221,176,80,.25)}
.lobby-table{display:grid;grid-template-columns:1fr 1.3fr 1fr;grid-template-rows:auto minmax(120px,22vh) auto;gap:10px;
  grid-template-areas:". n ." "w c e" ". s .";margin:6px 0}
.lobby-felt{border-radius:14px;background:var(--felt);border:2px solid var(--line-strong);box-shadow:inset 0 0 30px rgba(0,0,0,.35)}
.seat-btn{font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px 6px;border-radius:14px;cursor:pointer;
  background:var(--shade);color:var(--ink);border:2px dashed var(--line-strong);min-height:84px;align-self:center}
.seat-btn b{font-family:var(--font-display);font-size:24px;color:var(--gold)}

.seat-btn:hover:not(:disabled){border-color:var(--gold)}

.seat-btn.mine b,.seat-btn.mine span{color:var(--on-gold)}

@media (max-width:560px){
  .overlay.dock .panel{width:100%}

}
/* finishing moments: first place gets a gold badge and confetti, second and third a small badge,
   last place a stamp, a shudder, a grey-out and a little rain */
.fx{position:fixed;left:0;top:0;z-index:90;pointer-events:none;transform:translate(-50%,-50%);white-space:nowrap}
.fx-tag{font-family:var(--font-display);font-weight:900;border-radius:999px;padding:4px 16px}
.fx-tag.first{font-size:30px;background:var(--gold);color:var(--on-gold);box-shadow:0 0 22px var(--gold);animation:fxPop 2.4s ease-out forwards}
.fx-tag.mid{font-size:22px;background:var(--felt-deep);color:var(--gold);border:1px solid var(--gold);animation:fxPop 1.8s ease-out forwards}
@keyframes fxPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}15%{opacity:1;transform:translate(-50%,-90%) scale(1.15)}25%{transform:translate(-50%,-90%) scale(1)}80%{opacity:1;transform:translate(-50%,-100%) scale(1)}100%{opacity:0;transform:translate(-50%,-125%) scale(.95)}}
.fx-stamp{font-family:var(--font-display);font-weight:900;font-size:30px;letter-spacing:.2em;padding:2px 10px 2px 16px;color:var(--warn);border:3px solid var(--warn);border-radius:8px;
  background:rgba(19,54,41,.85);animation:fxStamp 2.6s ease-out forwards}
@keyframes fxStamp{0%{opacity:0;transform:translate(-50%,-50%) scale(3) rotate(-28deg)}14%{opacity:1;transform:translate(-50%,-50%) scale(.9) rotate(-12deg)}20%{transform:translate(-50%,-50%) scale(1) rotate(-12deg)}85%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-12deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(1) rotate(-12deg)}}
.fx-act{font-family:var(--font-display);font-weight:900;font-size:26px;letter-spacing:.14em;padding:4px 6px 4px 10px;
  color:var(--gold);background:none;border:none;text-shadow:0 0 14px var(--gold),0 2px 6px rgba(0,0,0,.6);animation:fadeIn .3s ease-out}
/* the plate of whoever is shuffling or cutting glows and breathes */
.who.acting,.meinfo.acting{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 20px var(--gold);animation:actGlow 1.1s ease-in-out infinite}
@keyframes actGlow{50%{box-shadow:0 0 0 2px var(--gold),0 0 6px var(--gold)}}
@keyframes fadeIn{from{opacity:0}}
.fx-canvas{position:fixed;inset:0;z-index:89;pointer-events:none}
.shake{animation:shake .5s ease-in-out .3s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.gloom{filter:grayscale(1) brightness(.7);transition:filter .6s}
/* on a computer the header gives its row back to the table: the name and the two sides' levels sit in the
   top-left corner and the sound / rules / new-game buttons in the top-right, both over the felt */
@media (min-width:700px){
  #app{position:relative}
  .bar{position:absolute;z-index:5;top:8px;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
    align-items:flex-start;pointer-events:none}
  .bar>*{pointer-events:auto}
  .bar{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"brand . acts" "score . .";row-gap:6px}
  .brand{grid-area:brand;line-height:1}
  .score{grid-area:score;flex-direction:column;align-items:flex-start;gap:4px}
  .bar .acts{grid-area:acts}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>

<body>

    <span class="acts"><button class="link tog" id="sfxBtn" aria-pressed="true">音效</button><button class="link tog" id="musicBtn" aria-pressed="true">音乐</button><button class="link" id="rulesBtn">规则</button><button class="link" id="newBtn">新局</button></span>

      <div class="handtools"><button class="link tog" id="fanBtn" aria-pressed="true" title="像手里握着牌一样展开，可以拖动牌插到别处">手持</button><button class="link" id="rowsBtn" title="改成两排">两排</button><button class="link" id="sortBtn" title="按大小重新排好">理牌</button></div>

<div class="overlay" id="overlay" hidden><div class="panel" id="panel"></div></div>

<div class="lobby" id="lobby" hidden>
  <div class="lobby-box">
    <h1 class="lobby-title">掼蛋</h1>
    <label class="lobby-label" for="nick">昵称</label>
    <input class="lobby-nick" id="nick" maxlength="8" autocomplete="off" placeholder="输入你的昵称">
    <div class="lobby-table" id="lobbyTable">
      <button class="seat-btn" data-seat="N" style="grid-area:n"><b>北</b><span>空位</span></button>
      <button class="seat-btn" data-seat="W" style="grid-area:w"><b>西</b><span>空位</span></button>
      <div class="lobby-felt" style="grid-area:c"></div>
      <button class="seat-btn" data-seat="E" style="grid-area:e"><b>东</b><span>空位</span></button>
      <button class="seat-btn" data-seat="S" style="grid-area:s"><b>南</b><span>空位</span></button>
    </div>
    <button class="btn primary lobby-go" id="sitBtn" disabled>坐下开始</button>
  </div>

<script>
/* ---------- cards ---------- */
const SUITS=['S','H','C','D'];
const SUIT_CH={S:'♠',H:'♥',C:'♣',D:'♦'};
const SUIT_ORDER={S:0,H:1,C:2,D:3,J:4};
const RN={11:'J',12:'Q',13:'K',14:'A'};
const rankName=r=>RN[r]||String(r);
const NAMES=['你','下家','对家','上家'];
const PLACE=['头游','二游','三游','末游'];
const TYPE_NAME={single:'单张',pair:'对子',triple:'三张',full:'三带二',straight:'顺子',pairs3:'连对',trip2:'钢板',bomb:'炸弹',sflush:'同花顺',jokers:'天王炸'};
const SEQS=[[5,1],[3,2],[2,3]];
const SEQ_TYPE={'5,1':'straight','3,2':'pairs3','2,3':'trip2'};

const isWild=(c,L)=>c.s==='H'&&c.r===L;
const val=(c,L)=>c.r>=16?c.r:(c.r===L?15:c.r);
const cardText=c=>c.r===16?'小王':c.r===17?'大王':SUIT_CH[c.s]+rankName(c.r);

function makeDeck(){
  const d=[];let id=0;
  for(let k=0;k<2;k++){
    for(const s of SUITS)for(let r=2;r<=14;r++)d.push({id:id++,s,r});
    d.push({id:id++,s:'J',r:16});d.push({id:id++,s:'J',r:17});
  }
  return d;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
const cmpCards=(a,b,L)=>val(b,L)-val(a,L)||(isWild(b,L)-isWild(a,L))||SUIT_ORDER[a.s]-SUIT_ORDER[b.s]||a.id-b.id;
function sortHand(h,L){
  h.sort((a,b)=>cmpCards(a,b,L));
  return h;
}

/* ---------- combination rules ---------- */
// starts s (A may sit at 1 or 14) where nat cards fit len consecutive ranks with `need` each; wilds fill the gaps
function seqStarts(nat,w,len,need){
  const out=[];
  if(nat.length+w!==len*need)return out;
  for(let s=1;s+len-1<=14;s++){
    const cnt={};let ok=true;
    for(const c of nat){
      let p=c.r;if(p===14&&s===1)p=1;
      if(p<s||p>s+len-1){ok=false;break}
      cnt[p]=(cnt[p]||0)+1;
      if(cnt[p]>need){ok=false;break}
    }
    if(ok)out.push(s);
  }
  return out;
}

// every legal reading of a set of cards
function analyze(cards,L){
  const n=cards.length,res=[];
  if(!n)return res;
  const wild=cards.filter(c=>isWild(c,L)),rest=cards.filter(c=>!isWild(c,L));
  const w=wild.length;
  const jok=rest.filter(c=>c.r>=16),nat=rest.filter(c=>c.r<16);
  const cnt={};for(const c of nat)cnt[c.r]=(cnt[c.r]||0)+1;
  const ranks=Object.keys(cnt).map(Number);
  const v=r=>r>=16?r:(r===L?15:r);
  const add=(type,value)=>res.push({type,value,n});

  if(jok.length){
    if(n===1)add('single',jok[0].r);
    else if(n===2&&jok.length===2&&jok[0].r===jok[1].r)add('pair',jok[0].r);
    else if(n===4&&jok.length===4)add('jokers',99);
    else if(n===5&&jok.length===2&&jok[0].r===jok[1].r&&ranks.length===1&&nat.length+w===3)add('full',v(ranks[0]));
    return res;
  }
  if(ranks.length<=1){
    const sv=ranks.length?v(ranks[0]):15;
    if(n===1)add('single',sv);
    else if(n===2)add('pair',sv);
    else if(n===3)add('triple',sv);
    else add('bomb',sv);
  }
  if(n===5){
    if(ranks.length===2){
      for(const [t,p] of [[ranks[0],ranks[1]],[ranks[1],ranks[0]]]){
        if(cnt[t]<=3&&cnt[p]<=2)add('full',v(t));
      }
    }
    if(ranks.length===1&&nat.length===3&&w===2&&ranks[0]!==L)add('full',v(ranks[0]));
    const ss=seqStarts(nat,w,5,1);
    if(ss.length){
      const top=Math.max(...ss);
      add('straight',top);
      if(new Set(nat.map(c=>c.s)).size<=1)add('sflush',top);
    }
  }
  if(n===6){
    const a=seqStarts(nat,w,3,2);if(a.length)add('pairs3',Math.max(...a));
    const b=seqStarts(nat,w,2,3);if(b.length)add('trip2',Math.max(...b));
  }
  return res;
}
const isBomb=p=>p.type==='bomb'||p.type==='sflush'||p.type==='jokers';
const power=p=>p.type==='jokers'?10000:p.type==='sflush'?550+p.value:p.n*100+p.value;
function beats(p,cur){
  if(!cur)return true;
  const pb=isBomb(p),cb=isBomb(cur);
  if(pb&&!cb)return true;
  if(!pb&&cb)return false;
  if(pb)return power(p)>power(cur);
  return p.type===cur.type&&p.n===cur.n&&p.value>cur.value;
}
const strength=p=>isBomb(p)?100000+power(p):p.value;

/* ---------- move generation ---------- */
function genPlays(hand,L){
  const wild=[],jk={16:[],17:[]},by={};
  for(const c of hand){
    if(isWild(c,L))wild.push(c);
    else if(c.r>=16)jk[c.r].push(c);
    else(by[c.r]||(by[c.r]=[])).push(c);
  }
  const w=wild.length,sets=[],W=k=>wild.slice(0,k);
  for(const r in by){
    const g=by[r];
    for(let k=1;k<=g.length+w;k++){const nat=Math.min(g.length,k);sets.push(g.slice(0,nat).concat(W(k-nat)))}
  }
  if(w){sets.push(W(1));if(w===2)sets.push(W(2))}
  for(const r of [16,17]){const g=jk[r];if(g.length)sets.push([g[0]]);if(g.length===2)sets.push(g.slice())}
  if(jk[16].length===2&&jk[17].length===2)sets.push(jk[16].concat(jk[17]));
  // three with a pair
  const T=[],P=[];
  for(const r in by){
    const g=by[r],R=+r;
    if(g.length>=3)T.push({r:R,nat:g.slice(0,3),wu:0});else if(g.length+w>=3)T.push({r:R,nat:g.slice(),wu:3-g.length});
    if(g.length>=2)P.push({r:R,nat:g.slice(0,2),wu:0});else if(w)P.push({r:R,nat:g.slice(),wu:1});
  }
  if(w===2&&!by[L])P.push({r:L,nat:[],wu:2});
  for(const r of [16,17])if(jk[r].length===2)P.push({r,nat:jk[r].slice(),wu:0});
  for(const t of T)for(const p of P){
    if(t.r===p.r||t.wu+p.wu>w)continue;
    sets.push(t.nat.concat(p.nat,W(t.wu+p.wu)));
  }
  // straights, pairs in a row, triples in a row
  for(const [len,need] of SEQS){
    for(let s=1;s+len-1<=14;s++){
      let nat=[],wu=0;
      for(let p=s;p<s+len;p++){const g=by[p===1?14:p]||[];const k=Math.min(g.length,need);nat=nat.concat(g.slice(0,k));wu+=need-k}
      if(wu<=w)sets.push(nat.concat(W(wu)));
    }
  }
  // straight flushes
  for(const su of SUITS)for(let s=1;s<=10;s++){
    const nat=[];let wu=0;
    for(let p=s;p<s+5;p++){const c=(by[p===1?14:p]||[]).find(x=>x.s===su);if(c)nat.push(c);else wu++}
    if(wu<=w)sets.push(nat.concat(W(wu)));
  }
  const out=[],seen=new Set();
  for(const cs of sets){
    const wu=cs.filter(c=>isWild(c,L)).length;
    for(const a of analyze(cs,L)){
      const key=a.type+'|'+a.value+'|'+a.n+'|'+wu;
      if(seen.has(key))continue;
      seen.add(key);
      out.push({...a,cards:cs,wu});
    }
  }
  return out;
}

/* ---------- hand evaluation: roughly how many turns of control the hand still needs ---------- */
const unitCost=v=>v>=15?.25:v>=14?.5:v>=12?.75:1;
function baseCost(cnt,L){
  const pairs=[],trips=[];let c=0;
  for(let r=2;r<=14;r++){
    const k=cnt[r];if(!k)continue;
    const v=r===L?15:r;
    if(k===1)c+=unitCost(v);else if(k===2)pairs.push(v);else trips.push(v);
  }
  pairs.sort((a,b)=>a-b);
  for(const t of trips){c+=unitCost(t);if(pairs.length&&pairs[0]<14)pairs.shift()}
  for(const p of pairs)c+=unitCost(p);
  return c;
}
function seqCost(cnt,L,depth){
  let best=baseCost(cnt,L);
  if(depth>=2)return best;
  for(const [len,need] of SEQS){
    for(let s=1;s+len-1<=14;s++){
      let ok=true;
      for(let p=s;p<s+len;p++)if(cnt[p===1?14:p]<need){ok=false;break}
      if(!ok)continue;
      for(let p=s;p<s+len;p++)cnt[p===1?14:p]-=need;
      const v=.9+seqCost(cnt,L,depth+1);
      for(let p=s;p<s+len;p++)cnt[p===1?14:p]+=need;
      if(v<best)best=v;
    }
  }
  return best;
}
function handCost(hand,L){
  const cnt=new Array(15).fill(0);let w=0,sj=0,bj=0;
  for(const c of hand){if(isWild(c,L))w++;else if(c.r===16)sj++;else if(c.r===17)bj++;else cnt[c.r]++}
  let cost=0;
  if(sj+bj===4)cost-=1.5;else{if(sj)cost+=.3;if(bj)cost+=.2}
  for(let r=2;r<=14;r++)if(cnt[r]>=4){cost-=.4+.1*(cnt[r]-4);cnt[r]=0}
  cost+=seqCost(cnt,L,0);
  return cost-.9*w;
}

/* ---------- AI ---------- */
function scorePlays(p,plays){
  const hand=G.hands[p],L=G.L;
  return plays.map(pl=>{
    const rest=hand.filter(c=>!pl.cards.includes(c));
    return {pl,rc:handCost(rest,L),bomb:isBomb(pl)};
  });
}
function rankLeads(p,plays){
  const mate=(p+2)%4;
  const oppMin=Math.min(...[(p+1)%4,(p+3)%4].map(i=>G.hands[i].length||99));
  const mateLeft=G.hands[mate].length;
  const s=scorePlays(p,plays);
  for(const x of s){
    const pl=x.pl;
    x.score=x.rc+(x.bomb?2.2:0)+pl.wu*.3+pl.value*.01-pl.n*.02;
    if(oppMin===1&&pl.type==='single')x.score+=3-pl.value*.12;
    if(oppMin===2&&pl.type==='pair')x.score+=2-pl.value*.08;
    if(mateLeft===1&&pl.type==='single'&&!x.bomb)x.score-=4-pl.value*.2;
    if(mateLeft===2&&pl.type==='pair'&&!x.bomb)x.score-=2.5-pl.value*.1;
  }
  return s.sort((a,b)=>a.score-b.score);
}
function aiDecide(p){
  const hand=G.hands[p],L=G.L,cur=G.trick?G.trick.play:null;
  const plays=genPlays(hand,L).filter(pl=>beats(pl,cur));
  if(!plays.length)return null;
  const fin=plays.find(pl=>pl.cards.length===hand.length);
  if(fin)return fin;
  if(!cur)return rankLeads(p,plays)[0].pl;

  const winner=G.trick.player;
  if(winner%2===p%2)return null; // let partner's cards ride
  const base=handCost(hand,L);
  const winLeft=G.hands[winner].length;
  const oppMin=Math.min(...[(p+1)%4,(p+3)%4].map(i=>G.hands[i].length||99));
  const urgent=winLeft<=6||oppMin<=4;
  const s=scorePlays(p,plays);
  const normal=s.filter(x=>!x.bomb).map(x=>({...x,score:(x.rc-base)+x.pl.wu*.6+x.pl.value*.02})).sort((a,b)=>a.score-b.score);
  if(normal.length){
    const b=normal[0],delta=b.rc-base;
    let ok=delta<=.35||urgent||(delta<=1.2&&Math.random()<.3);
    if(ok&&b.pl.value>=16&&cur.value<13&&!urgent&&hand.length>8&&Math.random()<.6)ok=false;
    if(ok)return b.pl;
  }
  const bombs=s.filter(x=>x.bomb).sort((a,b)=>power(a.pl)-power(b.pl)||a.rc-b.rc);
  if(bombs.length){
    const b=bombs[0];
    const want=winLeft<=7||b.rc<=2||(isBomb(cur)&&winLeft<=12)||(cur.value>=14&&Math.random()<.25);
    if(want)return b.pl;
  }
  return null;
}
function aiReturnCard(hand,L){
  let pool=hand.filter(c=>c.r<=10&&!isWild(c,L)&&c.r!==L);
  if(!pool.length)pool=hand.filter(c=>c.r<=10&&!isWild(c,L));
  if(!pool.length)pool=hand.filter(c=>!isWild(c,L)&&c.r<16);
  if(!pool.length)pool=hand.slice();
  let best=null,bs=1e9;
  for(const c of pool){
    const sc=handCost(hand.filter(x=>x!==c),L)+val(c,L)*.01;
    if(sc<bs){bs=sc;best=c}
  }
  return best;
}
const tributeCard=(hand,L)=>hand.filter(c=>!isWild(c,L)).reduce((m,c)=>!m||val(c,L)>val(m,L)?c:m,null);

/* ---------- game state ---------- */
let G=null;
let sel=new Set();
let hints=[],hintIdx=0;
let msgTimer=0;

function newGame(){
  G={levels:[2,2],lvlTeam:0,L:2,round:0,hands:[[],[],[],[]],trick:null,passes:0,last:[null,null,null,null],
     out:[],prevOut:null,turn:0,phase:'play',notice:'',fresh:[],returns:[],leader:0,result:null,tok:0};
  startRound();
}
function startRound(){
  G.tok++;
  G.round++;
  G.L=G.levels[G.lvlTeam];
  G.deck=shuffle(makeDeck());
  G.hands=[[],[],[],[]];
  G.trick=null;G.passes=0;G.last=[null,null,null,null];G.out=[];G.fresh=[];G.result=null;
  G.turn=-1;G.notice='';G.clock=null;G.busy=false;G.reveal=0;G.trickPlays=[];G.heapN=0;G.myOrder=[];G.blocks=[];pileRebuild();G.dealCount=0;
  // as at a real table: the last round's first-out cuts and the player before them shuffles
  // (the very first round picks the cutter at random)
  G.cutter=G.prevOut?G.prevOut[0]:Math.random()*4|0;
  G.shuffler=(G.cutter+3)%4;
  G.dealIdx=G.cutter;
  sel=new Set();
  hideOverlay();
  removeDeck();
  startShuffle();
}
// the deck travels to whoever is handling it: it is shuffled right in front of the shuffler, slid across to
// the cutter and cut in front of them, then comes back to the middle to be dealt; their plate glows meanwhile
function startShuffle(){
  G.phase='shuffle';
  showDeck();
  markActor(G.shuffler,'洗牌');
  slideDeck(actorSpot(G.shuffler));
  if(G.shuffler===0){G.clock={who:'deck',left:DECK_MS,total:DECK_MS};render();return}
  render();
  later(doShuffle,1000);
}
function doShuffle(){
  if(G.phase!=='shuffle'||G.busy)return;
  G.busy=true;G.clock=null;render();
  animShuffle(()=>{G.busy=false;startCut()},actorSpot(G.shuffler));
}
function startCut(){
  G.phase='cut';
  markActor(G.cutter,'切牌');
  slideDeck(actorSpot(G.cutter));
  if(G.cutter===0){G.clock={who:'deck',left:DECK_MS,total:DECK_MS};render();return}
  render();
  later(doCut,1000);
}
function doCut(){
  if(G.phase!=='cut'||G.busy)return;
  G.busy=true;G.clock=null;render();
  animCut(()=>{
    markActor(-1);
    slideDeck(null);
    later(()=>{G.busy=false;beginDeal()},520);
  },actorSpot(G.cutter));
}
// where the deck sits when a player handles it: on the table right in front of them
function actorSpot(p){
  const g=pileGeo();
  if(p===0)return{x:g.cx,y:g.bottom-g.ch*.8};
  if(p===2)return{x:g.cx,y:g.top+g.ch*.8};
  if(p===3)return{x:g.left+g.cw*1.9,y:g.sideY[3]};
  return{x:g.right-g.cw*1.9,y:g.sideY[1]};
}
function slideDeck(spot){
  const d=$('#deck');if(!d)return;
  const g=pileGeo(),at=spot||{x:g.cx,y:g.hy};
  d.style.transition='transform .5s cubic-bezier(.3,.7,.3,1)';
  d.style.transform=`translate(${at.x}px,${at.y}px)`;
}
// the player handling the deck: their plate glows and a large label beside it says what they are doing
function markActor(p,text){
  document.querySelectorAll('.acting').forEach(e=>e.classList.remove('acting'));
  document.querySelectorAll('.fx-act').forEach(e=>e.remove());
  if(p<0)return;
  (p===0?$('.meinfo'):$('#seat'+p+' .who')).classList.add('acting');
  // on your own turn the button is the only thing to look at, so no label competes with it
  if(p===0)return;
  const q=placePoint(p),e=document.createElement('div');
  e.className='fx fx-act';e.textContent=text;
  e.style.left=q.x+'px';e.style.top=q.y+'px';
  document.body.appendChild(e);
}
function beginDeal(){
  G.phase='deal';G.busy=false;G.clock=null;
  render();
  later(dealNext,300);
}
const DECK_MS=15000; // time you get to shuffle or cut before it is done for you
// one card leaves the centre every 20ms and lands in a hand 240ms later
function dealNext(){
  if(G.phase!=='deal')return;
  if(G.dealCount>=108){later(finishDeal,450);return}
  const p=(G.dealIdx+G.dealCount++)%4;
  fly(p);
  Sound.play('flick');
  later(()=>{
    const c=G.deck.pop();if(!c)return;
    G.hands[p].push(c);
    dealView(p,c);
  },240);
  later(dealNext,reduceMotion()?0:20);
}
function finishDeal(){
  // also fills hands at once if the page was reloaded mid-deal
  for(let p=0;p<4;p++)while(G.hands[p].length<27&&G.deck.length)G.hands[p].push(G.deck.pop());
  G.deck=[];
  for(const h of G.hands)sortHand(h,G.L);
  removeDeck();
  if(!G.prevOut){
    G.turn=Math.random()*4|0;
    G.notice='';
    startPrep(G.turn);
  }else doTribute();
}
function doTribute(){
  const o=G.prevOut,L=G.L;
  const dbl=o[1]%2===o[0]%2;
  const givers=dbl?[o[2],o[3]]:[o[3]];
  const bigJ=givers.reduce((s,g)=>s+G.hands[g].filter(c=>c.r===17).length,0);
  if(bigJ>=2){
    G.notice=`${givers.map(g=>NAMES[g]).join('、')}手握两张大王，抗贡。`;
    startPrep(o[0]);return;
  }
  let tribs=givers.map(g=>({g,card:tributeCard(G.hands[g],L)}));
  if(dbl)tribs.sort((a,b)=>val(b.card,L)-val(a.card,L));
  const recv=dbl?[o[0],o[1]]:[o[0]];
  G.gives=tribs.map((t,i)=>({from:t.g,to:recv[i],id:t.card.id,label:'进贡'}));
  G.leader=tribs[0].g;
  G.returns=tribs.map((t,i)=>({from:recv[i],to:t.g}));
  G.notice='';
  runGives();
}
// hand over queued cards one at a time, face up across the table, then carry on with the returns
async function runGives(){
  G.phase='tribute';
  render();
  const tok=G.tok;
  while(G.gives.length){
    const x=G.gives[0];
    const card=G.hands[x.from].find(c=>c.id===x.id);
    if(card){
      await giveAnim(x.from,x.to,card,x.label);
      if(G.tok!==tok)return;
      giveCard(x.from,x.to,card);
      G.notice+=`${x.label==='进贡'?`${NAMES[x.from]}进贡 ${cardText(card)} 给${NAMES[x.to]}`:`${NAMES[x.from]}还 ${cardText(card)}`}。`;
    }
    G.gives.shift();
    render();
  }
  processReturns();
}
function processReturns(){
  if(!G.returns.length){startPrep(G.leader);return}
  const x=G.returns[0];
  if(x.from===0){G.phase='return';sel=new Set();G.clock={who:'return',left:TURN_MS,total:TURN_MS};render();return}
  const c=aiReturnCard(G.hands[x.from],G.L);
  G.returns.shift();
  G.gives.push({from:x.from,to:x.to,id:c.id,label:'还贡'});
  later(runGives,400);
}
function startPrep(leader){
  G.phase='prep';G.turn=leader;
  G.clock={who:'prep',left:PREP_MS,total:PREP_MS};
  render();
}
function beginPlay(){
  if(G.phase!=='prep')return;
  G.clock=null;G.phase='play';
  startTurn();
}
function giveCard(from,to,c){
  G.hands[from]=G.hands[from].filter(x=>x!==c);
  G.hands[to].push(c);sortHand(G.hands[to],G.L);
  if(to===0)G.fresh.push(c.id);
}

const active=i=>G.hands[i].length>0;
function nextActive(i){for(let k=1;k<=4;k++){const j=(i+k)%4;if(active(j))return j}return i}

function later(fn,ms){const t=G.tok;setTimeout(()=>{if(G.tok===t)fn()},ms)}

function startTurn(){
  hints=[];hintIdx=0;
  render();
  if(G.phase!=='play')return;
  const p=G.turn;
  if(p===0){
    const cur=G.trick?G.trick.play:null;
    hints=sortHints(genPlays(G.hands[0],G.L).filter(pl=>beats(pl,cur)));
    Sound.play('turn');
    G.clock={who:0,left:TURN_MS,total:TURN_MS};
    render();
    return;
  }
  // once you are out the computers stop pretending to think so long
  const think=active(0)?AI_THINK_MIN+Math.random()*(AI_THINK_MAX-AI_THINK_MIN):400+Math.random()*300;
  G.clock={who:p,left:TURN_MS,total:TURN_MS,think};
  renderClocks();
}

/* ---------- clocks: one ticker drives turn limits, computer thinking and the pre-play countdown ---------- */
const TURN_MS=20000,PREP_MS=60000,HURRY_MS=5000;
// computer "thinking" time per move; shortened for testing (the full-feel setting was 2000-5000)
const AI_THINK_MIN=500,AI_THINK_MAX=1000;
let lastTick=performance.now();
setInterval(()=>{
  const now=performance.now(),dt=Math.min(now-lastTick,1000);
  lastTick=now;
  const c=G&&G.clock;
  if(!c||!$('#overlay').hidden)return; // paused while a panel is open
  const before=c.left;
  c.left-=dt;
  if(c.think==null&&c.left>0&&c.left<=HURRY_MS&&Math.ceil(before/1000)!==Math.ceil(c.left/1000))Sound.play('tick');
  if(c.think!=null&&c.total-c.left>=c.think){G.clock=null;doPlay(c.who,c.who===0?null:aiDecide(c.who));return}
  if(c.left<=0){G.clock=null;timeUp(c.who);return}
  renderClocks();
},100);
function timeUp(who){
  if(who==='prep'){beginPlay();return}
  if(who==='deck'){G.phase==='shuffle'?doShuffle():doCut();return}
  if(who==='return'){
    const c=aiReturnCard(G.hands[0],G.L);
    sel=new Set([c.id]);
    onReturn();
    setMsg(`时间到，已自动还贡 ${cardText(c)}`);
    return;
  }
  if(who===0&&G.phase==='play'&&G.turn===0){
    const pl=aiDecide(0)||(G.trick?null:hints[0]);
    sel=new Set();
    setMsg(pl?'时间到，已自动出牌':'时间到，自动不出');
    doPlay(0,pl);
  }
}
function renderClocks(){
  const c=G.clock;
  for(let p=0;p<4;p++){
    const el=p===0?$('#myClock'):$('#seat'+p+' .clock');
    const on=!!c&&(c.who===p||(p===0&&(c.who==='return'||c.who==='deck')));
    const n=on?String(Math.max(0,Math.ceil(c.left/1000))):'';
    if(el.dataset.n!==n){el.dataset.n=n;el.innerHTML=n?`<b>${n}</b>`:''}
    el.classList.toggle('hurry',on&&c.left<=HURRY_MS);
  }
  const prep=!!c&&c.who==='prep';
  $('#prep').hidden=!prep;
  if(prep){
    $('#prepNum').textContent=Math.max(0,Math.ceil(c.left/1000));
    $('#prepNum').classList.toggle('hurry',c.left<=HURRY_MS);
    $('#prepText').textContent=`秒后${G.turn===0?'由你':NAMES[G.turn]}先出`;
  }
}
function sortHints(plays){
  if(!G.trick)return rankLeads(0,plays).map(x=>x.pl);
  return plays.sort((a,b)=>(isBomb(a)-isBomb(b))||(isBomb(a)?power(a)-power(b):a.value-b.value)||a.wu-b.wu);
}

function doPlay(p,play){
  if(G.phase!=='play'||G.turn!==p)return;
  G.clock=null;
  if(G.notice&&(play||G.trick))G.notice='';
  if(play)Sound.play(isBomb(play)?'bomb':'play',play.type==='jokers'||play.n>=6);
  else Sound.play('pass');
  if(play){
    let origins=null;
    if(p===0){
      origins={};
      for(const c of play.cards){
        const el=handEl.querySelector(`.card[data-id="${c.id}"]`);
        if(el){const r=el.getBoundingClientRect();origins[c.id]={x:r.left+r.width/2,y:r.top+r.height/2}}
      }
    }
    pileThrow(p,play,origins,true);
    G.trickPlays.push({p,play:{type:play.type,value:play.value,n:play.n,cards:play.cards}});
    const ids=new Set(play.cards.map(c=>c.id));
    G.hands[p]=G.hands[p].filter(c=>!ids.has(c.id));
    G.trick={player:p,play};
    G.passes=0;
    G.last[p]={play};
    if(p===0){sel=new Set();G.fresh=[]}
    if(!G.hands[p].length){
      G.out.push(p);
      celebrate(p,G.out.length-1);
      if(roundOver()){finishRound();return}
    }
  }else{
    G.passes++;
    G.last[p]='pass';
    pilePass(p);
  }
  advance();
}
function roundOver(){return(!active(0)&&!active(2))||(!active(1)&&!active(3))}
function advance(){
  const winner=G.trick.player;
  const others=[0,1,2,3].filter(i=>i!==winner&&active(i)).length;
  if(G.passes>=others){
    let leader=winner;
    if(!active(winner)){
      const mate=(winner+2)%4;
      leader=active(mate)?mate:nextActive(winner);
      G.notice=`${NAMES[leader]}接风，获得出牌权。`;
    }
    G.turn=-1;G.nextLeader=leader;
    render();
    later(()=>{
      pileSweep();
      G.heapN+=G.trickPlays.reduce((s,t)=>s+t.play.cards.length,0);G.trickPlays=[];
      G.trick=null;G.passes=0;G.last=[null,null,null,null];G.turn=leader;startTurn();
    },TRICK_HOLD_MS);
    return;
  }
  G.turn=nextActive(G.turn);
  startTurn();
}
function finishRound(){
  // the losing side's remaining players fill in the last places, in turn order
  let i=G.out[G.out.length-1];
  const k0=G.out.length;
  for(let k=1;k<=4;k++){const j=(i+k)%4;if(!G.out.includes(j))G.out.push(j)}
  const first=G.out[0],team=first%2,mate=(first+2)%4;
  const pos=G.out.indexOf(mate);
  const up=pos===1?3:pos===2?2:1;
  const before=G.levels[team];
  let win=false;
  if(G.lvlTeam===team&&before===14&&pos<=2)win=true;
  else G.levels[team]=Math.min(14,before+up);
  G.result={order:G.out.slice(),team,up,before,after:G.levels[team],win,playedLevel:G.L};
  G.prevOut=G.out.slice();
  G.lvlTeam=team;
  G.phase=win?'over':'roundEnd';
  G.turn=-1;G.reveal=0;
  render();
  // the end of a round plays out like a real table: the last trick stays face up for a moment,
  // then gets turned over onto the pile, then the places are called out one by one, then the result
  later(()=>{
    pileSweep();Sound.play('shuffle');
    G.heapN+=G.trickPlays.reduce((s,t)=>s+t.play.cards.length,0);G.trickPlays=[];G.last=[null,null,null,null];
  },END_SHOW_MS);
  for(let k=0;k<4;k++)later(()=>{
    G.reveal=k+1;render();
    // places handed out only now (always including last place) get their moment here
    // the label itself names the place, so the moment adds only sound and motion, never a second copy of the words
    if(k>=k0)celebrate(G.out[k],k,true);else Sound.play('ding');
  },END_SHOW_MS+700+k*500);
  later(()=>{Sound.play(team===0?'win':'lose');showResult()},END_SHOW_MS+700+4*500+1400);
}
const END_SHOW_MS=2600; // how long the final trick stays face up

/* ---------- human actions ---------- */
function selectedCards(){return G.hands[0].filter(c=>sel.has(c.id))}
function onPlay(){
  if(G.phase!=='play'||G.turn!==0)return;
  const cards=selectedCards();
  if(!cards.length){setMsg('先选几张牌',true);return}
  const cur=G.trick?G.trick.play:null;
  const reads=analyze(cards,G.L);
  if(!reads.length){setMsg('这几张牌不成牌型',true);return}
  const ok=reads.filter(r=>beats(r,cur)).sort((a,b)=>strength(b)-strength(a));
  if(!ok.length){setMsg(`管不上${cur?TYPE_NAME[cur.type]:''}`,true);return}
  const r=ok[0];
  const wu=cards.filter(c=>isWild(c,G.L)).length;
  doPlay(0,{...r,cards,wu});
}
function onPass(){
  if(G.phase!=='play'||G.turn!==0||!G.trick)return;
  sel=new Set();
  doPlay(0,null);
}
function onHint(){
  if(G.phase!=='play'||G.turn!==0)return;
  if(!hints.length){setMsg('没有能管上的牌，可以点“不出”');return}
  const h=hints[hintIdx%hints.length];hintIdx++;
  sel=new Set(h.cards.map(c=>c.id));
  renderHand();
}
function onReturn(){
  if(G.phase!=='return')return;
  const cards=selectedCards();
  if(cards.length!==1){setMsg('选一张 10 或以下的牌还贡',true);return}
  const c=cards[0];
  if(c.r>10||isWild(c,G.L)){setMsg('还贡的牌要在 10 或以下，且不能是百搭',true);return}
  const x=G.returns.shift();
  G.fresh=G.fresh.filter(id=>id!==c.id);
  sel=new Set();
  G.clock=null;
  G.gives.push({from:0,to:x.to,id:c.id,label:'还贡'});
  runGives();
}

/* ---------- rendering ---------- */
const $=s=>document.querySelector(s);
function cardHTML(c,L,extra=''){
  if(c.r>=16){
    const big=c.r===17;
    return `<div class="card joker ${big?'red':''} ${extra}" data-id="${c.id}"><span class="idx">${[...'JOKER'].map(ch=>`<span>${ch}</span>`).join('')}</span><span class="pip">${big?'★':'☆'}</span></div>`;
  }
  const red=c.s==='H'||c.s==='D',wild=isWild(c,L);
  return `<div class="card ${red?'red':''} ${wild?'wild':''} ${extra}" data-id="${c.id}"><span class="idx"><span class="rk ${c.r===10?'ten':''}">${rankName(c.r)}</span><span class="su">${SUIT_CH[c.s]}</span>${wild?'<span class="tag">配</span>':''}</span><span class="pip">${SUIT_CH[c.s]}</span></div>`;
}
// cards in the order a combination reads; a wild card sits exactly where it stands in for a missing card
function displayOrder(play,L){
  const cs=play.cards.slice(),wilds=cs.filter(c=>isWild(c,L)),nat=cs.filter(c=>!isWild(c,L));
  const bySuit=(a,b)=>SUIT_ORDER[a.s]-SUIT_ORDER[b.s];
  const SEQ={straight:[5,1],sflush:[5,1],pairs3:[3,2],trip2:[2,3]}[play.type];
  if(SEQ){
    // walk the run from its lowest rank; each step takes its own cards, and a wild fills any gap;
    // then read it high to low, left to right, the same way the hand is sorted
    const [len,need]=SEQ,out=[],left=nat.slice();
    for(let q=play.value;q<play.value+len;q++){
      const r=q===1?14:q;
      const here=left.filter(c=>c.r===r).sort(bySuit).slice(0,need);
      for(const c of here)left.splice(left.indexOf(c),1);
      out.push(...here);
      for(let k=here.length;k<need&&wilds.length;k++)out.push(wilds.shift());
    }
    return out.reverse().concat(left,wilds);
  }
  if(play.type==='full'){
    // the three of a kind first (a wild joins it if it is short), then the pair (with any wild it needs)
    const trip=nat.filter(c=>val(c,L)===play.value).sort(bySuit),pair=nat.filter(c=>val(c,L)!==play.value).sort(bySuit);
    while(trip.length<3&&wilds.length)trip.push(wilds.shift());
    return trip.concat(pair,wilds);
  }
  return nat.sort((a,b)=>val(b,L)-val(a,L)||bySuit(a,b)).concat(wilds);
}

/* ---------- the table pile: plays are thrown face up into the middle, a finished trick is turned face down onto the heap ---------- */
let pileZ=1000,heapZ=1;
const BIG=1.3; // how much the most recent play is enlarged
const TRICK_HOLD_MS=2200; // a finished trick stays face up this long, so everyone can remember it, then turns over
const pileEl=()=>$('#pile');
// the open play area between the four plates
function pileGeo(){
  const L=pileEl().getBoundingClientRect(),R=q=>$(q).getBoundingClientRect();
  const top=R('#seat2 .whorow').bottom-L.top;
  const bottom=R('#seat0').top-L.top;
  // the same margin on both sides (a ticking clock widens one plate, which must not push one player's cards in)
  const side=Math.max(R('#seat3 .whorow').right-L.left,L.right-R('#seat1 .whorow').left);
  const left=side,right=L.width-side;
  const cw=$('#pile .probe').offsetWidth||48;
  const e=R('.emblem'),mid=q=>{const r=R(q);return r.top+r.height/2-L.top};
  return{L,top,bottom,left,right,cx:L.width/2,cy:(top+bottom)/2,hy:e.top+e.height/2-L.top,sideY:{1:mid('#seat1 .who'),3:mid('#seat3 .who')},cw,ch:cw*1.4};
}
// a small margin kept clear along each plate
const PASS_X=12,PASS_Y=10;
const OLD=.9; // earlier plays in the trick settle a little smaller to leave room
const GAP=10;   // space between two plays of the same player
// Like four people round a square table: each player's cards go straight in front of them.
// The table splits into four zones (a column each for the left and right players, the middle split
// into a far half for your partner and a near half for you), and each player's plays this trick form a
// neat line centred on their own seat: across the table for you and your partner, down the table for the
// players at the sides. A line that runs out of room wraps into a second line closer to the middle.
function zoneFor(p,g){
  const side=(g.right-g.left)*.27,mx0=g.left+side,mx1=g.right-side;
  if(p===3)return{x0:g.left+PASS_X,x1:mx0,y0:g.top+PASS_Y,y1:g.bottom-PASS_Y};
  if(p===1)return{x0:mx1,x1:g.right-PASS_X,y0:g.top+PASS_Y,y1:g.bottom-PASS_Y};
  if(p===2)return{x0:mx0,x1:mx1,y0:g.top+PASS_Y,y1:g.cy};
  return{x0:mx0,x1:mx1,y0:g.cy,y1:g.bottom-PASS_Y};
}
const pileT=(x,y,rot,flip,sc=1)=>`perspective(800px) translate(${x}px,${y}px) rotate(${rot}deg) rotateY(${flip}deg) scale(${sc})`;
function relPoint(pt,g){return{x:pt.x-g.L.left,y:pt.y-g.L.top}}
// the plays of the current trick, oldest first, each remembering its cards' elements and its own little jitter
let pileGroups=[];
// table scale for this trick: starts at full size and steps down only when a trick no longer fits
let TS=1;
const MIN_TS=.55;
function groupDims(gr,g,sc,tag){
  const cw=g.cw*TS,off=cw*.42,span=cw+off*(gr.n-1);
  return{off,cw,ch:cw*1.4,w:span*sc+8,h:cw*1.4*sc+(tag?26:6)};
}
// lay out one player's plays; with apply=false it only reports whether they fit in the player's zone
function layoutPlayer(p,g,apply){
  const groups=pileGroups.filter(gr=>gr.p===p);
  if(!groups.length)return true;
  const z=zoneFor(p,g),across=p===0||p===2;
  const len=across?z.x1-z.x0:z.y1-z.y0,room=across?z.y1-z.y0:z.x1-z.x0;
  const items=groups.map(gr=>{
    // only a bomb gets a tag, and it sits on the cards' lower edge, so it takes no room of its own
    const tag=gr.latest&&isBomb(gr.play),sc=gr.latest?gr.sc:OLD,d=groupDims(gr,g,sc,false);
    return{gr,sc,d,tag,along:across?d.w:d.h,deep:across?d.h:d.w};
  });
  const lines=[];
  let line=[],used=0;
  for(const it of items){
    if(line.length&&used+GAP+it.along>len){lines.push(line);line=[];used=0}
    used+=(line.length?GAP:0)+it.along;line.push(it);
  }
  lines.push(line);
  const depth=lines.reduce((s,l)=>s+Math.max(...l.map(it=>it.deep)),0)+GAP*(lines.length-1);
  const fits=depth<=room&&lines.every(l=>l.reduce((s,it)=>s+it.along,0)+GAP*(l.length-1)<=len);
  if(!apply)return fits;
  // the first line sits right in front of the player; any further line steps in towards the middle
  const centre=across?(z.x0+z.x1)/2:g.sideY[p];
  let edge=p===2?z.y0:p===0?z.y1:p===3?z.x0:z.x1;
  const dir=p===2||p===3?1:-1;
  pileEl().querySelectorAll('.ktag[data-p="'+p+'"]').forEach(e=>e.remove());
  for(const l of lines){
    const deep=Math.max(...l.map(it=>it.deep));
    const mid=edge+dir*deep/2;
    const lineLen=l.reduce((s,it)=>s+it.along,0)+GAP*(l.length-1);
    const lo=across?z.x0:z.y0,hi=across?z.x1:z.y1;
    let pos=Math.max(lo,Math.min(hi-lineLen,centre-lineLen/2));
    for(const it of l){
      const c=pos+it.along/2;pos+=it.along+GAP;
      const bx=across?c:mid,by=across?mid:c;
      const cy=by;
      it.gr.els.forEach((el,i)=>{
        const k=i-(it.gr.n-1)/2;
        el.style.transform=pileT(bx+k*it.d.off*it.sc,cy+it.gr.dy[i],it.gr.rot[i]*(it.gr.latest?.5:1),0,it.sc*TS);
      });
      if(it.tag){
        const t=document.createElement('div');
        t.className='ktag'+(isBomb(it.gr.play)?' boom':'');t.dataset.p=p;
        t.textContent=it.gr.play.type==='bomb'?`${it.gr.play.n}张炸弹`:TYPE_NAME[it.gr.play.type];
        t.style.left=bx+'px';t.style.top=cy+it.d.ch*it.sc/2-4+'px';t.style.zIndex=5000;
        pileEl().appendChild(t);
      }
    }
    edge+=dir*(deep+GAP);
  }
  return fits;
}
function pileThrow(p,play,origins,animate){
  const layer=pileEl(),g=pileGeo();
  passChip(p,false);
  // the previous play settles back, smaller
  const prev=pileGroups[pileGroups.length-1];
  if(prev&&prev.latest){
    prev.latest=false;
    prev.els.forEach(el=>{el.classList.remove('cur');el.classList.add('old');el.style.transitionDelay='0ms'});
    layer.querySelectorAll('.ktag').forEach(e=>e.remove());
  }
  const cards=displayOrder(play,G.L),n=cards.length,base=(Math.random()-.5)*8;
  const gr={p,play,n,els:[],latest:true,sc:BIG,rot:cards.map(()=>base+(Math.random()-.5)*4),dy:cards.map(()=>(Math.random()-.5)*4)};
  const anim=animate&&!reduceMotion();
  const seat=relPoint(seatPoint(p),g);
  cards.forEach((c,i)=>{
    const el=document.createElement('div');
    el.className='pc cur';
    el.innerHTML=cardHTML(c,G.L)+'<div class="bk"></div>';
    el.style.zIndex=++pileZ;
    if(anim){
      // your own cards leave your hand face up; everyone else's arrive face down and turn over in flight
      const o=origins&&origins[c.id]?relPoint(origins[c.id],g):seat;
      el.style.transition='none';
      el.style.transform=p===0?pileT(o.x,o.y,0,0,1.4):pileT(o.x,o.y,gr.rot[i]*3,180,.6);
      layer.appendChild(el);
      el.getBoundingClientRect();
      el.style.transition='';
      el.style.transitionDelay=i*30+'ms';
    }else layer.appendChild(el);
    gr.els.push(el);
  });
  pileGroups.push(gr);
  // the newest play as large as the player's zone allows; if even the smallest size will not fit,
  // the whole trick steps down in size and every player's line is laid out again
  for(;;){
    let ok=false;
    for(const sc of [BIG,1.15,1,OLD]){gr.sc=sc;if(layoutPlayer(p,g,false)){ok=true;break}}
    if(ok||TS<=MIN_TS)break;
    TS=Math.max(MIN_TS,TS*.9);
  }
  for(let q=0;q<4;q++)layoutPlayer(q,g,true);
}
// "不出" shows on the player's own plate, never on the table where it could hide cards
function passChip(p,on){
  const el=p===0?$('.meinfo .pass-chip'):$('#seat'+p+' .pass-chip');
  if(el)el.textContent=on?'不出':'';
}
function pilePass(p){passChip(p,true)}
// the face-down heap stays a small, tight pile in the middle
const HEAP_R=26,HEAP_SC=.7;
function heapSpot(g){
  const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*Math.min(HEAP_R,g.L.width*.05);
  return pileT(g.cx+Math.cos(a)*r,g.hy+Math.sin(a)*r*.7,Math.random()*360,180,HEAP_SC);
}
function pileSweep(){
  const layer=pileEl(),g=pileGeo();
  pileGroups=[];TS=1;
  layer.querySelectorAll('.ktag').forEach(e=>e.remove());
  for(let q=0;q<4;q++)passChip(q,false);
  layer.querySelectorAll('.pc.cur,.pc.old').forEach(el=>{
    el.classList.remove('cur','old');
    el.style.transitionDelay=(Math.random()*120|0)+'ms';
    el.style.zIndex=++heapZ;
    el.style.transform=heapSpot(g);
  });
}
// redraw the pile from state (page update or window resize), without animation
function pileRebuild(){
  const layer=pileEl(),g=pileGeo();
  layer.querySelectorAll('.pc,.ktag').forEach(e=>e.remove());
  for(let q=0;q<4;q++)passChip(q,false);
  pileZ=1000;heapZ=1;pileGroups=[];TS=1;
  for(let i=0;i<(G.heapN||0);i++){
    const el=document.createElement('div');
    el.className='pc';el.innerHTML='<div class="bk"></div>';
    el.style.zIndex=++heapZ;el.style.transform=heapSpot(g);
    layer.appendChild(el);
  }
  for(const t of G.trickPlays||[])pileThrow(t.p,t.play,null,false);
  G.last.forEach((l,p)=>{if(l==='pass')pilePass(p)});
}

// the hand in the order the player arranged it; cards that arrive later slot in by rank
function orderedHand(){
  const h=G.hands[0],byId=new Map(h.map(c=>[c.id,c]));
  const ord=(G.myOrder||[]).filter(id=>byId.has(id));
  if(ord.length!==h.length){
    const have=new Set(ord);
    for(const c of sortHand(h.slice(),G.L)){
      if(have.has(c.id))continue;
      const i=ord.findIndex(id=>cmpCards(byId.get(id),c,G.L)>0);
      if(i<0)ord.push(c.id);else ord.splice(i,0,c.id);
    }
  }
  G.myOrder=ord;
  return ord.map(id=>byId.get(id));
}
let handView='fan',handRows=3,flatRows=1,flatShown=1,flatOneFits=true;
try{
  handView=localStorage.getItem('guandan-view')||'fan';
  handRows=+localStorage.getItem('guandan-rows')||3;
  flatRows=+localStorage.getItem('guandan-flatrows')||1;
}catch(_){}
const fanMode=()=>handView==='fan';
function renderHand(){
  if(mv&&mv.active){mv.dirty=true;return} // never rebuild the hand under a card being dragged
  const el=$('#hand');
  const fresh=new Set(G.fresh);

// slot positions for n cards: a flat row (or two), or a fan held in the hand, bowed along a wide arc
// keys: each position's card value, so the fanned rows never split cards of the same rank
const sideBtns=()=>matchMedia('(min-width:561px)').matches;
const BTN_GAP=18;
function handGeo(n,keys){
  const el=$('#hand'),probe=el.firstElementChild;
  const W=el.clientWidth-(sideBtns()?$('#btns').offsetWidth+BTN_GAP:0);
  const cw=probe.offsetWidth,ch=probe.offsetHeight;
  return fanMode()?fanGeo(n,W,cw,ch,keys):flatGeo(n,W,cw,ch,keys);
}
// a card's corner index (rank over suit) takes about half its height
const ROW_STEP=.58;
// flat rows of about equal length, the player's choice of one to three; a single row too cramped to read becomes two
function flatGeo(n,W,cw,ch,keys){
  let rows=Math.max(1,Math.min(flatRows,Math.ceil(n/5)));
  flatOneFits=!(n>12&&(W-cw)/(n-1)<cw*.36);
  if(rows===1&&!flatOneFits)rows=2;
  flatShown=rows;
  const counts=rowCounts(n,keys,rows,[1,1,1].slice(0,rows),false);
  const most=Math.max(...counts);
  const off=Math.min(most>1?(W-cw)/(most-1):0,cw*.5);
  // each row steps down far enough that the row behind still shows its whole corner: rank and suit
  const lift=Math.round(ch*.22),rowGap=Math.round(ch*ROW_STEP);
  const slots=[];
  counts.forEach((k,r)=>{
    for(let j=0;j<k;j++)slots.push({x:(W-(cw+off*(k-1)))/2+j*off,y:lift+r*rowGap,rot:0});
  });
  return{slots,cw,ch,height:lift+ch+(counts.length-1)*rowGap+4};
}
// cards held the way people hold 27 of them: two or three concentric fanned rows turning about one point below the hand.
// The back (top) ring is the widest and holds the most cards; each ring in front is smaller and holds fewer,
// and only the corners of a ring show above the one in front of it.
// how many cards go in each ring, back to front: close to 5:4:3 (or 5:4), cut only where the rank changes so a run
// of equal cards always stays in one ring, and preferring splits where each ring holds no more than the one behind it
function rowCounts(n,keys,rows,w,decreasing){
  if(rows<=1)return[n];
  const sum=w.reduce((a,b)=>a+b,0);
  const ideal=w.map(x=>n*x/sum);
  const edges=[];
  for(let b=1;b<n;b++)if(!keys||keys[b]!==keys[b-1])edges.push(b);
  const cost=c=>{
    let e=0;
    c.forEach((k,r)=>{e+=Math.abs(k-ideal[r]);if(decreasing&&r&&k>c[r-1])e+=3*(k-c[r-1])});
    return e;
  };
  let best=[n],bestE=Infinity;
  if(rows===2){
    for(const a of edges){const c=[a,n-a],e=cost(c);if(e<bestE){bestE=e;best=c}}
  }else{
    for(const a of edges)for(const b of edges){
      if(b<=a)continue;
      const c=[a,b-a,n-b],e=cost(c);
      if(e<bestE){bestE=e;best=c}
    }
  }
  return best;
}
function fanGeo(n,W,cw,ch,keys){
  const rows=Math.max(1,Math.min(handRows,Math.ceil(n/10)));
  const counts=rowCounts(n,keys,rows,[5,4,3].slice(0,rows),true);
  const rowGap=ch*ROW_STEP,lift=ch*.2;
  // radius at the back ring's top edge, and one angular step shared by every ring
  let r0=ch*2.6;
  const step=counts[0]>1?Math.min(cw*.6/r0,1.2/(counts[0]-1)):0;
  const wide=2*r0*Math.sin(step*(counts[0]-1)/2)+cw;
  if(wide>W*.94)r0*=(W*.94-cw)/(wide-cw);
  const raw=[];
  let i=0;
  counts.forEach((k,r)=>{
    const rTop=r0-r*rowGap,rc=rTop-ch/2;
    // smaller rings open up a little so their corners stay readable
    const st=Math.max(step,cw*.42/rTop);
    for(let j=0;j<k;j++,i++){
      const th=(j-(k-1)/2)*st;
      raw.push({cx:W/2+rc*Math.sin(th),cy:-rc*Math.cos(th),rot:th*180/Math.PI});
    }
  });
  const top=Math.min(...raw.map(s=>s.cy));
  const slots=raw.map(s=>({x:s.cx-cw/2,y:s.cy-top+lift,rot:s.rot}));
  return{slots,cw,ch,height:Math.max(...slots.map(s=>s.y))+ch+cw*.25};
}
function cardKey(id){const c=G.hands[0].find(x=>x.id===id);return c?val(c,G.L):0}
// row-split keys for a hand in this order: a card's rank, except that the cards of a group you dragged together
// share one key, so the rows never cut through the group (it only counts while it is still in one piece)
function handKeys(ids){
  const keys=ids.map(cardKey);
  (G.blocks||[]).forEach((b,bi)=>{
    const at=b.map(id=>ids.indexOf(id)).filter(i=>i>=0).sort((x,y)=>x-y);
    if(at.length<2||at[at.length-1]-at[0]!==at.length-1)return;
    for(const i of at)keys[i]='g'+bi;
  });
  return keys;
}
// a dragged group lands tidied: if it makes a combination it is laid out the way that combination reads
// (a straight runs low to high), otherwise it is sorted by rank
function tidyGroup(ids){
  const cards=ids.map(id=>G.hands[0].find(c=>c.id===id)).filter(Boolean);
  const reads=analyze(cards,G.L).sort((a,b)=>strength(b)-strength(a));
  const out=reads.length?displayOrder({...reads[0],cards},G.L):sortHand(cards.slice(),G.L);
  return out.map(c=>c.id);
}
function placeCard(c,slot,i){
  const fresh=!c.style.left;
  if(fresh)c.style.transition='none';
  c.style.left=slot.x+'px';c.style.top=slot.y+'px';c.style.zIndex=i;
  c.style.setProperty('--rot',slot.rot.toFixed(2)+'deg');
  if(fresh){c.getBoundingClientRect();c.style.transition=''}
}
function layoutHand(){
  const el=$('#hand'),cards=[...el.children],n=cards.length;
  el.classList.toggle('fan',fanMode());
  // while dealing, each card goes straight into its slot in a full 27-card hand,
  // so cards already dealt never shift and the hand's height (and the table above it) stays put
  const dealing=G&&(G.phase==='deal'||G.phase==='shuffle'||G.phase==='cut');
  if(!n&&!dealing){el.style.height='';return}
  let probe=null;
  if(!n){probe=document.createElement('div');probe.className='card';probe.style.visibility='hidden';el.appendChild(probe)}
  const g=handGeo(dealing?27:n,dealing?null:handKeys(cards.map(c=>+c.dataset.id)));
  if(probe)probe.remove();
  cards.forEach((c,i)=>placeCard(c,g.slots[i],i));
  el.style.height=g.height+'px';

}
// the button column hugs the right edge of the cards, centred on the hand's height
function placeButtons(g){
  const b=$('#btns');
  if(!sideBtns()){b.style.left=b.style.top='';return}
  const el=$('#hand'),bw=b.offsetWidth,bh=b.offsetHeight;
  const right=g.slots.length?Math.max(...g.slots.map(s=>s.x))+g.cw*(fanMode()?1.25:1):el.clientWidth/2;
  b.style.left=Math.min(right+BTN_GAP,el.clientWidth-bw)+'px';

/* ---------- shuffling and cutting ---------- */
function makeStack(n){
  const d=document.createElement('div');d.className='stack';
  for(let i=0;i<n;i++){const c=document.createElement('div');c.className='sb';c.style.transform=`translate(${-i*.7}px,${-i*.9}px)`;d.appendChild(c)}
  return d;
}
const stackAt=(el,g,dx,dy,rot=0)=>{el.style.transform=`translate(${g.cx+dx}px,${g.hy+dy}px) rotate(${rot}deg)`};
function showDeck(){
  removeDeck();
  const g=pileGeo(),d=makeStack(8);d.id='deck';
  d.style.transition='none';stackAt(d,g,0,0);
  pileEl().appendChild(d);d.getBoundingClientRect();d.style.transition='';
}
function removeDeck(){pileEl().querySelectorAll('.stack,.flick').forEach(e=>e.remove());markActor(-1)}
// requestAnimationFrame tween; the callback is dropped if a new game or round has started meanwhile
function tween(dur,step,done){
  const t0=performance.now(),tok=G.tok;
  const f=t=>{
    if(G.tok!==tok)return;
    const k=Math.min(1,(t-t0)/dur);
    step(k);
    if(k<1)requestAnimationFrame(f);else if(done)done();
  };
  requestAnimationFrame(f);
}
const easeOut=k=>1-Math.pow(1-k,3),easeInOut=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
// a card-sharp's shuffle: fan the deck open, riffle the halves into a waterfall, spring the cards
// across in an arc from hand to hand, then square the deck up with a tap
function animShuffle(done,at){
  let g=pileGeo();if(at)g={...g,cx:at.x,hy:at.y};
  const deck=$('#deck');
  if(!deck||reduceMotion()){Sound.play('shuffle');later(done,300);return}
  const layer=pileEl(),cx=g.cx,cy=g.hy,cw=g.cw,tok=G.tok;
  const finish=()=>{if(G.tok===tok)done()};
  const mk=()=>{const f=document.createElement('div');f.className='flick';f.style.transition='none';layer.appendChild(f);return f};
  const put=(f,x,y,r,sc=1)=>{f.style.transform=`translate(${x}px,${y}px) rotate(${r}deg) scale(${sc})`};
  deck.style.transition='none';deck.style.opacity='0';

  // 1. the fan: the whole deck sweeps open into a wide arc and snaps shut
  const fan=[];
  for(let i=0;i<24;i++){const f=mk();f.style.transformOrigin='50% 130%';put(f,cx,cy,0);fan.push(f)}
  Sound.play('whoosh');Sound.play('flick');
  tween(420,k=>fan.forEach((f,i)=>put(f,cx,cy-10*easeOut(k),(i-11.5)*6.5*easeOut(k))),()=>{
    later(()=>{
      Sound.play('riffle');
      tween(260,k=>fan.forEach((f,i)=>put(f,cx,cy-10*(1-k),(i-11.5)*6.5*(1-easeInOut(k)))),()=>{
        fan.forEach(f=>f.remove());
        riffle();
      });
    },260);
  });

  // 2. the riffle: two tilted halves, cards cascading in from alternate sides
  const A=makeStack(4),B=makeStack(4);
  function riffle(){
    for(const st of [A,B]){st.style.transition='none';stackAt(st,g,0,0);layer.appendChild(st);st.getBoundingClientRect();st.style.transition=''}
    const split=cw*1.25;
    stackAt(A,g,-split,8,-16);stackAt(B,g,split,8,16);
    Sound.play('riffleLong');
    later(()=>Sound.play('riffleLong'),560);
    for(let i=0;i<28;i++)later(()=>{
      const f=mk(),sx=i%2?split:-split,r0=i%2?16:-16;
      tween(150,k=>put(f,cx+sx*(1-k),cy+8-14*Math.sin(Math.PI*k)-i*.15,r0*(1-k)),()=>f.remove());
    },260+i*26);
    later(()=>{stackAt(A,g,-cw*.08,0,-3);stackAt(B,g,cw*.08,0,3)},260+28*26+120);
    later(spring,260+28*26+420);
  }

  // 3. the spring: cards leap from one hand to the other in a high arc
  function spring(){
    const lx=-cw*1.7,rx=cw*1.7,peak=cw*1.9;
    stackAt(A,g,lx,0,-8);stackAt(B,g,rx,0,8);
    later(()=>Sound.play('whoosh'),200);
    for(let i=0;i<20;i++)later(()=>{
      Sound.play('flick');
      const f=mk();
      tween(380,k=>{
        const e=easeInOut(k);
        put(f,cx+lx+(rx-lx)*e,cy-peak*4*e*(1-e),-8+16*e+Math.sin(k*Math.PI)*-24,1+.12*Math.sin(k*Math.PI));
      },()=>f.remove());
    },220+i*34);
    later(squareUp,220+20*34+420);
  }

  // 4. square up: both halves come together and the deck takes a little tap on the table
  function squareUp(){
    stackAt(A,g,0,0);stackAt(B,g,0,0);
    later(()=>{
      A.remove();B.remove();
      deck.style.transition='';deck.style.opacity='1';
      stackAt(deck,g,0,-6);
      later(()=>{stackAt(deck,g,0,0);Sound.play('cardSlap')},140);
      later(finish,420);
    },300);
  }
}
// a cut: the top half is lifted off and set down beside, then the bottom half goes on top of it
function animCut(done,at){
  let g=pileGeo();if(at)g={...g,cx:at.x,hy:at.y};
  const deck=$('#deck');
  if(!deck||reduceMotion()){Sound.play('play');later(done,300);return}
  const top=makeStack(4);top.style.transition='none';stackAt(top,g,0,-4);top.style.zIndex=7050;pileEl().appendChild(top);top.getBoundingClientRect();top.style.transition='';
  const side=g.cw*1.5;
  later(()=>{stackAt(top,g,0,-g.cw*.5,-4);Sound.play('flick')},60);
  later(()=>Sound.play('cardSlap'),680);
  later(()=>stackAt(top,g,side,0,4),380);
  later(()=>{deck.style.zIndex=7080;stackAt(deck,g,side,-6,2)},760);
  later(()=>Sound.play('cardSlap'),1050);
  later(()=>Sound.play('play'),1450);
  later(()=>{stackAt(deck,g,0,0);stackAt(top,g,0,4)},1250);
  later(()=>{top.remove();deck.style.zIndex='';done()},1650);
}

/* ---------- dealing animation ---------- */
const reduceMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function fly(p){
  if(reduceMotion())return;
  const a=$('.emblem').getBoundingClientRect();
  const t=(p===0?$('#hand'):$('#seat'+p+' .who .back')).getBoundingClientRect();
  const sx=a.left+a.width/2,sy=a.top+a.height/2;
  const tx=t.left+t.width/2+(p===0?(Math.random()-.5)*t.width*.5:0),ty=p===0?t.top+t.height*.55:t.top+t.height/2;
  const f=document.createElement('div');
  f.className='flyer';
  f.style.transform=`translate(${sx}px,${sy}px)`;
  document.body.appendChild(f);
  f.getBoundingClientRect();
  f.style.transform=`translate(${tx}px,${ty}px) rotate(${(Math.random()-.5)*40}deg) scale(${p===0?1.3:.8})`;
  setTimeout(()=>{f.style.opacity='0'},180);
  setTimeout(()=>f.remove(),300);
}
function seatPoint(p){
  const r=(p===0?$('#hand'):$('#seat'+p+' .who')).getBoundingClientRect();
  return{x:r.left+r.width/2,y:p===0?r.top+r.height*.45:r.top+r.height/2};
}
// a face-up card travels giver -> table centre (pauses so everyone can read it) -> receiver
function giveAnim(from,to,card,label){
  return new Promise(done=>{
    Sound.play('deal');
    if(reduceMotion()){setTimeout(done,700);return}
    const a=seatPoint(from),b=seatPoint(to),m=$('.emblem').getBoundingClientRect();
    const mx=m.left+m.width/2,my=m.top+m.height/2;
    const w=document.createElement('div');
    w.className='gift';
    w.innerHTML=`<span class="gl">${NAMES[from]} ${label}</span>${cardHTML(card,G.L)}`;
    w.style.transform=`translate(${a.x}px,${a.y}px) scale(.55)`;
    w.style.opacity='0';
    document.body.appendChild(w);
    w.getBoundingClientRect();
    w.style.transform=`translate(${mx}px,${my}px) scale(1)`;
    w.style.opacity='1';
    setTimeout(()=>Sound.play('play'),550);
    setTimeout(()=>{w.style.transform=`translate(${b.x}px,${b.y}px) scale(.55)`},1500);
    setTimeout(()=>{w.style.opacity='0'},1900);
    setTimeout(()=>{w.remove();done()},2100);
  });
}
function dealView(p,c){

}
// a count is only announced once a hand is down to 10 or fewer (never while dealing)
function showCount(el,n){
